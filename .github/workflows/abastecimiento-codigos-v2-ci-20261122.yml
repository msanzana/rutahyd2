name: CI proveedor producto y códigos de barras SQL DDL
on:
  push:
    branches: [feature/proveedores-productos-barcodes-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integracion:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: temporal_ci_solamente
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptemporal_ci_solamente --silent"
          --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, intl, xml, dom, curl, pdo_mysql, openssl, fileinfo
      - name: Comprobar sintaxis PHP y SQL exclusivamente versionado
        run: |
          set -euo pipefail
          for source in app/Http/Controllers/ProductoComercialControlador.php app/Http/Controllers/CatalogoComercialControlador.php app/Http/Controllers/ClasificacionProductoControlador.php app/Http/Controllers/ProductosProveedoresControlador.php app/Http/Controllers/CodigosBarrasProductoControlador.php app/Http/Controllers/EntidadesComercialesControlador.php app/Services/PermisosCatalogos.php routes/api.php tests/integracion_proveedores_codigos.php; do
            php -l "$source"
          done
          test -s database/espanol/20_proveedores_productos_codigos_barras_ddl.sql
          test -s database/espanol/21_catalogos_referencia_semillas.sql
          ! grep -Eiq 'DROP TABLE|TRUNCATE' database/espanol/20_proveedores_productos_codigos_barras_ddl.sql
      - name: Cargar tablas históricas y DDL20 en MySQL temporal
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente < database/espanol/01_esquema_completo_34_tablas_es.sql
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente < database/espanol/05_semillas_es.sql
          for f in 12_tokens_acceso_opcional.sql 13_catalogos_comerciales_aditivos.sql 14_productos_clasificacion_campos.sql 16_permisos_modulos_producto.sql 18_recuperacion_contrasenas.sql 20_proveedores_productos_codigos_barras_ddl.sql 21_catalogos_referencia_semillas.sql; do
            mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente rutahyd2_es_local < "database/espanol/$f"
          done
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente rutahyd2_es_local < database/espanol/20_proveedores_productos_codigos_barras_ddl.sql
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente rutahyd2_es_local < database/espanol/21_catalogos_referencia_semillas.sql
          mysql -N -h 127.0.0.1 -uroot -ptemporal_ci_solamente rutahyd2_es_local -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='rutahyd2_es_local' AND table_type='BASE TABLE'" | grep -Fxq '50'
          mysql -N -h 127.0.0.1 -uroot -ptemporal_ci_solamente rutahyd2_es_local -e "SELECT COUNT(*) FROM tipos_codigos_barras" | grep -Fxq '11'
      - name: Instalar Laravel y compilar rutas protegidas
        env:
          APP_ENV: testing
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: rutahyd2_es_local
          DB_USERNAME: root
          DB_PASSWORD: temporal_ci_solamente
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          php artisan route:list --path=api/v1
      - name: Probar JWT catálogos productos y proveedores usando SQL temporal
        env:
          APP_NAME: RutaHD2_CI
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          RUTAHD_JWT_SECRET: 'CI_ONLY_JWT_TEST_SIGNING_KEY_DO_NOT_USE_IN_PRODUCTION_2026'
          APP_URL: 'http://127.0.0.1'
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: rutahyd2_es_local
          DB_USERNAME: root
          DB_PASSWORD: temporal_ci_solamente
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set -euo pipefail
          php tests/integracion_catalogos_api.php
          php tests/integracion_productos_crud.php
          php tests/integracion_proveedores_codigos.php
          echo 'DDL 20 y semillas 21 validados sobre MySQL temporal. Sin conexión a InfinityFree.' >> "$GITHUB_STEP_SUMMARY"
