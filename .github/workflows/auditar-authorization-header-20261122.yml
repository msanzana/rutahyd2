name: Auditar transporte Authorization InfinityFree sin credenciales
on:
  push:
    branches: [main]
    paths: [deployment/solicitudes/auditar-authorization-header-20261122.txt]
permissions:
  contents: read
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    steps:
      - name: Instalar FTPS y Chromium
        run: |
          test -n "$FTP_PASSWORD"
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp
          mkdir -p /tmp/hd-auth-transport && cd /tmp/hd-auth-transport
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Crear diagnóstico efímero con autorización independiente
        run: |
          set +x
          umask 077
          python3 - <<'PY'
          import secrets,os,time,pathlib
          file='hd_header_'+secrets.token_hex(16)+'.php'
          key=secrets.token_hex(32)
          source='''<?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');
          header('X-Content-Type-Options: nosniff');
          if(time()>__EXPIRES__ || ($_SERVER['REQUEST_METHOD']??'')!=='POST'
            || !hash_equals('__KEY__',(string)($_SERVER['HTTP_X_HD_DIAG']??''))){
             http_response_code(404); exit;
          }
          $raw=(string)($_SERVER['HTTP_AUTHORIZATION']??'');
          $redirect=(string)($_SERVER['REDIRECT_HTTP_AUTHORIZATION']??'');
          $headers=function_exists('getallheaders')?getallheaders():[];
          $header='';
          foreach($headers as $name=>$value){
            if(strtolower((string)$name)==='authorization')$header=(string)$value;
          }
          $expected='Bearer hd-diagnostic-header';
          echo json_encode([
            'direct'=>hash_equals($expected,$raw),
            'redirect'=>hash_equals($expected,$redirect),
            'from_headers'=>hash_equals($expected,$header),
            'available_any'=>($raw!==''||$redirect!==''||$header!==''),
            'php_sapi'=>PHP_SAPI,
          ]);
          '''
          source=source.replace('__EXPIRES__',str(int(time.time()+900))).replace('__KEY__',key)
          pathlib.Path('/tmp/hd_header.php').write_text(source)
          with open(os.environ['GITHUB_ENV'],'a') as out:
            out.write('HEADER_PROBE_FILE='+file+'\nHEADER_PROBE_KEY='+key+'\n')
          print('Prueba sin JWT ni cuenta de usuario con expiración a 15 minutos.')
          PY
          php -l /tmp/hd_header.php
      - name: Comprobar configuración actual y subir archivo temporal protegido
        run: |
          set -euo pipefail
          set +x
          umask 077
          cat >/tmp/header-preflight.lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          get /htdocs/api/.htaccess -o /tmp/header-api-htaccess
          get /htdocs/api/index.php -o /tmp/header-api-gateway
          get /htdocs/api-v2/.htaccess -o /tmp/header-private-guard
          bye
          EOF
          lftp -f /tmp/header-preflight.lftp >/dev/null
          grep -Fq 'Require all denied' /tmp/header-private-guard
          grep -Fq 'rutahd2_api_ready' /tmp/header-api-gateway
          echo "AUTH_HTACCESS_PRESERVES_HEADER=$(grep -Eiq 'HTTP_AUTHORIZATION|Authorization' /tmp/header-api-htaccess && echo YES || echo NO)"
          cat >/tmp/header-put.lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          put /tmp/hd_header.php -o "/htdocs/$HEADER_PROBE_FILE"
          bye
          EOF
          lftp -f /tmp/header-put.lftp >/dev/null
      - name: Probar Authorization ficticio desde navegador real
        working-directory: /tmp/hd-auth-transport
        run: |
          set +x
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({locale:'es-CL'});
            await page.goto('https://rutahyd2.free.nf/',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(12000);
            const result=await page.evaluate(async ({file,key})=>{
              const resp=await fetch('/'+file,{
                method:'POST',credentials:'same-origin',cache:'no-store',
                headers:{Accept:'application/json',Authorization:'Bearer hd-diagnostic-header',
                  'X-HD-Diag':key}
              });
              const value=(resp.headers.get('Content-Type')||'').includes('json')?await resp.json():{};
              return {http:resp.status,direct:value.direct===true,redirect:value.redirect===true,
                from_headers:value.from_headers===true,available_any:value.available_any===true,
                sapi:value.php_sapi||'unknown'};
            },{file:process.env.HEADER_PROBE_FILE,key:process.env.HEADER_PROBE_KEY});
            console.log('AUTH_HEADER_TRANSPORT_DIAG',JSON.stringify(result));
            if(result.http!==200)process.exitCode=1;
          }finally{await browser.close();}
          JS
      - name: Eliminar archivo temporal siempre
        if: always()
        run: |
          set +x
          if [ -n "$HEADER_PROBE_FILE" ]; then
            cat >/tmp/header-rm.lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          rm "/htdocs/$HEADER_PROBE_FILE"
          bye
          EOF
            lftp -f /tmp/header-rm.lftp >/dev/null || echo "::warning::No se confirmó limpieza; expiración a 15 minutos."
          fi
          rm -f /tmp/header-*.lftp /tmp/hd_header.php /tmp/header-private-guard /tmp/header-api-gateway /tmp/header-api-htaccess
          echo 'No se ejecutó DDL, DML, login, ni se cambió JWT o .env.' >> "$GITHUB_STEP_SUMMARY"
