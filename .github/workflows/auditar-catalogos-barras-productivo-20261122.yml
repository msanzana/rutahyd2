name: Auditar DDL20 y catalogos21 productivos de solo lectura
on:
  push:
    branches: [main]
    paths: [deployment/solicitudes/auditar-catalogos-barras-productivo-20261122.txt]
permissions:
  contents: read
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    steps:
      - name: Instalar FTPS y Chromium
        run: |
          set -euo pipefail
          test -n "$FTP_PASSWORD"
          sudo apt-get -qq update
          sudo apt-get -qq install -y lftp
          mkdir -p /tmp/rutahd-audit
          cd /tmp/rutahd-audit
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Crear diagnóstico privado sin credenciales ni escrituras
        run: |
          set -euo pipefail
          set +x
          umask 077
          python3 - <<'PY'
          import secrets,time,pathlib,os
          name='hd_sql20_check_'+secrets.token_hex(16)+'.php'
          key=secrets.token_hex(32)
          php=r'''<?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');
          header('X-Content-Type-Options: nosniff');
          if(($_SERVER['REQUEST_METHOD']??'')!=='POST'||time()>__EXPIRES__||
             !hash_equals('__KEY__',(string)($_SERVER['HTTP_X_HD_AUDIT']??''))){
            http_response_code(404);exit;
          }
          try {
            $base=__DIR__.'/api-v2';
            require $base.'/vendor/autoload.php';
            \Dotenv\Dotenv::createImmutable($base)->safeLoad();
            if(($_ENV['DB_HOST']??'')!=='sql307.infinityfree.com'||
               ($_ENV['DB_DATABASE']??'')!=='if0_43460400_rutahyd2_es'){
               throw new \RuntimeException('wrong_database');
            }
            $pdo=new \PDO('mysql:host='.$_ENV['DB_HOST'].
                ';port=3306;dbname='.$_ENV['DB_DATABASE'].';charset=utf8mb4',
                (string)($_ENV['DB_USERNAME']??''),(string)($_ENV['DB_PASSWORD']??''),
                [\PDO::ATTR_ERRMODE=>\PDO::ERRMODE_EXCEPTION,\PDO::ATTR_TIMEOUT=>8]);
            $count=function(string $sql)use($pdo):int{
               return (int)$pdo->query($sql)->fetchColumn();
            };
            $tables=['tipos_codigos_barras','productos_proveedores',
                     'productos_codigos_barra_venta','productos_codigos_barra_compra'];
            $existing=[];
            $sql="SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name=";
            foreach($tables as $t){
               $quoted=$pdo->quote($t);
               $existing[$t]=$count($sql.$quoted)===1;
            }
            $res=['schema'=>'correct','tables'=>$existing,
                  'tables_new'=>count(array_filter($existing))];
            if($res['tables_new']===4){
               $res['barcode_types']=$count("SELECT COUNT(*) FROM tipos_codigos_barras WHERE codigo IN ('EAN13','EAN8','DUN14','ITF14','CODE39','CODE128','GS1128','UPCA','UPCE','QRCODE','DATAMATRIX')");
               $res['supplier_product_columns']=$count("SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='productos_proveedores' AND column_name IN ('producto_id','proveedor_id','codigo_proveedor_producto','costo_proveedor','ultima_recepcion_id','fecha_ultima_recepcion','activo')");
               $res['foreign_keys']=$count("SELECT COUNT(*) FROM information_schema.key_column_usage WHERE table_schema=DATABASE() AND table_name IN ('productos_proveedores','productos_codigos_barra_venta','productos_codigos_barra_compra') AND referenced_table_name IS NOT NULL");
               $res['permissions']=$count("SELECT COUNT(*) FROM permisos WHERE codigo IN ('productos.catalogos.tipos_codigos_barras.ver','productos.catalogos.tipos_codigos_barras.gestionar')");
               $res['units']=$count("SELECT COUNT(*) FROM tipos_unidad WHERE nombre IN ('Unidad','kg','gr','Caja','Bolsa','Pack','Litro','ml')");
               $res['packages']=$count("SELECT COUNT(*) FROM tipos_envasado WHERE nombre IN ('Caja','Bolsa','Botella','Lata','Bandeja','Pallet')");
               $res['total_tables']=$count("SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_type='BASE TABLE'");
            }
            $res['ready']=$res['tables_new']===4&&($res['barcode_types']??0)===11&&
             ($res['supplier_product_columns']??0)===7&&($res['foreign_keys']??0)===6&&
             ($res['permissions']??0)===2&&($res['units']??0)===8&&($res['packages']??0)===6;
            echo json_encode($res,JSON_UNESCAPED_UNICODE);
          } catch(\Throwable $e) {
            http_response_code(503);
            echo json_encode(['ready'=>false,'stage'=>'pdo_ro','error_class'=>get_class($e)]);
          }
          '''
          php=php.replace('__KEY__',key).replace('__EXPIRES__',str(int(time.time()+900)))
          pathlib.Path('/tmp/sql20_probe.php').write_text(php)
          with open(os.environ['GITHUB_ENV'],'a') as f:
             f.write('PROBE_FILE='+name+'\nAUDIT_KEY='+key+'\n')
          PY
          php -l /tmp/sql20_probe.php
      - name: Subir sonda de lectura temporal y protegida
        run: |
          set -euo pipefail
          set +x
          cat >/tmp/upload_sql20.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 45
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          put /tmp/sql20_probe.php -o "/htdocs/$PROBE_FILE"
          bye
          EOF
          lftp -f /tmp/upload_sql20.lftp >/dev/null
      - name: Leer recuentos mediante Chromium de forma segura
        working-directory: /tmp/rutahd-audit
        run: |
          set -euo pipefail
          set +x
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({locale:'es-CL'});
            await page.goto('https://rutahyd2.free.nf/',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(10000);
            const result=await page.evaluate(async({name,key})=>{
              const controller=new AbortController();
              const t=setTimeout(()=>controller.abort(),20000);
              try{
                const res=await fetch('/'+name,{method:'POST',cache:'no-store',
                   credentials:'same-origin',headers:{'X-HD-Audit':key,
                     'Accept':'application/json'},signal:controller.signal});
                const json=(res.headers.get('content-type')||'').includes('json')?await res.json():{};
                return {http:res.status,...json};
              }finally{clearTimeout(t)}
            },{name:process.env.PROBE_FILE,key:process.env.AUDIT_KEY});
            console.log('SQL20_PRODUCCION_READONLY',JSON.stringify(result));
            if(result.http!==200||result.ready!==true)throw Error('La estructura o semillas productivas aun no coinciden con SQL20/21');
          }finally{await browser.close();}
          JS
          echo 'DDL20 y DML21 comprobados con SELECT y sin exponer credenciales.' >> "$GITHUB_STEP_SUMMARY"
      - name: Eliminar archivo PHP temporal siempre
        if: always()
        run: |
          set +x
          if [ -n "$PROBE_FILE" ]; then
            cat >/tmp/delete_sql20.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 45
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          rm "/htdocs/$PROBE_FILE"
          bye
          EOF
            lftp -f /tmp/delete_sql20.lftp >/dev/null || echo "::error::Revisar la eliminación de sonda temporal protegida; caduca a los 15 minutos."
          fi
          rm -f /tmp/sql20_probe.php /tmp/upload_sql20.lftp /tmp/delete_sql20.lftp
          echo 'Sin escrituras ni cambios en MariaDB, JWT, SMTP o frontend.' >> "$GITHUB_STEP_SUMMARY"
