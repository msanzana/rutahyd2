name: V38 - auditoría SQL DDL29 a DDL32 (solo lectura)
on:
  push:
    branches: [feature/proveedores-ubicaciones-sii-v38]
    paths:
      - .github/workflows/auditar-ddl29-32-v38.yml
permissions:
  contents: read
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  auditar:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar herramientas FTPS y navegador
        run: |
          set -euo pipefail
          test -n "$FTP_PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          mkdir -p /tmp/rutahd-v38-audit/browser
          cd /tmp/rutahd-v38-audit/browser
          npm init -y >/dev/null
          npm install --no-audit --no-fund -q playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Crear sonda temporal protegida y de consulta exclusivamente SQL
        run: |
          set -euo pipefail
          set +x
          umask 077
          python3 - <<'PY'
          import pathlib, secrets, time, os
          name='hd_v38_schema_'+secrets.token_hex(16)+'.php'
          token=secrets.token_hex(32)
          expires=str(int(time.time()+900))
          php=r'''<?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');
          header('X-Content-Type-Options: nosniff');
          if(($_SERVER['REQUEST_METHOD']??'')!=='POST'
            || time()>__EXPIRES__
            || !hash_equals('__TOKEN__',(string)($_SERVER['HTTP_X_HD_V38_AUDIT']??''))){
            http_response_code(404);exit;
          }
          try {
            $root=__DIR__.'/api-v2';
            require $root.'/vendor/autoload.php';
            \Dotenv\Dotenv::createImmutable($root)->safeLoad();
            if(($_ENV['DB_HOST']??'')!=='sql307.infinityfree.com'
              || ($_ENV['DB_DATABASE']??'')!=='if0_43460400_rutahyd2_es')
              throw new RuntimeException('destino_inesperado');
            $pdo=new PDO('mysql:host='.$_ENV['DB_HOST'].
              ';port=3306;dbname='.$_ENV['DB_DATABASE'].';charset=utf8mb4',
              (string)($_ENV['DB_USERNAME']??''),(string)($_ENV['DB_PASSWORD']??''),
              [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,
               PDO::ATTR_TIMEOUT=>8,
               PDO::ATTR_EMULATE_PREPARES=>false]);
            $pdo->exec('SET SESSION TRANSACTION READ ONLY');
            $fetchCount=function(string $sql)use($pdo):int{
              return (int)$pdo->query($sql)->fetchColumn();
            };
            $tableList=['paises','regiones','provincias','comunas','ciudades'];
            $tableSet=$pdo->query('SELECT TABLE_NAME FROM information_schema.TABLES WHERE TABLE_SCHEMA=DATABASE()')
              ->fetchAll(PDO::FETCH_COLUMN);
            $missingTables=array_values(array_diff($tableList,$tableSet));
            $expected=[
              'paises'=>['codigo_iso2','nombre'],
              'regiones'=>['pais_id','codigo_cut','nombre'],
              'provincias'=>['region_id','codigo_cut','nombre'],
              'comunas'=>['provincia_id','codigo_cut','nombre'],
              'ciudades'=>['comuna_id','nombre','tipo_localidad'],
              'proveedores'=>[
                'razon_social','nombre_fantasia','rut','giro','actividad_economica_codigo',
                'tipo_contribuyente','inicio_actividades','situacion_tributaria','correo_dte',
                'telefono_secundario','sitio_web','representante_legal','representante_rut',
                'contacto_nombre','contacto_cargo','contacto_telefono','contacto_correo',
                'direccion_numero','direccion_detalle','codigo_postal','ciudad_id',
                'observaciones','moneda_preferida','plazo_pago_dias'],
              'clientes'=>['ciudad_id'],
              'usuarios'=>['ciudad_id'],
              'bodegas'=>['ciudad_id']
            ];
            if(in_array('empresas',$tableSet,true))$expected['empresas']=['ciudad_id'];
            $columns=$pdo->query('SELECT TABLE_NAME,COLUMN_NAME
              FROM information_schema.COLUMNS WHERE TABLE_SCHEMA=DATABASE()')
              ->fetchAll(PDO::FETCH_ASSOC);
            $byTable=[];
            foreach($columns as $col)$byTable[$col['TABLE_NAME']][]=$col['COLUMN_NAME'];
            $missingColumns=[];
            foreach($expected as $table=>$cols){
              $missing=array_values(array_diff($cols,$byTable[$table]??[]));
              if($missing)$missingColumns[$table]=$missing;
            }
            $fkRows=$pdo->query("SELECT TABLE_NAME FROM information_schema.KEY_COLUMN_USAGE
              WHERE TABLE_SCHEMA=DATABASE() AND COLUMN_NAME='ciudad_id'
              AND REFERENCED_TABLE_NAME='ciudades' AND REFERENCED_COLUMN_NAME='id'")
              ->fetchAll(PDO::FETCH_COLUMN);
            $fkEntities=['proveedores','clientes','usuarios','bodegas'];
            if(in_array('empresas',$tableSet,true))$fkEntities[]='empresas';
            $missingFks=array_values(array_diff($fkEntities,$fkRows));
            $counts=['paises_chile'=>0,'regiones'=>0,'provincias'=>0,'comunas'=>0,
              'referencias_ciudad'=>0];
            if(!$missingTables){
              $counts['paises_chile']=$fetchCount("SELECT COUNT(*) FROM paises WHERE codigo_iso2='CL'");
              $counts['regiones']=$fetchCount("SELECT COUNT(*) FROM regiones r
                JOIN paises p ON p.id=r.pais_id WHERE p.codigo_iso2='CL'");
              $counts['provincias']=$fetchCount("SELECT COUNT(*) FROM provincias pr
                JOIN regiones r ON r.id=pr.region_id JOIN paises p ON p.id=r.pais_id
                WHERE p.codigo_iso2='CL'");
              $counts['comunas']=$fetchCount("SELECT COUNT(*) FROM comunas co
                JOIN provincias pr ON pr.id=co.provincia_id
                JOIN regiones r ON r.id=pr.region_id JOIN paises p ON p.id=r.pais_id
                WHERE p.codigo_iso2='CL'");
              $counts['referencias_ciudad']=$fetchCount("SELECT COUNT(*) FROM ciudades ci
                JOIN comunas co ON co.id=ci.comuna_id
                JOIN provincias pr ON pr.id=co.provincia_id
                JOIN regiones r ON r.id=pr.region_id JOIN paises p ON p.id=r.pais_id
                WHERE p.codigo_iso2='CL'");
            }
            $countsReady=$counts['paises_chile']===1
              && $counts['regiones']===16
              && $counts['provincias']===56
              && $counts['comunas']===346
              && $counts['referencias_ciudad']>=347;
            $ready=!$missingTables && !$missingColumns && !$missingFks && $countsReady;
            if(!$ready)http_response_code(412);
            echo json_encode(['ready'=>$ready,'ddl'=>[29=>count($missingTables)===0,
              30=>$countsReady,31=>!isset($missingColumns['proveedores']),
              32=>!$missingFks],
              'missing_tables'=>$missingTables,'missing_columns'=>$missingColumns,
              'missing_foreign_keys'=>$missingFks,'counts'=>$counts],
              JSON_UNESCAPED_UNICODE);
          }catch(Throwable $e){
            http_response_code(503);
            echo json_encode(['ready'=>false,'stage'=>'DDL29_32_READ_ONLY',
              'error_class'=>get_class($e)]);
          }
          '''
          php=php.replace('__TOKEN__',token).replace('__EXPIRES__',expires)
          pathlib.Path('/tmp/rutahd-v38-audit/audit.php').write_text(php,encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a') as f:
            f.write('AUDIT_NAME='+name+'\nAUDIT_KEY='+token+'\n')
          PY
          php -l /tmp/rutahd-v38-audit/audit.php
      - name: Subir sonda temporal que solo consulta columnas y totales
        run: |
          set -euo pipefail
          set +x
          umask 077
          cat >/tmp/rutahd-v38-audit/upload.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 45
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          put /tmp/rutahd-v38-audit/audit.php -o "/htdocs/$AUDIT_NAME"
          bye
          EOF
          lftp -f /tmp/rutahd-v38-audit/upload.lftp >/dev/null
      - name: Comprobar DDL29-32 en base exacta con SQL sin escrituras
        working-directory: /tmp/rutahd-v38-audit/browser
        run: |
          set -euo pipefail
          set +x
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({locale:'es-CL'});
            await page.goto('https://rutahyd2.free.nf/',{
              waitUntil:'domcontentloaded',timeout:55000
            });
            await page.waitForTimeout(9000);
            const result=await page.evaluate(async({name,key})=>{
              const controller=new AbortController();
              const timer=setTimeout(()=>controller.abort(),25000);
              try{
                const r=await fetch('/'+name,{method:'POST',cache:'no-store',
                  credentials:'same-origin',headers:{
                    'X-HD-V38-Audit':key,Accept:'application/json'
                  },signal:controller.signal});
                const data=(r.headers.get('content-type')||'').includes('json')
                  ?await r.json():{};
                return {http:r.status,...data};
              }finally{clearTimeout(timer);}
            },{name:process.env.AUDIT_NAME,key:process.env.AUDIT_KEY});
            console.log('DDL29_32_READ_ONLY_AUDIT',JSON.stringify(result));
            if(result.http!==200||result.ready!==true)
              throw Error('V38 no puede publicarse: comprobación SQL incompleta');
          }finally{await browser.close();}
          JS
          echo 'DDL29–32 verificadas en base productiva mediante SELECT/metadata exclusivamente.' >> "$GITHUB_STEP_SUMMARY"
      - name: Eliminar sonda temporal incluso ante fallo
        if: always()
        run: |
          set +x
          if [[ -n "$AUDIT_NAME" ]]; then
            cat >/tmp/rutahd-v38-audit/delete.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 40
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          rm "/htdocs/$AUDIT_NAME"
          bye
          EOF
            lftp -f /tmp/rutahd-v38-audit/delete.lftp >/dev/null || echo '::warning::Revisar sonda temporal de 15 minutos.'
          fi
          rm -f /tmp/rutahd-v38-audit/audit.php /tmp/rutahd-v38-audit/*.lftp
