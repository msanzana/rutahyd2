name: Verificar Laravel interno, gateway y frontend antes de activar
on:
  push:
    branches: [main]
    paths: ['deployment/solicitudes/auditar-laravel-login-20261121.txt']
permissions:
  contents: read
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    steps:
      - name: Instalar FTPS y Chromium
        run: |
          test -n "$FTP_PASSWORD"
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp
          mkdir -p /tmp/rutahd-smoke && cd /tmp/rutahd-smoke
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Preparar sonda PHP con token aleatorio y expiración
        run: |
          set +x
          umask 077
          python3 - <<'PY'
          import secrets,os,time,pathlib
          name='rutahd2_diag_'+secrets.token_hex(16)+'.php'
          token=secrets.token_hex(32)
          php=r'''<?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          header('Cache-Control: no-store');
          header('Content-Type: application/json; charset=utf-8');
          if($_SERVER['REQUEST_METHOD']!=='GET'||time()>__EXPIRY__||
             !hash_equals('__TOKEN__',(string)($_SERVER['HTTP_X_RUTAHD_DIAGNOSTIC']??''))){
             http_response_code(404);exit;
          }
          try {
             $base=__DIR__.'/api-v2';
             require_once $base.'/vendor/autoload.php';
             \Dotenv\Dotenv::createImmutable($base)->safeLoad();
             if(($_ENV['DB_HOST']??'')!=='sql307.infinityfree.com'||
                ($_ENV['DB_DATABASE']??'')!=='if0_43460400_rutahyd2_es')throw new RuntimeException('config');
             $dsn='mysql:host='.$_ENV['DB_HOST'].';port=3306;dbname='.$_ENV['DB_DATABASE'].';charset=utf8mb4';
             $pdo=new \PDO($dsn,(string)($_ENV['DB_USERNAME']??''),(string)($_ENV['DB_PASSWORD']??''),[
                \PDO::ATTR_ERRMODE=>\PDO::ERRMODE_EXCEPTION,\PDO::ATTR_TIMEOUT=>6
             ]);
             $tablas=(int)$pdo->query("SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_type='BASE TABLE'")->fetchColumn();
             $roles=(int)$pdo->query('SELECT COUNT(*) FROM roles')->fetchColumn();
             $usuarios=(int)$pdo->query('SELECT COUNT(*) FROM usuarios')->fetchColumn();
             $admin=(int)$pdo->query("SELECT COUNT(*) FROM usuarios u INNER JOIN roles r ON r.id=u.rol_id WHERE r.codigo='administrador' AND u.activo=1")->fetchColumn();
             $adminRow=$pdo->query("SELECT u.hash_contrasena,u.rut,u.correo_electronico FROM usuarios u INNER JOIN roles r ON r.id=u.rol_id WHERE r.codigo='administrador' AND u.activo=1 LIMIT 1")->fetch(\PDO::FETCH_ASSOC);
             $hashOk=is_array($adminRow) && password_get_info((string)$adminRow['hash_contrasena'])['algoName']==='argon2id';
             $rutOk=is_array($adminRow)&&preg_match('/^[0-9]{7,8}-[0-9K]$/D',(string)$adminRow['rut'])===1;
             $correoOk=is_array($adminRow)&&filter_var((string)$adminRow['correo_electronico'],FILTER_VALIDATE_EMAIL)!==false;
             $ddl18=(int)$pdo->query("SELECT COUNT(*) FROM information_schema.tables WHERE table_schema=DATABASE() AND table_name='restablecimientos_contrasena'")->fetchColumn()===1;
             $ddl19=(int)$pdo->query("SELECT COUNT(*) FROM information_schema.columns WHERE table_schema=DATABASE() AND table_name='usuarios' AND column_name='rut'")->fetchColumn()===1;
             $rutUnico=(int)$pdo->query("SELECT COUNT(*) FROM information_schema.statistics WHERE table_schema=DATABASE() AND table_name='usuarios' AND index_name='uq_usuarios_rut' AND non_unique=0")->fetchColumn()===1;
             $jwt=class_exists(\Firebase\JWT\JWT::class);
             $argon=defined('PASSWORD_ARGON2ID')&&in_array(PASSWORD_ARGON2ID,password_algos(),true);
             $mailMode=(string)($_ENV['MAIL_MAILER']??'');
             $mailCred=!empty($_ENV['MAIL_PASSWORD']);
             $mailHostOk=($_ENV['MAIL_HOST']??null)==='smtp.gmail.com';
             $mailUserOk=($_ENV['MAIL_USERNAME']??null)==='neo.hiper.xavier@gmail.com';
             $readyMarker=is_file($base.'/storage/app/private/rutahd2_api_ready');
             $interno=false; $anonDenied=false; $rutasProtegidas=false; $bearerInvalido=false; $mailLaravel=false; $internoError='none';
             try {
               $app=require $base.'/bootstrap/app.php';
               $kernel=$app->make(\Illuminate\Contracts\Http\Kernel::class);
               $request=\Illuminate\Http\Request::create('/api/v1/estado','GET',[],[],[],
                 ['HTTP_ACCEPT'=>'application/json','HTTP_HOST'=>'rutahyd2.free.nf','HTTPS'=>'on']);
               $res=$kernel->handle($request);
               $data=json_decode((string)$res->getContent(),true);
               $interno=$res->getStatusCode()===200
                   && ($data['servicio']??null)==='Ruta H&D2 API'
                   && ($data['estado']??null)==='disponible';
               $kernel->terminate($request,$res);
               // Confirmar configuración EFECTIVA de Laravel, no solo variables del .env.
               $mailLaravel=(string)config('mail.default')==='smtp'
                   && (string)config('mail.mailers.smtp.host')==='smtp.gmail.com'
                   && (string)config('mail.from.address')==='neo.hiper.xavier@gmail.com';
               // Solicitud protegida SIN credenciales: debe ser rechazada siempre.
               // No se ejecuta inicio de sesión ni modificación en MariaDB.
               $anonRequest=\Illuminate\Http\Request::create('/api/v1/perfil','GET',[],[],[],
                 ['HTTP_ACCEPT'=>'application/json','HTTP_HOST'=>'rutahyd2.free.nf','HTTPS'=>'on']);
               $anonResponse=$kernel->handle($anonRequest);
               $anonDenied=$anonResponse->getStatusCode()===401;
               $kernel->terminate($anonRequest,$anonResponse);
               // Leer rutas protegidas sin sesión: nunca exponer módulos por error.
               $rutasProtegidas=true;
               foreach (['/api/v1/usuarios','/api/v1/catalogos/rubros','/api/v1/recursos/clientes'] as $ruta) {
                 $r=\Illuminate\Http\Request::create($ruta,'GET',[],[],[],
                   ['HTTP_ACCEPT'=>'application/json','HTTP_HOST'=>'rutahyd2.free.nf','HTTPS'=>'on']);
                 $res=$kernel->handle($r);
                 $rutasProtegidas=$rutasProtegidas&&$res->getStatusCode()===401;
                 $kernel->terminate($r,$res);
               }
               $invalido=\Illuminate\Http\Request::create('/api/v1/perfil','GET',[],[],[],
                 ['HTTP_ACCEPT'=>'application/json','HTTP_HOST'=>'rutahyd2.free.nf','HTTPS'=>'on',
                  'HTTP_AUTHORIZATION'=>'Bearer token-invalido']);
               $respuestaInvalida=$kernel->handle($invalido);
               $bearerInvalido=$respuestaInvalida->getStatusCode()===401;
               $kernel->terminate($invalido,$respuestaInvalida);
             }catch(\Throwable $e){ $internoError=get_class($e); }

             $ok=$tablas===46&&$roles===5&&$usuarios===1&&$admin===1&&$hashOk&&$rutOk&&$correoOk&&$ddl18&&$ddl19&&$rutUnico&&$jwt&&$argon&&$interno&&$anonDenied&&$rutasProtegidas&&$bearerInvalido;
             http_response_code(200);
             echo json_encode(['ok'=>$ok,'db'=>'connected','tablas'=>$tablas,'roles'=>$roles,'usuarios'=>$usuarios,
                'admin_activo'=>$admin===1,'hash_argon2id'=>$hashOk,'rut_formato'=>$rutOk,'correo_formato'=>$correoOk,
                'ddl18'=>$ddl18,'ddl19'=>$ddl19,'rut_unico'=>$rutUnico,'jwt_lib'=>$jwt,'argon2id'=>$argon,
                'smtp_habilitado'=>$mailMode==='smtp','smtp_credencial'=>$mailCred,
                'smtp_host_gmail'=>$mailHostOk,'smtp_usuario_gmail'=>$mailUserOk,
                'smtp_config_laravel_efectiva'=>$mailLaravel,'gateway_habilitado'=>$readyMarker,'laravel_interno'=>$interno,
                'perfil_anonimo_rechazado'=>$anonDenied,'rutas_anonimas_rechazadas'=>$rutasProtegidas,
                'bearer_invalido_rechazado'=>$bearerInvalido,'laravel_error'=>$internoError]);
          } catch(\Throwable $e) {
             http_response_code(503);
             echo json_encode(['ok'=>false,'stage'=>'php_or_database','error_class'=>get_class($e)]);
          }
          '''
          php=php.replace('__TOKEN__',token).replace('__EXPIRY__',str(int(time.time()+900)))
          p=pathlib.Path('/tmp/rutahd_probe.php');p.write_text(php);p.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as f:
             f.write('PROBE_NAME='+name+'\nPROBE_TOKEN='+token+'\n')
          print('Preparada sonda de solo lectura con token de 256 bits y TTL de 15 minutos.')
          PY
          php -l /tmp/rutahd_probe.php
      - name: Subir sonda de comprobación con nombre aleatorio
        run: |
          set +x
          umask 077
          cat >/tmp/upload-probe.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 40
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          put /tmp/rutahd_probe.php -o "/htdocs/$PROBE_NAME"
          bye
          EOF
          lftp -f /tmp/upload-probe.lftp >/dev/null
      - name: Ejecutar consulta inocua PHP y PDO usando navegador real
        working-directory: /tmp/rutahd-smoke
        run: |
          set +x
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const file=process.env.PROBE_NAME,secret=process.env.PROBE_TOKEN;
          if(!/^rutahd2_diag_[0-9a-f]{32}\.php$/.test(file)||!secret||secret.length!==64)process.exit(1);
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({locale:'es-CL'});
            await page.goto('https://rutahyd2.free.nf/',{waitUntil:'domcontentloaded',timeout:45000});
            await page.waitForTimeout(12000);
            const result=await page.evaluate(async ({file,secret})=>{
              const controller=new AbortController(),tm=setTimeout(()=>controller.abort(),16000);
              try {
                const r=await fetch('/'+file,{headers:{'X-RutaHD-Diagnostic':secret,Accept:'application/json'},cache:'no-store',signal:controller.signal});
                const content=(r.headers.get('content-type')||'').includes('json')?await r.json():{};
                return {http:r.status,ok:content.ok===true,db:content.db,tablas:content.tablas,roles:content.roles,
                  usuarios:content.usuarios,admin_activo:content.admin_activo,hash_argon2id:content.hash_argon2id,
                  rut_formato:content.rut_formato,correo_formato:content.correo_formato,
                  ddl18:content.ddl18,ddl19:content.ddl19,rut_unico:content.rut_unico,
                  jwt_lib:content.jwt_lib,argon2id:content.argon2id,
                  smtp_habilitado:content.smtp_habilitado,smtp_credencial:content.smtp_credencial,
                  smtp_host_gmail:content.smtp_host_gmail,smtp_usuario_gmail:content.smtp_usuario_gmail,
                  smtp_config_laravel_efectiva:content.smtp_config_laravel_efectiva,
                  gateway_habilitado:content.gateway_habilitado,
                  perfil_anonimo_rechazado:content.perfil_anonimo_rechazado,
                  rutas_anonimas_rechazadas:content.rutas_anonimas_rechazadas,
                  bearer_invalido_rechazado:content.bearer_invalido_rechazado,
                  laravel_interno:content.laravel_interno,laravel_error:content.laravel_error,
                  error_class:typeof content.error_class==='string'?content.error_class:'none'};
              }finally{clearTimeout(tm);}
            },{file,secret});
            console.log('DIAGNOSTICO_PUBLICABLE',JSON.stringify(result));
            const pub=await page.evaluate(async()=>{
              try{
                const r=await fetch('/api/v1/estado',{cache:'no-store',headers:{Accept:'application/json'}});
                const ct=r.headers.get('content-type')||'';
                const j=ct.includes('json')?await r.json():null;
                return {http:r.status,json:ct.includes('json'),
                  servicio_ok:j?.servicio==='Ruta H&D2 API',
                  estado:j?.estado??'respuesta_no_json'};
              }catch(e){return {http:0,json:false,estado:'fetch_fallido'};}
            });
            const logo=await page.evaluate(()=>{
              const i=document.querySelector('.brand-logo');
              if(!i)return {presente:false};
              return {presente:true,src:i.getAttribute('src'),completo:i.complete,ancho:i.naturalWidth};
            });
            console.log('GATEWAY_PUBLICO',JSON.stringify(pub));
            console.log('LOGO_FRONTAL',JSON.stringify(logo));
            if(result.http!==200||!result.ok||result.db!=='connected'||result.perfil_anonimo_rechazado!==true||result.rutas_anonimas_rechazadas!==true||result.bearer_invalido_rechazado!==true)process.exitCode=1;
            await page.close();
          }finally{await browser.close();}
          JS
      - name: Eliminar la sonda después de la prueba incluso si hubo error
        if: always()
        run: |
          set +x
          if [ -n "$PROBE_NAME" ]; then
            cat >/tmp/remove-probe.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 35
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          rm "/htdocs/$PROBE_NAME"
          bye
          EOF
            lftp -f /tmp/remove-probe.lftp >/dev/null || echo "::warning::Sonda expira en 15 minutos; comprobar limpieza."
          fi
          rm -f /tmp/rutahd_probe.php /tmp/upload-probe.lftp /tmp/remove-probe.lftp
          echo 'Auditoría de solo lectura terminada; ninguna escritura en MySQL.'
