name: Probar migraciones de clasificaciones sobre MySQL temporal
on:
  push:
    branches:
      - feature/catalogos-api-productos-v2-20261120
  workflow_dispatch:
permissions:
  contents: read
jobs:
  esquema-catalogos:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: temporal_ci_solamente
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptemporal_ci_solamente --silent"
          --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - name: Importar esquema español y clasificaciones sin InfinityFree
        run: |
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente < database/espanol/01_esquema_completo_34_tablas_es.sql
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente < database/espanol/05_semillas_es.sql
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente rutahyd2_es_local < database/espanol/12_tokens_acceso_opcional.sql
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente rutahyd2_es_local < database/espanol/13_catalogos_comerciales_aditivos.sql
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente rutahyd2_es_local < database/espanol/14_productos_clasificacion_campos.sql
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente rutahyd2_es_local < database/espanol/16_permisos_modulos_producto.sql
          # Reaplicar SQL16 debe ser inocuo y mantener exactamente 20 permisos.
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente rutahyd2_es_local < database/espanol/16_permisos_modulos_producto.sql
      - name: Confirmar estructura y conservación de categoría heredada
        run: |
          cat >/tmp/check.sql <<'SQL'
          USE rutahyd2_es_local;
          SELECT IF((SELECT COUNT(*) FROM information_schema.tables
              WHERE table_schema=DATABASE() AND table_type='BASE TABLE')=45,1,0)
              INTO @tablas;
          SELECT IF((SELECT COUNT(*) FROM information_schema.columns
              WHERE table_schema=DATABASE() AND table_name='productos'
              AND column_name IN ('categoria_id','rubro_id','departamento_id',
              'familia_id','linea_id','marca_id','modelo_id','tipo_unidad_id',
              'gramaje_id','tipo_envasado_id','condicion_tributaria_id'))=11,1,0)
              INTO @columnas;
          SELECT IF((SELECT COUNT(*) FROM condiciones_tributarias WHERE codigo IN ('AFECTO','EXENTO'))=2,1,0)
              INTO @tributos;
          SELECT IF((SELECT COUNT(*) FROM information_schema.key_column_usage
              WHERE table_schema=DATABASE() AND table_name='productos'
              AND column_name IN ('rubro_id','departamento_id','familia_id',
              'linea_id','marca_id','modelo_id','tipo_unidad_id','gramaje_id',
              'tipo_envasado_id','condicion_tributaria_id')
              AND referenced_table_name IS NOT NULL)=10,1,0) INTO @fks;
          SELECT IF((SELECT COUNT(*) FROM permisos WHERE codigo LIKE 'productos.catalogos.%')=20,1,0) INTO @permisos;
          SELECT IF((SELECT COUNT(*) FROM roles_permisos rp
              JOIN permisos p ON p.id=rp.permiso_id
              WHERE p.codigo LIKE 'productos.catalogos.%')=0,1,0) INTO @sin_concesiones_automaticas;
          SELECT @tablas AS tablas_ok,@columnas AS columnas_ok,@tributos AS tributos_ok,
            @fks AS fks_ok,@permisos AS permisos_ok,@sin_concesiones_automaticas AS no_autogrant;

          SQL
          RESULT=$(mysql -N -h 127.0.0.1 -uroot -ptemporal_ci_solamente < /tmp/check.sql | tail -1)
          echo "Resultado: $RESULT"
          test "$RESULT" = "$(printf '1\t1\t1\t1\t1\t1')" || exit 1
          echo "CI OK: 45 tablas, 10 catálogos, claves foráneas e historial preservado."
      - name: Instalar PHP y dependencias de Laravel
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, intl, xml, dom, curl, pdo_mysql, openssl, fileinfo
      - name: Instalar dependencias
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Verificar login, permisos y CRUD real sobre MySQL efímero
        env:
          APP_NAME: RutaHD2_TEST_CI
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          APP_URL: 'http://127.0.0.1'
          DB_CONNECTION: mysql
          DB_HOST: '127.0.0.1'
          DB_PORT: '3306'
          DB_DATABASE: rutahyd2_es_local
          DB_USERNAME: root
          DB_PASSWORD: temporal_ci_solamente
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set -o pipefail
          php tests/integracion_catalogos_api.php | tee /tmp/resultado_catalogos_api.log
          grep -Fq 'OK: login real' /tmp/resultado_catalogos_api.log
