name: Validar CRUD comerciales con MySQL efimero sin produccion
on:
  push:
    branches: [feature/crud-clientes-proveedores-bodegas-20261122]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  crud-entidades:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: temporal_ci_solamente
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptemporal_ci_solamente --silent"
          --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, intl, xml, dom, curl, pdo_mysql, openssl, fileinfo
      - name: Validar PHP y rutas sin datos reales
        run: |
          php -l app/Http/Controllers/EntidadesComercialesControlador.php
          php -l routes/api.php
          php -l tests/integracion_entidades_crud.php
          grep -Fq "->where('recurso','clientes|proveedores|bodegas')" routes/api.php || test "$(grep -c "clientes|proveedores|bodegas" routes/api.php)" -ge 3
          ! grep -Eq "TRUNCATE|DROP TABLE" app/Http/Controllers/EntidadesComercialesControlador.php
      - name: Importar DDL histórico exclusivamente en MySQL efímero
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente < database/espanol/01_esquema_completo_34_tablas_es.sql
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente < database/espanol/05_semillas_es.sql
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente rutahyd2_es_local < database/espanol/12_tokens_acceso_opcional.sql
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente rutahyd2_es_local < database/espanol/13_catalogos_comerciales_aditivos.sql
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente rutahyd2_es_local < database/espanol/14_productos_clasificacion_campos.sql
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente rutahyd2_es_local < database/espanol/16_permisos_modulos_producto.sql
          mysql -N -h 127.0.0.1 -uroot -ptemporal_ci_solamente -e "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='rutahyd2_es_local'" | grep -Fxq '45'
      - name: Instalar Laravel y compilar contrato de rutas
        env:
          APP_ENV: testing
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_DATABASE: rutahyd2_es_local
          DB_USERNAME: root
          DB_PASSWORD: temporal_ci_solamente
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          php artisan route:list --path=api/v1
      - name: Probar autenticacion catalogos productos y CRUD comerciales reales
        env:
          APP_NAME: RutaHD2_CI
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          RUTAHD_JWT_SECRET: 'CI_ONLY_JWT_TEST_SIGNING_KEY_DO_NOT_USE_IN_PRODUCTION_2026'
          APP_URL: 'http://127.0.0.1'
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: rutahyd2_es_local
          DB_USERNAME: root
          DB_PASSWORD: temporal_ci_solamente
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          set -euo pipefail
          php tests/integracion_catalogos_api.php
          php tests/integracion_productos_crud.php
          php tests/integracion_entidades_crud.php
          echo 'OK: fixtures exclusivamente locales; MySQL productivo no fue conectado.' >> "$GITHUB_STEP_SUMMARY"
