name: Habilitar login JWT productivo con verificacion y rollback
on:
  push:
    branches: [main]
    paths:
      - deployment/solicitudes/habilitar-login-jwt-controlado-20261121.txt
permissions:
  contents: read
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  activar:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    steps:
      - name: Instalar FTPS y Chromium
        run: |
          test -n "$FTP_PASSWORD"
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp
          mkdir -p /tmp/rutahd-activation && cd /tmp/rutahd-activation
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Comprobar privacidad, SMTP, JWT y que no existe marcador
        run: |
          set -euo pipefail
          set +x
          umask 077
          cat >/tmp/activation-read.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 45
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          get /htdocs/api-v2/.env -o /tmp/activation-private-env
          get /htdocs/api-v2/.htaccess -o /tmp/activation-guard
          get /htdocs/api/index.php -o /tmp/activation-gateway
          get /htdocs/index.html -o /tmp/activation-front
          cls -1 -a /htdocs/api-v2/storage/app/private > /tmp/activation-existing-markers
          bye
          EOF
          lftp -f /tmp/activation-read.lftp >/dev/null
          test -s /tmp/activation-private-env
          grep -Fq 'Require all denied' /tmp/activation-guard
          grep -Fq 'rutahd2_api_ready' /tmp/activation-gateway
          grep -Fq 'app-produccion.js' /tmp/activation-front
          grep -Fq 'login-produccion.js' /tmp/activation-front
          if grep -Fxq rutahd2_api_ready /tmp/activation-existing-markers; then
            echo "::error::El gateway ya esta habilitado: no sobrescribir marcador"; exit 1;
          fi
          python3 - <<'PY'
          import json,pathlib
          data={}
          for line in pathlib.Path('/tmp/activation-private-env').read_text().splitlines():
              if '=' not in line or line.lstrip().startswith('#'):continue
              key,value=line.split('=',1);value=value.strip()
              try:value=json.loads(value)
              except ValueError:value=value.strip("'\"")
              data[key.strip()]=str(value)
          assert data.get('APP_ENV')=='production'
          assert data.get('APP_DEBUG')=='false'
          assert data.get('APP_URL')=='https://rutahyd2.free.nf'
          assert data.get('DB_DATABASE')=='if0_43460400_rutahyd2_es'
          assert len(data.get('RUTAHD_JWT_SECRET',''))>=32
          assert data.get('MAIL_MAILER')=='smtp'
          assert data.get('MAIL_HOST')=='smtp.gmail.com'
          assert data.get('MAIL_PORT')=='587'
          assert len(data.get('MAIL_PASSWORD',''))>=16
          print('Preflight: Laravel produccion, DB, JWT y SMTP presentes sin revelar secretos.')
          PY
          shred -u /tmp/activation-private-env || rm -f /tmp/activation-private-env
      - name: Abrir gateway con marcador privado
        run: |
          set -euo pipefail
          set +x
          umask 077
          printf 'rutahd2-jwt-produccion\n' >/tmp/activation-ready
          # Marcar propiedad del intento ANTES de transferir: rollback incluso ante error parcial.
          touch /tmp/activation-created-by-this-job
          cat >/tmp/activation-write.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 45
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          put /tmp/activation-ready -o /htdocs/api-v2/storage/app/private/rutahd2_api_ready
          bye
          EOF
          lftp -f /tmp/activation-write.lftp >/dev/null
      - name: Verificar HTTPS, API disponible y denegaciones 401 desde navegador real
        working-directory: /tmp/rutahd-activation
        run: |
          set -euo pipefail
          set +x
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({locale:'es-CL'});
            const nav=await page.goto('https://rutahyd2.free.nf/',{
              waitUntil:'domcontentloaded',timeout:45000
            });
            if(!nav||nav.status()!==200)throw Error('Frontend no responde HTTP 200');
            await page.waitForTimeout(12000);
            const result=await page.evaluate(async()=>{
              async function request(path,headers={}){
                const ctrl=new AbortController(),t=setTimeout(()=>ctrl.abort(),15000);
                try {
                  const r=await fetch(path,{method:'GET',cache:'no-store',
                    credentials:'same-origin',
                    headers:{Accept:'application/json',...headers},
                    signal:ctrl.signal});
                  const ct=r.headers.get('content-type')||'';
                  const body=ct.includes('json')?await r.json():{};
                  return {code:r.status,json:ct.includes('json'),body};
                }finally{clearTimeout(t);}
              }
              const health=await request('/api/v1/estado');
              const profile=await request('/api/v1/perfil');
              const users=await request('/api/v1/usuarios');
              const catalog=await request('/api/v1/catalogos/rubros');
              const invalid=await request('/api/v1/perfil',{Authorization:'Bearer no-es-jwt'});
              return {gateway:health.code,
                estado:health.body?.estado,servicio:health.body?.servicio,
                json:health.json,perfil:profile.code,usuarios:users.code,
                catalogo:catalog.code,jwt_invalido:invalid.code};
            });
            console.log('PRODUCCION_JWT_SMOKE',JSON.stringify(result));
            if(result.gateway!==200||!result.json||
              result.estado!=='disponible'||result.servicio!=='Ruta H&D2 API'||
              [result.perfil,result.usuarios,result.catalogo,
               result.jwt_invalido].some(v=>v!==401)) {
              throw Error('Fallaron las comprobaciones de seguridad JWT');
            }
            await page.close();
          }finally{await browser.close();}
          JS
      - name: Confirmar el marcador sin exponer archivos privados
        run: |
          set -euo pipefail
          set +x
          cat >/tmp/activation-confirm.lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          cls -1 -a /htdocs/api-v2/storage/app/private > /tmp/activation-confirm-markers
          bye
          EOF
          lftp -f /tmp/activation-confirm.lftp >/dev/null
          grep -Fxq rutahd2_api_ready /tmp/activation-confirm-markers
          echo 'API JWT habilitada y rutas anonimas protegidas. Login real administrador pendiente de prueba por titular.' >> "$GITHUB_STEP_SUMMARY"
      - name: Revertir el marcador si falla cualquier comprobacion
        if: failure()
        run: |
          set +x
          if [ -f /tmp/activation-created-by-this-job ]; then
            cat >/tmp/activation-rollback.lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          rm /htdocs/api-v2/storage/app/private/rutahd2_api_ready
          bye
          EOF
            lftp -f /tmp/activation-rollback.lftp >/dev/null || echo "::error::Reversion sin confirmar, revisar marcador manualmente."
          fi
          echo 'Activacion NO certificada; verificar rollback si hubo fallo.' >> "$GITHUB_STEP_SUMMARY"
      - name: Eliminar archivos locales temporales
        if: always()
        run: |
          set +x
          shred -u /tmp/activation-private-env /tmp/activation-ready 2>/dev/null || true
          rm -f /tmp/activation-*.lftp /tmp/activation-guard /tmp/activation-gateway /tmp/activation-front
          rm -f /tmp/activation-existing-markers /tmp/activation-confirm-markers
