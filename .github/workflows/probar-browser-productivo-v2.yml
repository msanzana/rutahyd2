name: Prueba navegador real de sitio en InfinityFree
on:
  push:
    branches: [main]
    paths: ['deployment/solicitudes/probar-browser-productivo-v2.txt']
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar Chromium de Playwright
        run: |
          mkdir -p /tmp/smoke-rutahd && cd /tmp/smoke-rutahd
          npm init -y >/dev/null
          npm install --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Probar interfaz y HTTP API desde navegador sin credenciales
        working-directory: /tmp/smoke-rutahd
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({locale:'es-CL'});
            const endpoint='https://rutahyd2.free.nf/';
            let navigation;
            try { navigation=await page.goto(endpoint,{waitUntil:'domcontentloaded',timeout:45000}); }
            catch(e) { console.log('ERROR_NAVEGACION:', e.name); process.exitCode=1; }
            if(navigation) {
              await page.waitForTimeout(12000);
              const title=await page.title();
              const parents=await page.locator('.sidebar .nav > .nav-link, .sidebar .nav > .nav-group')
                .evaluateAll(elements=>elements.map(el=>el.dataset.nav||el.querySelector('.nav-link')?.dataset.nav));
              const expected=['administracion','compras','ventas','proveedores','clientes','productos','bodega','cuentas_corrientes'];
              const correct=JSON.stringify(parents)===JSON.stringify(expected);
              console.log('HTTP_FRONT:',navigation.status());
              console.log('TITULO_PRESENTE:',title.includes('Ruta')?'SI':'NO');
              console.log('OCHO_PADRES_OFICIALES:',correct?'SI':'NO');
              console.log('PADRES_ENCONTRADOS:',parents.length);
              if(!correct)process.exitCode=1;
              const productivo=await page.evaluate(()=>({
                login:document.getElementById('loginDialog')?.open===true,
                demo:document.getElementById('loginDemo')!==null,
                app:!!document.querySelector('script[src*="app-produccion.js"]'),
                legacy:!!document.querySelector('script[src*="assets/js/app.js"]'),
                logo:document.querySelector('.brand-logo')?.naturalWidth||0,
                logo_png:(document.querySelector('.brand-logo')?.getAttribute('src')||'').includes('hd-branding/logo-hd-site.png')
              }));
              console.log('PRODUCCION_VALIDADA:',JSON.stringify(productivo));
              if(!productivo.login||productivo.demo||!productivo.app||productivo.legacy||productivo.logo<=0||!productivo.logo_png)process.exitCode=1;
              try {
                const api=await page.evaluate(async()=>{
                  const controller=new AbortController();
                  const timeout=setTimeout(()=>controller.abort(),12000);
                  try {
                    const result=await fetch('/api/v1/estado',{signal:controller.signal,cache:'no-store',headers:{Accept:'application/json'}});
                    const type=result.headers.get('content-type')||'';
                    const state=type.includes('json')?await result.json():{};
                    const protectedStatus=async(path,headers={})=>{
                      const response=await fetch(path,{cache:'no-store',headers:{Accept:'application/json',...headers}});
                      return response.status;
                    };
                    return {status:result.status,content_type:type,estado:state.estado,
                      servicio:state.servicio,perfil:result.status===200?await protectedStatus('/api/v1/perfil'):null,
                      usuarios:result.status===200?await protectedStatus('/api/v1/usuarios'):null,
                      jwt_invalido:result.status===200?await protectedStatus('/api/v1/perfil',{Authorization:'Bearer invalido'}):null};
                  } finally{clearTimeout(timeout);}
                });
                console.log('API_HTTP:',api.status);
                console.log('API_JSON:',api.content_type.includes('json')?'SI':'NO');
                if(api.status===200){
                  const authDiag=await page.evaluate(async()=>{
                    const probe=async(headers={})=>{
                      const response=await fetch('/api/v1/perfil',{cache:'no-store',
                        headers:{Accept:'application/json',...headers}});
                      const json=(response.headers.get('content-type')||'').includes('json')?
                        await response.json():{};
                      return {http:response.status,message:String(json.message||'').slice(0,100)};
                    };
                    const none=await probe();
                    const fake=await probe({Authorization:'Bearer aaaa.bbbb.cccc'});
                    return {none: none.http, fake: fake.http,
                      distinct_error_messages:none.message!==fake.message,
                      fake_reaches_jwt:fake.message.toLowerCase().includes('jwt')};
                  });
                  console.log('TRANSPORTE_BEARER_LARAVEL',JSON.stringify(authDiag));
                  if(authDiag.none!==401||authDiag.fake!==401)process.exitCode=1;
                }
                if(api.status===503 && api.content_type.includes('json')&&api.estado==='no_habilitada'){
                  console.log('API_MODO=CERRADA_SEGURO');
                } else if(api.status===200 && api.content_type.includes('json')&&
                  api.estado==='disponible'&&api.servicio==='Ruta H&D2 API'&&
                  api.perfil===401&&api.usuarios===401&&api.jwt_invalido===401){
                  console.log('API_MODO=PRODUCCION_JWT_PROTEGIDA');
                } else {
                  console.log('API_MODO=INCONSISTENTE');
                  process.exitCode=1;
                }
              } catch(e) {
                console.log('API_ERROR_BROWSER:',e.name);
                process.exitCode=1;
              }
            }
            await page.close();
            // Comprobar el enlace de recuperación sin enviar contraseña ni consumir token.
            const recoveryPage=await browser.newPage({locale:'es-CL'});
            recoveryPage.on('pageerror',e=>console.log('ERROR_RECUPERACION_JS',e.message));
            recoveryPage.on('console',m=>{if(m.type()==='error')console.log('ERROR_CONSOLA_RECUPERACION',m.text().slice(0,320));});
            await recoveryPage.goto(endpoint+'#recuperar?token='+'a'.repeat(64),{
              waitUntil:'domcontentloaded',timeout:45000
            });
            await recoveryPage.waitForTimeout(1800);
            const recovery=await recoveryPage.evaluate(()=>({
              visible:document.querySelector('.recovery-dialog')?.open===true,
              loginVisible:document.querySelector('#loginDialog')?.open===true,
              hasPassword:!!document.querySelector('#recovery-password'),
              tokenInUrl:location.hash.includes('token='),
              officialStyle:getComputedStyle(document.querySelector('.recovery-layout')||document.body).display,
              location:location.href.replace(/token=[a-f0-9]{64}/i,'token=[REDACTED]'),
              script:!!document.querySelector('script[src*="recuperacion.js"]'),
              available:typeof window.RutaHDRecuperacion,
              active:window.RutaHDRecuperacion?.isActive?.(),
              dialogCount:document.querySelectorAll('dialog[open]').length,
              loginStart:document.body.dataset.loginStart
            }));
            console.log('RECUPERACION_PRODUCCION',JSON.stringify(recovery));
            if(!recovery.visible){
              // InfinityFree elimina el fragmento # durante la primera verificación ?i=1.
              // Con la cookie ya establecida, volver a abrir el enlace en ese MISMO navegador.
              await recoveryPage.goto(endpoint+'#recuperar?token='+'a'.repeat(64),{
                waitUntil:'domcontentloaded',timeout:45000
              });
              await recoveryPage.waitForTimeout(1400);
            }
            const after=await recoveryPage.evaluate(()=>({
              visible:document.querySelector('.recovery-dialog')?.open===true,
              loginVisible:document.querySelector('#loginDialog')?.open===true,
              hasPassword:!!document.querySelector('#recovery-password'),
              tokenInUrl:location.hash.includes('token=')
            }));
            console.log('RECUPERACION_CON_COOKIE',JSON.stringify(after));
            if(!after.visible||after.loginVisible||!after.hasPassword||after.tokenInUrl)
              process.exitCode=1;
            await recoveryPage.close();
            // Un navegador sin cookies debe poder abrir el NUEVO formato ?recuperar= en el primer clic.
            const coldRecovery=await browser.newPage({locale:'es-CL'});
            coldRecovery.on('pageerror',e=>console.log('ERROR_NUEVA_RECUPERACION_JS',e.message));
            await coldRecovery.goto(endpoint+'?recuperar='+'f'.repeat(64),{
              waitUntil:'domcontentloaded',timeout:45000
            });
            await coldRecovery.waitForTimeout(2400);
            const fresh=await coldRecovery.evaluate(()=>({
              visible:document.querySelector('.recovery-dialog')?.open===true,
              loginVisible:document.querySelector('#loginDialog')?.open===true,
              hasPassword:!!document.querySelector('#recovery-password'),
              active:window.RutaHDRecuperacion?.isActive?.()===true,
              tokenInAddress:location.href.includes('recuperar=')||location.href.includes('ffffffff'),
              referrer:document.querySelector('meta[name="referrer"]')?.content,
              layout:document.querySelector('.recovery-layout')?
                getComputedStyle(document.querySelector('.recovery-layout')).display:null
            }));
            console.log('RECUPERACION_QUERY_PRIMER_CLICK',JSON.stringify(fresh));
            if(!fresh.visible||fresh.loginVisible||!fresh.hasPassword||!fresh.active||
              fresh.tokenInAddress||fresh.referrer!=='no-referrer'||fresh.layout!=='grid')process.exitCode=1;
            await coldRecovery.close();
          } finally {await browser.close();}
          JS
