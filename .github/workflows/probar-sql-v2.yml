name: Probar conexion SQL RutaHD2 V2 con MySQL aislado
on:
  push:
    branches: [ main ]
    paths:
      - 'deployment/solicitudes/probar-conexion-bbdd-v2.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conectar-consultar-desconectar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: temporal_solo_en_CI
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s --health-timeout=5s --health-retries=15
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_NAME: rutahyd2_es_local
      DB_USER: root
      DB_PASS: temporal_solo_en_CI
    steps:
      - name: Descargar SQL oficial de RutaHD2 V2
        uses: actions/checkout@v4
        with:
          ref: feature/backend-v2-es
      - name: Configurar PHP PDO MySQL
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql
      - name: Crear base aislada de prueba sin usar datos reales
        run: |
          docker exec -i ${{ job.services.mysql.id }} mysql -uroot -ptemporal_solo_en_CI < database/espanol/01_esquema_completo_34_tablas_es.sql
          docker exec -i ${{ job.services.mysql.id }} mysql -uroot -ptemporal_solo_en_CI < database/espanol/05_semillas_es.sql
      - name: Conectar, ejecutar SELECT y desconectar explícitamente
        run: |
          cat >/tmp/probar_conexion.php <<'PHP'
          <?php
          declare(strict_types=1);
          $dsn = sprintf('mysql:host=%s;port=%s;dbname=%s;charset=utf8mb4',
              getenv('DB_HOST'), getenv('DB_PORT'), getenv('DB_NAME'));
          $pdo = new PDO($dsn, (string)getenv('DB_USER'), (string)getenv('DB_PASS'), [
              PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION,
              PDO::ATTR_DEFAULT_FETCH_MODE => PDO::FETCH_ASSOC,
              PDO::ATTR_PERSISTENT => false,
          ]);
          echo "CONEXION: OK (PDO MySQL; no persistente)\n";
          $pdo->exec('SET SESSION TRANSACTION READ ONLY');
          $pdo->beginTransaction();
          $db = $pdo->query('SELECT DATABASE() AS nombre')->fetchColumn();
          $count = (int)$pdo->query("SELECT COUNT(*) FROM information_schema.tables
              WHERE table_schema = DATABASE() AND table_type='BASE TABLE'")->fetchColumn();
          $roles = (int)$pdo->query('SELECT COUNT(*) FROM roles')->fetchColumn();
          $permisos = (int)$pdo->query('SELECT COUNT(*) FROM permisos')->fetchColumn();
          echo "SQL: SELECT DATABASE(), COUNT(*) information_schema.tables, COUNT(*) roles, COUNT(*) permisos\n";
          printf("RESULTADO: bd=%s tablas=%d roles=%d permisos=%d\n", $db, $count, $roles, $permisos);
          if ($db !== 'rutahyd2_es_local' || $count !== 34 || $roles !== 5 || $permisos !== 12) {
              throw new RuntimeException('La estructura o los datos de prueba no coinciden');
          }
          $pdo->rollBack();
          $pdo = null; // libera la conexion (sin pooling)
          echo "DESCONEXION: OK (PDO cerrado explícitamente)\n";
          PHP
          php /tmp/probar_conexion.php
      - name: Resumir prueba y alcance
        if: success()
        run: |
          echo "### Resultado SQL RutaHD2 V2" >> "$GITHUB_STEP_SUMMARY"
          echo "- Conexión PDO a MySQL **efímero**: correcta" >> "$GITHUB_STEP_SUMMARY"
          echo "- Consultas SELECT sobre el esquema V2 español: correctas" >> "$GITHUB_STEP_SUMMARY"
          echo "- Desconexión PDO no persistente: ejecutada" >> "$GITHUB_STEP_SUMMARY"
          echo "- **No se conectó a InfinityFree ni a la base real**." >> "$GITHUB_STEP_SUMMARY"
