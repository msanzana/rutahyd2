name: Auditar DDL28 y publicar costo promedio V37 con rollback
on:
  push:
    branches: [main]
    paths:
      - deployment/solicitudes/publicar-costo-promedio-v37.txt
permissions:
  contents: read
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
      BACKEND_SHA: 83296bb5acfe6c69309ec308c8da0c3df6a3c764
      BACKEND_BEFORE_SHA: 9b17bb1b55245170e4947ef55dea4774a8c6eb5c
      FRONT_SHA: 089699db01a9f725d324ee62fba04d38eec479af
      FRONT_BEFORE_SHA: 09bc1936d307b5881ef6fce9dc791c2bcf1e0b1a
    steps:
      - name: Fijar versiones exactas, validar código y ausencia de migraciones
        run: |
          set -euo pipefail
          test -n "$FTP_PASSWORD"
          git clone -q --depth 1 --branch feature/proveedores-productos-barcodes-20261122 https://github.com/msanzana/rutahyd2.git /tmp/hdv37back
          git clone -q --depth 1 --branch main https://github.com/msanzana/rutahyd2front.git /tmp/hdv37front
          test "$(git -C /tmp/hdv37back rev-parse HEAD)" = "$BACKEND_SHA"
          test "$(git -C /tmp/hdv37front rev-parse HEAD)" = "$FRONT_SHA"
          git -C /tmp/hdv37back fetch -q --depth 1 origin "$BACKEND_BEFORE_SHA"
          git -C /tmp/hdv37front fetch -q --depth 1 origin "$FRONT_BEFORE_SHA"
          mkdir -p /tmp/hdv37
          git -C /tmp/hdv37back show "$BACKEND_BEFORE_SHA:app/Http/Controllers/ProductoComercialControlador.php" > /tmp/hdv37/backend-before.php
          git -C /tmp/hdv37front show "$FRONT_BEFORE_SHA:assets/js/productos-remotos.js" > /tmp/hdv37/front-before.js
          git -C /tmp/hdv37front show "$FRONT_BEFORE_SHA:index.html" > /tmp/hdv37/index-before-source.html
          cp /tmp/hdv37back/app/Http/Controllers/ProductoComercialControlador.php /tmp/hdv37/backend-after.php
          php -l /tmp/hdv37/backend-after.php
          node --check /tmp/hdv37front/assets/js/productos-remotos.js
          grep -Fq "'costoPromedioPonderado'=>['prohibited']" /tmp/hdv37/backend-after.php
          grep -Fq 'costo_promedio_ponderado' /tmp/hdv37/backend-after.php
          grep -Fq 'productoCostoPromedioPonderado' /tmp/hdv37front/assets/js/productos-remotos.js
          grep -Fq 'productos-costo-promedio-v37.css?v=20261122-cost37' /tmp/hdv37front/index.html
          grep -Fq 'productos-remotos.js?v=20261122-cost37' /tmp/hdv37front/index.html
          test -s /tmp/hdv37front/assets/css/productos-costo-promedio-v37.css
      - name: Preparar FTPS seguro y Chromium
        run: |
          set -euo pipefail
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp
          mkdir -p /tmp/hdv37/browser
          cd /tmp/hdv37/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.0
          npx playwright install --with-deps chromium
      - name: Respaldo y validación de archivos productivos V36
        run: |
          set -euo pipefail
          set +x
          umask 077
          cat >/tmp/hdv37/read.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 45
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          get /htdocs/index.html -o /tmp/hdv37/index-before.html
          get /htdocs/assets/js/productos-remotos.js -o /tmp/hdv37/front-live-before.js
          get /htdocs/api-v2/app/Http/Controllers/ProductoComercialControlador.php -o /tmp/hdv37/backend-live-before.php
          get /htdocs/api-v2/.htaccess -o /tmp/hdv37/guard-before
          get /htdocs/api/index.php -o /tmp/hdv37/gateway-before
          bye
          EOF
          lftp -f /tmp/hdv37/read.lftp >/dev/null
          cmp -s /tmp/hdv37/index-before-source.html /tmp/hdv37/index-before.html || {
            echo "::error::HTML remoto difiere de V36; no sobreescribir"; exit 1;
          }
          cmp -s /tmp/hdv37/front-before.js /tmp/hdv37/front-live-before.js || {
            echo "::error::Frontend remoto difiere del origen V36; no sobreescribir"; exit 1;
          }
          cmp -s /tmp/hdv37/backend-before.php /tmp/hdv37/backend-live-before.php || {
            echo "::error::Backend remoto difiere del último controlador v32; no sobreescribir"; exit 1;
          }
          grep -Fq 'Require all denied' /tmp/hdv37/guard-before
          grep -Fq 'rutahd2_api_ready' /tmp/hdv37/gateway-before
          echo 'Preflight FTPS V36 y controlador Laravel anterior: correcto.' >> "$GITHUB_STEP_SUMMARY"
      - name: Construir sonda temporal y protegida de SOLO LECTURA DDL28
        run: |
          set -euo pipefail
          set +x
          umask 077
          python3 - <<'PY'
          import os, pathlib, secrets, time
          token=secrets.token_hex(32)
          name='hd_v37_schema_'+secrets.token_hex(16)+'.php'
          expires=str(int(time.time()+900))
          php=r"""<?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');
          header('X-Content-Type-Options: nosniff');
          if(($_SERVER['REQUEST_METHOD']??'')!=='POST' || time()>__EXPIRES__ ||
             !hash_equals('__TOKEN__',(string)($_SERVER['HTTP_X_HD_V37_AUDIT']??''))){
            http_response_code(404);exit;
          }
          try {
            $base=__DIR__.'/api-v2';
            require $base.'/vendor/autoload.php';
            \\Dotenv\\Dotenv::createImmutable($base)->safeLoad();
            if(($_ENV['DB_HOST']??'')!=='sql307.infinityfree.com' ||
               ($_ENV['DB_DATABASE']??'')!=='if0_43460400_rutahyd2_es'){
              throw new \\RuntimeException('wrong_database');
            }
            $pdo=new \\PDO(
              'mysql:host='.$_ENV['DB_HOST'].';port=3306;dbname='.$_ENV['DB_DATABASE'].';charset=utf8mb4',
              (string)($_ENV['DB_USERNAME']??''),(string)($_ENV['DB_PASSWORD']??''),
              [\\PDO::ATTR_ERRMODE=>\\PDO::ERRMODE_EXCEPTION,\\PDO::ATTR_TIMEOUT=>8]
            );
            $pdo->exec('SET SESSION TRANSACTION READ ONLY');
            $columns=$pdo->query("SHOW COLUMNS FROM productos LIKE 'costo_promedio_ponderado'")->fetch(\\PDO::FETCH_ASSOC);
            $ready=$columns &&
              strtolower((string)$columns['Type'])==='decimal(15,4)' &&
              strtoupper((string)$columns['Null'])==='NO' &&
              (float)$columns['Default']===0.0;
            if($ready)$pdo->query('SELECT costo_promedio_ponderado FROM productos LIMIT 1')->fetchColumn();
            if(!$ready)http_response_code(412);
            echo json_encode([
              'ready'=>(bool)$ready,
              'column_present'=>(bool)$columns,
              'column_type'=>$columns['Type']??null,
              'nullable'=>$columns['Null']??null,
              'default'=>$columns['Default']??null
            ],JSON_UNESCAPED_UNICODE);
          }catch(\\Throwable $e){
            http_response_code(503);
            echo json_encode(['ready'=>false,'stage'=>'schema_read_only','error_class'=>get_class($e)]);
          }
          """
          php=php.replace('__TOKEN__',token).replace('__EXPIRES__',expires)
          pathlib.Path('/tmp/hdv37/audit.php').write_text(php)
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as f:
            f.write('SCHEMA_PROBE='+name+'\nSCHEMA_KEY='+token+'\n')
          PY
          php -l /tmp/hdv37/audit.php
      - name: Publicar sonda temporal protegida sin tocar la base
        run: |
          set -euo pipefail
          set +x
          cat >/tmp/hdv37/probe-put.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 45
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          put /tmp/hdv37/audit.php -o "/htdocs/$SCHEMA_PROBE"
          bye
          EOF
          lftp -f /tmp/hdv37/probe-put.lftp >/dev/null
      - name: Confirmar solo lectura columna DDL28 exacta en MariaDB
        working-directory: /tmp/hdv37/browser
        run: |
          set -euo pipefail
          set +x
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({locale:'es-CL'});
            await page.goto('https://rutahyd2.free.nf/',{waitUntil:'domcontentloaded',timeout:55000});
            await page.waitForTimeout(8000);
            const result=await page.evaluate(async({name,key})=>{
              const controller=new AbortController();
              const timeout=setTimeout(()=>controller.abort(),25000);
              try {
                const response=await fetch('/'+name,{method:'POST',cache:'no-store',
                  credentials:'same-origin',headers:{'X-HD-V37-Audit':key,Accept:'application/json'},
                  signal:controller.signal});
                const data=(response.headers.get('content-type')||'').includes('json')
                  ? await response.json() : {};
                return {http:response.status,...data};
              }finally{clearTimeout(timeout)}
            },{name:process.env.SCHEMA_PROBE,key:process.env.SCHEMA_KEY});
            console.log('DDL28_SCHEMA_AUDIT',JSON.stringify(result));
            if(result.http!==200 || result.ready!==true)
              throw Error('DDL28 no verificado; se impide publicar V37.');
          }finally{await browser.close();}
          JS
          echo 'DDL28 verificado con SHOW COLUMNS y SELECT de solo lectura.' >> "$GITHUB_STEP_SUMMARY"
      - name: Publicar controlador, JS, CSS y por último HTML
        run: |
          set -euo pipefail
          set +x
          touch /tmp/hdv37/upload-started
          cat >/tmp/hdv37/put.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 45
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          put /tmp/hdv37/backend-after.php -o /htdocs/api-v2/app/Http/Controllers/ProductoComercialControlador.php
          put /tmp/hdv37front/assets/js/productos-remotos.js -o /htdocs/assets/js/productos-remotos.js
          put /tmp/hdv37front/assets/css/productos-costo-promedio-v37.css -o /htdocs/assets/css/productos-costo-promedio-v37.css
          put /tmp/hdv37front/index.html -o /htdocs/index.html
          bye
          EOF
          lftp -f /tmp/hdv37/put.lftp >/dev/null
      - name: Verificar archivos por bytes, protección API y estado público
        working-directory: /tmp/hdv37/browser
        run: |
          set -euo pipefail
          set +x
          cat >/tmp/hdv37/verify.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 45
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          get /htdocs/index.html -o /tmp/hdv37/index-check.html
          get /htdocs/assets/js/productos-remotos.js -o /tmp/hdv37/front-check.js
          get /htdocs/assets/css/productos-costo-promedio-v37.css -o /tmp/hdv37/cost-check.css
          get /htdocs/api-v2/app/Http/Controllers/ProductoComercialControlador.php -o /tmp/hdv37/backend-check.php
          get /htdocs/api-v2/.htaccess -o /tmp/hdv37/guard-after
          get /htdocs/api/index.php -o /tmp/hdv37/gateway-after
          bye
          EOF
          lftp -f /tmp/hdv37/verify.lftp >/dev/null
          cmp -s /tmp/hdv37front/index.html /tmp/hdv37/index-check.html
          cmp -s /tmp/hdv37front/assets/js/productos-remotos.js /tmp/hdv37/front-check.js
          cmp -s /tmp/hdv37front/assets/css/productos-costo-promedio-v37.css /tmp/hdv37/cost-check.css
          cmp -s /tmp/hdv37/backend-after.php /tmp/hdv37/backend-check.php
          cmp -s /tmp/hdv37/guard-before /tmp/hdv37/guard-after
          cmp -s /tmp/hdv37/gateway-before /tmp/hdv37/gateway-after
          php -l /tmp/hdv37/backend-check.php
          node --check /tmp/hdv37/front-check.js
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({locale:'es-CL'});
            await page.goto('https://rutahyd2.free.nf/',{waitUntil:'domcontentloaded',timeout:55000});
            await page.waitForTimeout(8000);
            const result=await page.evaluate(async()=>{
              const outcomes=await Promise.all(['estado','productos'].map(async(path)=>{
                const response=await fetch('/api/v1/'+path,{headers:{Accept:'application/json'},cache:'no-store'});
                return {path,status:response.status};
              }));
              return {scripts:[...document.querySelectorAll('script[src]')].map(x=>x.getAttribute('src')),
                styles:[...document.querySelectorAll('link[rel=stylesheet]')].map(x=>x.getAttribute('href')),
                outcomes};
            });
            console.log('V37_PUBLIC_SMOKE',JSON.stringify(result));
            if(!result.scripts.some(x=>x.includes('productos-remotos.js?v=20261122-cost37')) ||
               !result.styles.some(x=>x.includes('productos-costo-promedio-v37.css?v=20261122-cost37')) ||
               result.outcomes.find(x=>x.path==='estado')?.status!==200 ||
               result.outcomes.find(x=>x.path==='productos')?.status!==401)
              throw Error('Fallo frontend V37 o protección de API.');
          }finally{await browser.close();}
          JS
          echo 'Publicación V37 exitosa: archivos cotejados, API JWT protegida, sin escritura SQL.' >> "$GITHUB_STEP_SUMMARY"
      - name: Restaurar versión V36 y controlador anterior si falla publicación
        if: failure()
        run: |
          set +x
          if [ -f /tmp/hdv37/upload-started ] && [ -s /tmp/hdv37/index-before.html ]; then
            cat >/tmp/hdv37/rollback.lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          put /tmp/hdv37/backend-live-before.php -o /htdocs/api-v2/app/Http/Controllers/ProductoComercialControlador.php
          put /tmp/hdv37/front-live-before.js -o /htdocs/assets/js/productos-remotos.js
          put /tmp/hdv37/index-before.html -o /htdocs/index.html
          bye
          EOF
            lftp -f /tmp/hdv37/rollback.lftp >/dev/null ||
              echo "::error::Rollback incompleto: revisar archivos productivos por FTPS"
          fi
      - name: Eliminar sonda temporal incluso ante fallo
        if: always()
        run: |
          set +x
          if [ -n "${SCHEMA_PROBE:-}" ]; then
            cat >/tmp/hdv37/probe-rm.lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          rm "/htdocs/$SCHEMA_PROBE"
          bye
          EOF
            lftp -f /tmp/hdv37/probe-rm.lftp >/dev/null ||
              echo "::error::No se pudo verificar borrado de sonda protegida; expirará a los 15 minutos"
          fi
          rm -rf /tmp/hdv37 /tmp/hdv37back /tmp/hdv37front
