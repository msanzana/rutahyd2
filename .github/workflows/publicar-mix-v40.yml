name: Publicar Ruta HD V40 mix multiple con respaldo y rollback
on:
  push:
    branches: [feature/v40-mix-proveedor-seleccion-multiple-20261122]
    paths: [deployment/solicitudes/publicar-mix-v40.txt]
permissions:
  contents: read
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-24.04
    timeout-minutes: 34
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
      BACK_BASE: 5c1fcfe011b84b17546b04514f14357af77fd310
      FRONT_BASE: 6a78b5fc5b11ddc3bd8ac4a35be587f2c144ab6d
      FRONT_PIN: d93ac2b8ab187c44f2cc1faaa67bc6092dbe1834
    steps:
      - uses: actions/checkout@v4
      - name: Preparar herramientas y fuentes fijadas
        run: |
          set -euo pipefail
          test -n "$FTP_PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          git clone -q --depth 1 --branch feature/v40-mix-proveedor-seleccion-multiple-20261122 https://github.com/msanzana/rutahyd2.git /tmp/v40back
          git -C /tmp/v40back fetch -q --depth 1 origin "$BACK_BASE"
          git clone -q --depth 1 --branch feature/v40-mix-proveedor-seleccion-multiple-20261122 https://github.com/msanzana/rutahyd2front.git /tmp/v40front
          git -C /tmp/v40front fetch -q --depth 1 origin "$FRONT_BASE" "$FRONT_PIN"
          git -C /tmp/v40front checkout -q --detach "$FRONT_PIN"
          test "$(git -C /tmp/v40front rev-parse HEAD)" = "$FRONT_PIN"
          mkdir -p /tmp/v40/{before_back,before_front,after_back,after_front}
      - name: Descargar archivos productivos de V39, sin modificar nada
        run: |
          set -euo pipefail
          set +x
          umask 077
          python3 - <<'PY'
          import os,pathlib,runpy
          d=runpy.run_path('scripts/ensamblar_mix_v40.py')
          root=pathlib.Path('/tmp/v40')
          with (root/'read.lftp').open('w') as f:
            for x in ['set cmd:fail-exit yes','set net:timeout 45','set net:max-retries 2',
              'set ftp:ssl-force yes','set ftp:ssl-protect-data yes',
              'set ssl:verify-certificate yes']:print(x,file=f)
            print('open -u "'+os.environ['FTP_USER']+'","'+os.environ['FTP_PASSWORD']+'" ftp://'+os.environ['FTP_HOST'],file=f)
            for path in d['BACK_FILES']:
              target=root/'before_back'/path;target.parent.mkdir(parents=True,exist_ok=True)
              print('get "/htdocs/api-v2/'+path+'" -o "'+str(target)+'"',file=f)
            for path in d['FRONT_FILES']+['index.html']:
              target=root/'before_front'/path;target.parent.mkdir(parents=True,exist_ok=True)
              print('get "/htdocs/'+path+'" -o "'+str(target)+'"',file=f)
            print('cls -1 /htdocs/assets/css > /tmp/v40/css-list',file=f)
            print('get /htdocs/api-v2/.htaccess -o /tmp/v40/private-protection',file=f)
            print('get /htdocs/api/.htaccess -o /tmp/v40/gateway-protection',file=f)
            print('get /htdocs/api/index.php -o /tmp/v40/gateway',file=f)
            print('bye',file=f)
          PY
          lftp -f /tmp/v40/read.lftp >/dev/null
          grep -Fq 'Require all denied' /tmp/v40/private-protection
          grep -Fq 'HTTP_AUTHORIZATION' /tmp/v40/gateway-protection
          grep -Fq 'rutahd2_api_ready' /tmp/v40/gateway
          ! grep -Fxq 'mix-proveedores-v40.css' /tmp/v40/css-list
      - name: Fusionar cambios con producción y validar frontend y Laravel
        run: |
          set -euo pipefail
          python3 scripts/ensamblar_mix_v40.py
          php -l /tmp/v40/after_back/routes/api.php
          php -l /tmp/v40/after_back/app/Http/Controllers/ProductosProveedoresControlador.php
          node --check /tmp/v40/after_front/assets/js/catalogos-api.js
          node --check /tmp/v40/after_front/assets/js/proveedores-productos.js
          test -s /tmp/v40/after_front/assets/css/mix-proveedores-v40.css
          grep -Fq 'proveedores-productos/lote' /tmp/v40/after_back/routes/api.php
          grep -Fq 'Buscar y agregar productos' /tmp/v40/after_front/assets/js/proveedores-productos.js
          grep -Fq 'mix-proveedores-v40.css' /tmp/v40/after_front/index.html
          echo 'PRECHECK V40 OK; archivos comparados, sintaxis correcta, sin subir ni cambiar datos.' >> "$GITHUB_STEP_SUMMARY"
      - name: Preparar comprobación de navegador
        run: |
          set -euo pipefail
          mkdir -p /tmp/v40/browser
          cd /tmp/v40/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Guardar respaldo previo para recuperación
        uses: actions/upload-artifact@v4
        with:
          name: rutahd-v40-respaldo-antes-de-mix-multiple
          path: |
            /tmp/v40/before_back/
            /tmp/v40/before_front/
            /tmp/v40/private-protection
            /tmp/v40/gateway-protection
            /tmp/v40/gateway
          retention-days: 30
          if-no-files-found: error
      - name: Subir cambios mínimos FTPS sin escribir datos
        run: |
          set -euo pipefail
          set +x
          umask 077
          touch /tmp/v40/upload-started
          python3 - <<'PY'
          import os,pathlib,runpy
          d=runpy.run_path('scripts/ensamblar_mix_v40.py')
          root=pathlib.Path('/tmp/v40')
          with (root/'upload.lftp').open('w') as f:
            for x in ['set cmd:fail-exit yes','set net:timeout 45','set net:max-retries 2',
              'set ftp:ssl-force yes','set ftp:ssl-protect-data yes',
              'set ssl:verify-certificate yes']:print(x,file=f)
            print('open -u "'+os.environ['FTP_USER']+'","'+os.environ['FTP_PASSWORD']+'" ftp://'+os.environ['FTP_HOST'],file=f)
            for path in d['BACK_FILES']:
              print('put "/tmp/v40/after_back/'+path+'" -o "/htdocs/api-v2/'+path+'"',file=f)
            for path in d['FRONT_FILES']+d['NEW_FILES']:
              print('put "/tmp/v40/after_front/'+path+'" -o "/htdocs/'+path+'"',file=f)
            print('put /tmp/v40/after_front/index.html -o /htdocs/index.html',file=f)
            print('bye',file=f)
          PY
          lftp -f /tmp/v40/upload.lftp >/dev/null
      - name: Descargar de nuevo y comprobar bytes y protecciones
        run: |
          set -euo pipefail
          set +x
          umask 077
          python3 - <<'PY'
          import os,pathlib,runpy
          d=runpy.run_path('scripts/ensamblar_mix_v40.py')
          root=pathlib.Path('/tmp/v40')
          with (root/'verify.lftp').open('w') as f:
            for x in ['set cmd:fail-exit yes','set net:timeout 45','set net:max-retries 2',
              'set ftp:ssl-force yes','set ftp:ssl-protect-data yes',
              'set ssl:verify-certificate yes']:print(x,file=f)
            print('open -u "'+os.environ['FTP_USER']+'","'+os.environ['FTP_PASSWORD']+'" ftp://'+os.environ['FTP_HOST'],file=f)
            for path in d['BACK_FILES']:
              dest=root/'verified_back'/path;dest.parent.mkdir(parents=True,exist_ok=True)
              print('get "/htdocs/api-v2/'+path+'" -o "'+str(dest)+'"',file=f)
            for path in d['FRONT_FILES']+d['NEW_FILES']+['index.html']:
              dest=root/'verified_front'/path;dest.parent.mkdir(parents=True,exist_ok=True)
              print('get "/htdocs/'+path+'" -o "'+str(dest)+'"',file=f)
            for path,dest in [
              ('/htdocs/api-v2/.htaccess','/tmp/v40/private-protection-after'),
              ('/htdocs/api/.htaccess','/tmp/v40/gateway-protection-after'),
              ('/htdocs/api/index.php','/tmp/v40/gateway-after')]:
              print('get "'+path+'" -o "'+dest+'"',file=f)
            print('bye',file=f)
          PY
          lftp -f /tmp/v40/verify.lftp >/dev/null
          python3 - <<'PY'
          import pathlib,runpy
          d=runpy.run_path('scripts/ensamblar_mix_v40.py')
          root=pathlib.Path('/tmp/v40')
          for path in d['BACK_FILES']:
            assert (root/'after_back'/path).read_bytes()==(root/'verified_back'/path).read_bytes(),path
          for path in d['FRONT_FILES']+d['NEW_FILES']+['index.html']:
            assert (root/'after_front'/path).read_bytes()==(root/'verified_front'/path).read_bytes(),path
          for name in ['private-protection','gateway-protection','gateway']:
            assert (root/name).read_bytes()==(root/(name+'-after')).read_bytes(),name
          print('V40_UPLOAD_VERIFIED: seis archivos, seguridad Apache y gateway intactos')
          PY
      - name: Smoke público V40 y autorización JWT sin credenciales
        working-directory: /tmp/v40/browser
        run: |
          set -euo pipefail
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({locale:'es-CL'});
            await page.goto('https://rutahyd2.free.nf/?v40=20261122',{
              waitUntil:'domcontentloaded',timeout:55000});
            await page.waitForTimeout(8000);
            const evidence=await page.evaluate(async()=>{
              const routes=[
                {path:'/api/v1/estado',method:'GET',want:200},
                {path:'/api/v1/proveedores-productos/lote',method:'POST',want:401},
                {path:'/assets/js/proveedores-productos.js?v=20261122-v40prod',method:'GET',want:200},
                {path:'/assets/js/catalogos-api.js?v=20261122-v40prod',method:'GET',want:200},
                {path:'/assets/css/mix-proveedores-v40.css?v=20261122-v40prod',method:'GET',want:200}
              ];
              const checks=await Promise.all(routes.map(async q=>{
                const response=await fetch(q.path,{
                  method:q.method,cache:'no-store',
                  headers:{Accept:'application/json','Content-Type':'application/json'},
                  ...(q.method==='POST'?{body:'{}'}:{})
                });
                return {path:q.path,http:response.status,want:q.want};
              }));
              return {
                logo:!!document.querySelector('.brand-logo'),
                geo:!!document.querySelector('#ubicacionesSubnav'),
                searchReady:typeof window.RutaHDBuscadorProductos?.openMultiple==='function',
                batchReady:typeof window.RutaHDApiCatalogos?.createProductSuppliersBatch==='function',
                cache:!!document.querySelector('script[src*="proveedores-productos.js?v=20261122-v40prod"]'),
                css:!!document.querySelector('link[href*="mix-proveedores-v40.css?v=20261122-v40prod"]'),
                checks
              };
            });
            console.log('V40_SMOKE',JSON.stringify(evidence));
            if(!evidence.logo||!evidence.geo||!evidence.searchReady||
              !evidence.batchReady||!evidence.cache||!evidence.css||
              evidence.checks.some(item=>item.http!==item.want))
              throw Error('V40 smoke incorrecto: rollback necesario');
          }finally{await browser.close();}
          JS
          echo 'V40 publicada, 6 archivos cotejados, API transaccional protegida JWT, UI visible.' >> "$GITHUB_STEP_SUMMARY"
      - name: Rollback automático ante fallo posterior a upload
        if: failure()
        run: |
          set +x
          if [ -f /tmp/v40/upload-started ] && [ -s /tmp/v40/before_front/index.html ]; then
            python3 - <<'PY'
            import os,pathlib,runpy
            d=runpy.run_path('scripts/ensamblar_mix_v40.py')
            root=pathlib.Path('/tmp/v40')
            with (root/'rollback.lftp').open('w') as f:
              for x in ['set cmd:fail-exit yes','set net:timeout 45','set net:max-retries 3',
                'set ftp:ssl-force yes','set ftp:ssl-protect-data yes',
                'set ssl:verify-certificate yes']:print(x,file=f)
              print('open -u "'+os.environ['FTP_USER']+'","'+os.environ['FTP_PASSWORD']+'" ftp://'+os.environ['FTP_HOST'],file=f)
              for path in d['BACK_FILES']:
                print('put "/tmp/v40/before_back/'+path+'" -o "/htdocs/api-v2/'+path+'"',file=f)
              for path in d['FRONT_FILES']:
                print('put "/tmp/v40/before_front/'+path+'" -o "/htdocs/'+path+'"',file=f)
              print('put /tmp/v40/before_front/index.html -o /htdocs/index.html',file=f)
              print('set cmd:fail-exit no',file=f)
              print('rm /htdocs/assets/css/mix-proveedores-v40.css',file=f)
              print('bye',file=f)
            PY
            lftp -f /tmp/v40/rollback.lftp >/dev/null ||
              echo '::error::Restauración incompleta: utilizar artifact de respaldo'
          else
            echo 'No hubo modificación productiva que revertir.'
          fi
      - name: Limpiar comandos temporales con contraseña
        if: always()
        run: rm -f /tmp/v40/read.lftp /tmp/v40/upload.lftp /tmp/v40/verify.lftp /tmp/v40/rollback.lftp
