name: Publicar aplicación definitiva solo producción sin demostración
on:
  push:
    branches: [main]
    paths: [deployment/solicitudes/publicar-produccion-sin-demo-20261121.txt]
permissions:
  contents: read
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    steps:
      - name: Validar version del frontend y crear HTML
        run: |
          set -euo pipefail
          git clone --depth 1 --branch main https://github.com/msanzana/rutahyd2front.git /tmp/front
          test -n "$(git -C /tmp/front rev-parse HEAD)"
          echo "FRONTEND_SHA=$(git -C /tmp/front rev-parse HEAD)" >> "$GITHUB_ENV"
          for f in /tmp/front/assets/js/*.js; do node --check "$f"; done
          grep -Fq 'product-editor-dialog' /tmp/front/assets/js/productos-remotos.js
          grep -Fq 'product-editor-dialog' /tmp/front/assets/css/produccion.css
          grep -Fq 'productSuppliers' /tmp/front/assets/js/catalogos-api.js
          grep -Fq 'supplier-products-module' /tmp/front/assets/js/proveedores-productos.js
          test -f /tmp/front/assets/css/crud-v18.css
          grep -Fq 'crud-v18.css?v=20261122-fix19' /tmp/front/index.html
          grep -Fq 'listados-tema-v20.css?v=20261122-v31' /tmp/front/index.html
          grep -Fq 'menu-usuario.js?v=20261122-ui20' /tmp/front/index.html
          grep -Fq 'listados-ui.js?v=20261122-v31' /tmp/front/index.html
          test -s /tmp/front/assets/js/menu-usuario.js
          test -s /tmp/front/assets/js/listados-ui.js
          test -s /tmp/front/assets/js/validacion-ui.js
          test -s /tmp/front/assets/js/listas-precios.js
          test -s /tmp/front/assets/js/ventas-precios.js
          test -s /tmp/front/assets/css/login-foto-v26.css
          test -s /tmp/front/assets/css/productos-densidad-v28.css
          test -s /tmp/front/assets/js/galeria-productos.js
          grep -Fq 'productos-densidad-v28.css?v=20261122-v31' /tmp/front/index.html
          grep -Fq 'galeria-productos.js?v=20261122-v31' /tmp/front/index.html
          grep -Fq 'uploadProductPhotos:' /tmp/front/assets/js/catalogos-api.js
          grep -Fq "button('Nuevo Producto'" /tmp/front/assets/js/productos-remotos.js
          grep -Fq 'login-foto-v26.css?v=20261122-login26' /tmp/front/index.html
          grep -Fq 'data:image/webp;base64,' /tmp/front/assets/css/login-foto-v26.css
          grep -Fq 'listas-precios.js?v=20261122-v31' /tmp/front/index.html
          grep -Fq 'ventas-precios.js?v=20261122-v31' /tmp/front/index.html
          grep -Fq 'modulos-oficiales.js?v=20261122-prices25' /tmp/front/index.html
          grep -Fq 'admin-remoto.js?v=20261122-prices25' /tmp/front/index.html
          grep -Fq 'data-nav="listas_precios"' /tmp/front/index.html
          grep -Fq 'validacion-ui.js?v=20261122-filters22' /tmp/front/index.html
          grep -Fq 'productos-remotos.js?v=20261122-v31' /tmp/front/index.html
          grep -Fq 'catalogos-api.js?v=20261122-v31' /tmp/front/index.html
          grep -Fq "event.target.closest('#infoClose')" /tmp/front/assets/js/app-produccion.js
          grep -Fq 'app-produccion.js?v=20261122-prices25' /tmp/front/index.html
          test -s /tmp/front/assets/css/listados-tema-v20.css
          ! grep -Fq 'id="apiStatus"' /tmp/front/index.html
          ! grep -Fq 'id="heroLogin"' /tmp/front/index.html
          ! grep -Fq 'Cerrar sesión remota' /tmp/front/assets/js/admin-remoto.js
          grep -Fq 'const key=selected;' /tmp/front/assets/js/admin-remoto.js
          grep -Fq 'No hay registros guardados' /tmp/front/assets/js/admin-remoto.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('/tmp/front/index.html').read_text('utf-8')
          assert s.count('data-catalog-key=')==6 and s.count('data-admin-catalog=')==4
          assert 'subnav-heading' not in s and 'nav-depth-' not in s
          assert s.count('id="loginDialog"')==1
          nav=s.split('<nav class="nav"',1)[1].split('</nav>',1)[0]
          keys=['administracion','compras','ventas','proveedores','clientes','productos','bodega','cuentas_corrientes']
          positions=[nav.index('data-nav="'+x+'" class="nav-link') for x in keys]
          assert positions==sorted(positions) and nav.count('class="nav-link"')==8
          assert s.count('id="loginDemo"')==0
          assert 'Explorar interfaz de demostración' not in s
          assert 'src="assets/js/app-produccion.js' in s
          assert 'src="assets/js/login-produccion.js' in s
          assert 'assets/css/produccion.css' in s
          assert '<meta name="referrer" content="no-referrer">' in s
          assert 'src="assets/js/recuperacion.js"' in s
          assert 'src="assets/js/catalogos.js"' not in s
          assert 'src="assets/js/app.js"' not in s
          assert 'assets/js/modulos-oficiales.js' in s
          assert 'assets/js/proveedores-productos.js' in s
          assert 'id="providerSubnav"' in s
          assert 'assets/css/menu-oficial.css' in s
          assert s.count('assets/img/prueba-rutahd2.webp')==3
          # El servidor publica el PNG oficial desde /hd-branding. No reponer WebP ausente.
          s=s.replace('assets/img/prueba-rutahd2.webp','hd-branding/logo-hd-site.png?v=20261122-prod17')
          assert s.count('hd-branding/logo-hd-site.png?v=20261122-prod17')==3
          s=s.replace('href="assets/css/app.css"','href="assets/css/app.css?v=20261122-prod17"')
          s=s.replace('correcciones-ui.css?v=20261121-1','correcciones-ui.css?v=20261122-prod17')
          s=s.replace('menu-oficial.css?v=20261121-2','menu-oficial.css?v=20261122-prod17')
          s=s.replace('produccion.css?v=20261121-1','produccion.css?v=20261122-prod17')
          s=re.sub(r'src="assets/js/([a-z-]+)\.js"',r'src="assets/js/\1.js?v=20261122-prod17"',s)
          assert s.count('src="assets/js/login-produccion.js?v=20261122-ui20"')==1
          assert s.count('src="assets/js/app-produccion.js?v=20261122-prices25"')==1
          Path('/tmp/release_index.html').write_text(s,'utf-8')
          Path('/tmp/redirect_violeta.html').write_text(
            '<!doctype html><html lang="es"><head><meta charset="utf-8"><title>Ruta H&D2 · Producción</title>'
            '<meta http-equiv="refresh" content="0; url=/"></head>'
            '<body><p>La aplicación funciona en el sitio oficial. <a href="/">Abrir Ruta H&D2</a></p>'
            '<script>location.replace("/");</script></body></html>','utf-8')
          PY
      - name: Instalar cliente FTPS
        run: |
          test -n "$FTP_PASSWORD"
          sudo apt-get -qq update && sudo apt-get -qq install -y lftp
      - name: Respaldar HTML JS CSS publicos y comprobar guardia Laravel
        run: |
          set -euo pipefail
          set +x
          umask 077
          mkdir -p /tmp/old_root_js /tmp/old_violet_js /tmp/old_root_css /tmp/old_violet_css
          cat >/tmp/read.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 45
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          get /htdocs/index.html -o /tmp/root_before.html
          get /htdocs/violeta-demo/index.html -o /tmp/violet_before.html
          get /htdocs/api-v2/.htaccess -o /tmp/guard_before
          get /htdocs/hd-branding/logo-hd-site.png -o /tmp/logo_prod
          mirror /htdocs/assets/js /tmp/old_root_js
          mirror /htdocs/assets/css /tmp/old_root_css
          mirror /htdocs/violeta-demo/assets/js /tmp/old_violet_js
          mirror /htdocs/violeta-demo/assets/css /tmp/old_violet_css
          bye
          EOF
          lftp -f /tmp/read.lftp >/dev/null
          grep -Fq 'Require all denied' /tmp/guard_before
          test "$(head -c 8 /tmp/logo_prod | od -An -tx1 | tr -d ' \n')" = 89504e470d0a1a0a
          python3 - <<'PY'
          from pathlib import Path
          names=['administracion','compras','ventas','proveedores','clientes','productos','bodega','cuentas_corrientes']
          s=Path('/tmp/root_before.html').read_text('utf-8')
          nav=s.split('<nav class="nav"',1)[1].split('</nav>',1)[0]
          assert s.count('data-catalog-key=') in (6,10)
          assert s.count('data-admin-catalog=') in (4,10)
          x=[nav.index('data-nav="'+n+'" class="nav-link') for n in names]
          assert x==sorted(x)
          PY
      - name: Publicar recursos primero y HTML al final
        run: |
          set -euo pipefail
          set +x
          cat >/tmp/write.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 45
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          mirror -R --verbose=0 /tmp/front/assets/js /htdocs/assets/js
          mirror -R --verbose=0 /tmp/front/assets/css /htdocs/assets/css
          put /tmp/release_index.html -o /htdocs/index.html
          put /tmp/redirect_violeta.html -o /htdocs/violeta-demo/index.html
          bye
          EOF
          lftp -f /tmp/write.lftp >/dev/null
      - name: Comparar bytes de producción y mantener backend intacto
        run: |
          set -euo pipefail
          set +x
          cat >/tmp/verify.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 45
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          get /htdocs/index.html -o /tmp/root_after.html
          get /htdocs/violeta-demo/index.html -o /tmp/violet_after.html
          get /htdocs/assets/js/login-produccion.js -o /tmp/login_after.js
          get /htdocs/assets/js/app-produccion.js -o /tmp/app_after.js
          get /htdocs/assets/js/catalogos-api.js -o /tmp/api_after.js
          get /htdocs/assets/js/productos-remotos.js -o /tmp/product_after.js
          get /htdocs/assets/js/modulos-oficiales.js -o /tmp/official_after.js
          get /htdocs/assets/js/proveedores-productos.js -o /tmp/suppliers_products_after.js
          get /htdocs/assets/js/admin-remoto.js -o /tmp/admin_after.js
          get /htdocs/assets/js/recuperacion.js -o /tmp/recuperacion_after.js
          get /htdocs/assets/js/accesos.js -o /tmp/accesos_after.js
          get /htdocs/assets/css/produccion.css -o /tmp/css_after.css
          get /htdocs/assets/css/login-foto-v26.css -o /tmp/login_photo_css_after.css
          get /htdocs/assets/css/productos-densidad-v28.css -o /tmp/density_after.css
          get /htdocs/assets/js/galeria-productos.js -o /tmp/gallery_after.js
          get /htdocs/assets/css/crud-v18.css -o /tmp/crud_after.css
          get /htdocs/assets/css/listados-tema-v20.css -o /tmp/listados_css_after.css
          get /htdocs/assets/js/listados-ui.js -o /tmp/listados_js_after.js
          get /htdocs/assets/js/validacion-ui.js -o /tmp/validacion_after.js
          get /htdocs/assets/js/menu-usuario.js -o /tmp/menu_usuario_after.js
          get /htdocs/api-v2/.htaccess -o /tmp/guard_after
          bye
          EOF
          lftp -f /tmp/verify.lftp >/dev/null
          cmp -s /tmp/release_index.html /tmp/root_after.html
          cmp -s /tmp/redirect_violeta.html /tmp/violet_after.html
          cmp -s /tmp/front/assets/js/login-produccion.js /tmp/login_after.js
          cmp -s /tmp/front/assets/js/app-produccion.js /tmp/app_after.js
          cmp -s /tmp/front/assets/js/catalogos-api.js /tmp/api_after.js
          cmp -s /tmp/front/assets/js/productos-remotos.js /tmp/product_after.js
          cmp -s /tmp/front/assets/js/modulos-oficiales.js /tmp/official_after.js
          cmp -s /tmp/front/assets/js/proveedores-productos.js /tmp/suppliers_products_after.js
          cmp -s /tmp/front/assets/js/admin-remoto.js /tmp/admin_after.js
          cmp -s /tmp/front/assets/js/recuperacion.js /tmp/recuperacion_after.js
          cmp -s /tmp/front/assets/js/accesos.js /tmp/accesos_after.js
          cmp -s /tmp/front/assets/css/produccion.css /tmp/css_after.css
          cmp -s /tmp/front/assets/css/login-foto-v26.css /tmp/login_photo_css_after.css
          cmp -s /tmp/front/assets/css/productos-densidad-v28.css /tmp/density_after.css
          cmp -s /tmp/front/assets/js/galeria-productos.js /tmp/gallery_after.js
          cmp -s /tmp/front/assets/css/crud-v18.css /tmp/crud_after.css
          cmp -s /tmp/front/assets/css/listados-tema-v20.css /tmp/listados_css_after.css
          cmp -s /tmp/front/assets/js/listados-ui.js /tmp/listados_js_after.js
          cmp -s /tmp/front/assets/js/validacion-ui.js /tmp/validacion_after.js
          cmp -s /tmp/front/assets/js/menu-usuario.js /tmp/menu_usuario_after.js
          cmp -s /tmp/guard_before /tmp/guard_after
          echo "Frontend productivo SHA: $FRONTEND_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo 'Login v26: fotografia realista optimizada, incrustada en CSS y verificada por FTPS byte a byte.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Frontend v29: validación EAN-13 previa al POST, margen compacto, listados v28 y galería preservados. El usuario declaró DDL25 ejecutado; DDL26 correctivo pendiente de aplicar exclusivamente en phpMyAdmin. JWT intacto.' >> "$GITHUB_STEP_SUMMARY"
      - name: Restaurar archivos originales ante cualquier fallo
        if: failure()
        run: |
          set +x
          if [ -s /tmp/root_before.html ] && [ -s /tmp/violet_before.html ] && [ -n "$FTP_PASSWORD" ]; then
            cat >/tmp/rollback.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 45
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          mirror -R --verbose=0 /tmp/old_root_js /htdocs/assets/js
          mirror -R --verbose=0 /tmp/old_root_css /htdocs/assets/css
          mirror -R --verbose=0 /tmp/old_violet_js /htdocs/violeta-demo/assets/js
          mirror -R --verbose=0 /tmp/old_violet_css /htdocs/violeta-demo/assets/css
          put /tmp/root_before.html -o /htdocs/index.html
          put /tmp/violet_before.html -o /htdocs/violeta-demo/index.html
          bye
          EOF
            lftp -f /tmp/rollback.lftp >/dev/null || echo "::error::No se pudo verificar restauración FTPS"
          fi
