name: Publicar vista previa violeta RutaHD2
on:
  push:
    branches: [ main ]
    paths:
      - 'deployment/solicitudes/publicar-violeta.txt'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  vista-previa:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
      FTP_DEST: /htdocs/violeta-demo
    steps:
      - name: Exigir credencial FTPS y destino limitado
        run: |
          test -n "$FTP_PASSWORD" || { echo "::error::No hay secreto FTPS"; exit 1; }
          test "$FTP_DEST" = "/htdocs/violeta-demo"
      - name: Obtener fuente visual desde repositorio frontend
        run: |
          git clone --depth 1 https://github.com/msanzana/rutahyd2front.git /tmp/rutahyd2front
          test -f /tmp/rutahyd2front/index.html
          test -f /tmp/rutahyd2front/assets/css/theme-violet.css
          test -f /tmp/rutahyd2front/assets/img/logo-hd-oficial-v1.jpg
          test "$(file --mime-type -b /tmp/rutahyd2front/assets/img/logo-hd-oficial-v1.jpg)" = image/jpeg
          grep -Fq 'assets/img/logo-hd-oficial-v1.jpg' /tmp/rutahyd2front/index.html
          grep -Fq 'assets/css/theme-violet.css' /tmp/rutahyd2front/index.html
          grep -Fq -- '--brand: #6d28d9;' /tmp/rutahyd2front/assets/css/theme-violet.css
          echo "Archivos violeta listos para publicar como vista previa"
      - name: Instalar cliente FTPS
        run: sudo apt-get -qq update && sudo apt-get -qq install -y lftp
      - name: Publicar frontend y logo V1 en carpeta aislada
        run: |
          set +x
          umask 077
          cat >/tmp/front_upload.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 40
          set net:max-retries 3
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          set cmd:fail-exit no
          mkdir "$FTP_DEST"
          mkdir "$FTP_DEST/assets"
          mkdir "$FTP_DEST/assets/css"
          mkdir "$FTP_DEST/assets/img"
          set cmd:fail-exit yes
          cd "$FTP_DEST"
          put /tmp/rutahyd2front/index.html -o index.html
          put /tmp/rutahyd2front/assets/css/theme-violet.css -o assets/css/theme-violet.css
          put /tmp/rutahyd2front/assets/img/logo-hd-oficial-v1.jpg -o assets/img/logo-hd-oficial-v1.jpg
          bye
          EOF
          lftp -f /tmp/front_upload.lftp
          rm -f /tmp/front_upload.lftp
      - name: Leer de vuelta y comparar archivos publicados
        run: |
          set +x
          umask 077
          cat >/tmp/front_verify.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 40
          set net:max-retries 2
          set ftp:ssl-allow yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          get "$FTP_DEST/index.html" -o /tmp/frontend_verificado.html
          get "$FTP_DEST/assets/css/theme-violet.css" -o /tmp/tema_verificado.css
          get "$FTP_DEST/assets/img/logo-hd-oficial-v1.jpg" -o /tmp/logo_v1_verificado.jpg
          bye
          EOF
          lftp -f /tmp/front_verify.lftp
          for par in "html /tmp/rutahyd2front/index.html /tmp/frontend_verificado.html" "css /tmp/rutahyd2front/assets/css/theme-violet.css /tmp/tema_verificado.css" "logo /tmp/rutahyd2front/assets/img/logo-hd-oficial-v1.jpg /tmp/logo_v1_verificado.jpg"; do
            read -r nombre original copia <<< "$par"
            if cmp -s "$original" "$copia"; then
              echo "VERIFICADO: $nombre $(wc -c < "$original") bytes"
            else
              echo "::error::Archivo $nombre no coincide con el original"
              echo "ORIGEN ($nombre):"; sha256sum "$original"
              echo "REMOTO ($nombre):"; sha256sum "$copia"
              exit 1
            fi
          done
          echo "Vista previa violeta y logo original H&D V1: 3 archivos verificados por FTPS"
          echo "No se modifico index2.html ni /htdocs/api-v2"
          printf '[Ver vista previa violeta](https://rutahyd2.free.nf/violeta-demo/index.html)\n' >> "$GITHUB_STEP_SUMMARY"
