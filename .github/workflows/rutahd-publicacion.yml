name: Ruta H&D - Publicaciones

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version del paquete (ej. V109D6C)'
        required: true
        type: string
        default: 'V109D6C'
      run_id:
        description: 'ID de la ejecucion que genero el paquete'
        required: true
        type: string
        default: '45927132714'
      artifact_id:
        description: 'ID del artefacto que contiene el paquete ZIP'
        required: true
        type: string
        default: '15166647801'
      sha256:
        description: 'SHA256 del ZIP, 64 caracteres hexadecimales'
        required: true
        type: string
        default: 'bb3180722da670a07ab3501e43b53aeca9efac8a0741f206eb98a8a8679f8f26'

permissions:
  contents: read
  actions: read

concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false

jobs:
  validacion:
    name: PUB04A - Diagnosticar referencias productivas sin publicar
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.ref == 'refs/heads/main'
    env:
      VERSION: ${{ inputs.version }}
      SOURCE_RUN: ${{ inputs.run_id }}
      ARTIFACT_ID: ${{ inputs.artifact_id }}
      EXPECTED_SHA: ${{ inputs.sha256 }}
    steps:
      - name: Comprobar parametros y origen del artefacto
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^V[0-9][A-Z0-9]{0,30}$ ]]
          [[ "$SOURCE_RUN" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$ARTIFACT_ID" =~ ^[1-9][0-9]{0,19}$ ]]
          [[ "$EXPECTED_SHA" =~ ^[a-fA-F0-9]{64}$ ]]
          test "$GITHUB_REPOSITORY" = 'msanzana/rutahyd2'
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN" > run.json
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts?per_page=100" > artifacts.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          run = json.loads(Path('run.json').read_text())
          pages = json.loads(Path('artifacts.json').read_text())
          assert str(run['id']) == os.environ['SOURCE_RUN']
          assert run['status'] == 'completed' and run['conclusion'] == 'success', 'Ejecucion de origen no exitosa'
          expected_name = 'rutahd-' + os.environ['VERSION'].lower() + '-paquete-revision'
          matches = [a for p in pages for a in p['artifacts'] if str(a['id']) == os.environ['ARTIFACT_ID']]
          assert len(matches) == 1, 'Artefacto no pertenece a la ejecucion indicada'
          a = matches[0]
          assert a['name'] == expected_name, 'Nombre de artefacto no corresponde a la version'
          assert a['expired'] is False, 'Artefacto vencido'
          assert a['digest'] == 'sha256:' + os.environ['EXPECTED_SHA'].lower(), 'SHA256 de metadatos no coincide'
          assert 0 < a['size_in_bytes'] <= 50 * 1024 * 1024, 'Tamano de paquete fuera de limite'
          print('ORIGEN Y METADATOS CORRECTOS')
          PY
      - name: Descargar ZIP y comprobar SHA256 externo
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-time 120 --max-filesize 52428800 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$ARTIFACT_ID/zip" \
            --output paquete.zip
          printf '%s  paquete.zip\n' "${EXPECTED_SHA,,}" | sha256sum --check --strict
      - name: Validar estructura, rutas y manifiesto completo
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, re, stat, zipfile
          from pathlib import Path
          def check(condition, message):
              if not condition:
                  raise SystemExit(message)
          def allowed(name):
              if name in {'ESTADO.txt', 'SHA256SUMS'}:
                  return True
              parts = name.split('/')
              if len(parts) < 3 or parts[0] not in {'candidato', 'referencia'}:
                  return False
              if not all(re.fullmatch(r'[A-Za-z0-9_-][A-Za-z0-9_.-]*', p) for p in parts):
                  return False
              if any(p.lower() in {'vendor', 'node_modules', 'storage', 'secrets', 'credentials', 'database', 'tests', 'backups'} for p in parts):
                  return False
              if any(re.search(r'(?i)(?:^|[_.-])(secret|credential|password|private[_-]?key|env)(?:[_.-]|$)', p) for p in parts):
                  return False
              relative = '/'.join(parts[2:])
              if parts[1] == 'backend':
                  return relative == 'routes/api.php' or (relative.startswith(('app/', 'config/')) and relative.endswith('.php'))
              if parts[1] == 'frontend':
                  return relative == 'index.html' or (relative.startswith('assets/') and Path(relative).suffix.lower() in {'.js', '.css', '.png', '.jpg', '.jpeg', '.webp', '.svg', '.woff2', '.ico'})
              return False
          with zipfile.ZipFile('paquete.zip') as z:
              entries = z.infolist()
              check(0 < len(entries) <= 2000, 'Cantidad de entradas fuera de limite')
              check(sum(e.file_size for e in entries) <= 100 * 1024 * 1024, 'ZIP expandido demasiado grande')
              files = {}
              seen = set()
              for e in entries:
                  name = e.filename.rstrip('/')
                  check(name and all(re.fullmatch(r'[A-Za-z0-9_-][A-Za-z0-9_.-]*', p) for p in name.split('/')), 'Ruta insegura')
                  check(name.lower() not in seen, 'Ruta duplicada o colision de mayusculas')
                  seen.add(name.lower())
                  mode = stat.S_IFMT(e.external_attr >> 16)
                  check(mode in {0, stat.S_IFREG, stat.S_IFDIR}, 'Enlace o archivo especial no permitido')
                  check(not (e.flag_bits & 1), 'Archivo cifrado no permitido')
                  if e.is_dir():
                      check(name.split('/')[0] in {'candidato', 'referencia'} and len(name.split('/')) <= 20, 'Directorio no permitido')
                      continue
                  check(mode != stat.S_IFDIR and allowed(name), 'Archivo fuera del alcance permitido: ' + name)
                  files[name] = z.read(e)
          check({'ESTADO.txt','SHA256SUMS'} <= files.keys(), 'Metadatos de paquete incompletos')
          estado = files['ESTADO.txt'].decode('utf-8')
          check(estado.splitlines() and estado.splitlines()[0].startswith(os.environ['VERSION'] + ':'), 'Version del paquete no coincide')
          manifest = {}
          for line in files['SHA256SUMS'].decode('ascii').splitlines():
              match = re.fullmatch(r'([0-9a-f]{64}) [ *](\S+)', line)
              check(match is not None, 'Linea de manifiesto invalida')
              digest, name = match.groups()
              check(name not in manifest and name not in {'ESTADO.txt', 'SHA256SUMS'}, 'Entrada de manifiesto duplicada o invalida')
              manifest[name] = digest
          payload = set(files) - {'ESTADO.txt', 'SHA256SUMS'}
          check(set(manifest) == payload, 'El manifiesto no cubre exactamente todos los archivos')
          for name, digest in manifest.items():
              check(hashlib.sha256(files[name]).hexdigest() == digest, 'Hash incorrecto: ' + name)
          candidate = {p for p in payload if p.startswith('candidato/')}
          reference = {p for p in payload if p.startswith('referencia/')}
          check(candidate and reference, 'Faltan candidatos o referencias')
          check(all('candidato/' + p.removeprefix('referencia/') in candidate for p in reference), 'Referencia sin candidato')
          backend = sum(p.startswith('candidato/backend/') for p in candidate)
          frontend = sum(p.startswith('candidato/frontend/') for p in candidate)
          if os.environ['VERSION'] == 'V109D6C':
              check((backend, frontend) == (24, 5), 'V109D6C requiere 24 archivos backend y 5 frontend')
          out = Path('paquete')
          out.mkdir(exist_ok=False)
          for name, content in files.items():
              target = out / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
          print(f'INTEGRIDAD CORRECTA: backend={backend}, frontend={frontend}, referencias={len(reference)}')
          PY
      - name: Comprobar sintaxis sin ejecutar codigo candidato
        shell: bash
        run: |
          set -euo pipefail
          php --version | head -n 1
          node --version
          if [[ -d paquete/candidato/backend ]]; then
            find paquete/candidato/backend -type f -name '*.php' -print0 | xargs -0 -r -n 1 php -l
          fi
          if [[ -d paquete/candidato/frontend ]]; then
            find paquete/candidato/frontend -type f -name '*.js' -print0 | xargs -0 -r -n 1 node --check
          fi
      - name: Registrar resultado PUB03
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## PUB03 — Validacion del paquete'
            echo "- Version: $VERSION"
            echo "- Ejecucion de origen: $SOURCE_RUN"
            echo "- Artefacto: $ARTIFACT_ID"
            echo "- SHA256 ZIP: ${EXPECTED_SHA,,}"
            echo '- Resultado: origen, integridad, rutas, manifiesto y sintaxis conformes.'
            echo '- Alcance: solo validacion. Sin FTPS, respaldo remoto, DDL ni publicacion.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Obtener clave publica de respaldo fijada
        uses: actions/checkout@v4
        with:
          ref: a072375019a07f03e65bddac3c32b101da0707cf
          path: fuente-clave
          sparse-checkout: deployment/keys/respaldo-sql-20261121-public.pem
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Recuperar respaldo historico V108A
        if: inputs.version == 'V109D6C' && inputs.artifact_id == '15166647801'
        uses: actions/download-artifact@v4
        with:
          name: rutahd-v108a-respaldo-previo
          run-id: 45840030652
          github-token: ${{ github.token }}
          path: historico-v108a
      - name: Recuperar respaldo historico V108D
        if: inputs.version == 'V109D6C' && inputs.artifact_id == '15166647801'
        uses: actions/download-artifact@v4
        with:
          name: rutahd-v108d-respaldo-previo
          run-id: 45885877592
          github-token: ${{ github.token }}
          path: historico-v108d
      - name: Preflight FTPS de solo lectura y respaldo cifrado
        env:
          FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          umask 077
          python3 - <<'PY'
          import ftplib, ssl, os, io, hashlib, json, zipfile, posixpath, base64, secrets
          from pathlib import Path
          from cryptography.hazmat.primitives import hashes, serialization
          from cryptography.hazmat.primitives.asymmetric import rsa, padding
          from cryptography.hazmat.primitives.ciphers.aead import AESGCM

          def sha(data):
              return hashlib.sha256(data).hexdigest()

          def need(ok, message):
              if not ok:
                  raise SystemExit(message)

          class ReadOnlyFTP:
              def __init__(self, ftp):
                  self.ftp = ftp
                  self.listings = {}
              def names(self, directory):
                  if directory not in self.listings:
                      self.ftp.cwd(directory)
                      # Do not treat an error, timeout or ambiguous listing as absence.
                      raw = self.ftp.nlst()
                      names = set()
                      for entry in raw:
                          value = entry.rstrip('/')
                          if value in {'.', '..', directory + '/.', directory + '/..'}:
                              continue
                          if '/' in value:
                              need(posixpath.dirname(value) == directory, 'Listado FTPS ambiguo')
                          name = posixpath.basename(value)
                          need(name not in names and name != '', 'Listado FTPS duplicado o ambiguo')
                          names.add(name)
                      self.listings[directory] = names
                  return self.listings[directory]
              def read(self, path, allow_absent=False):
                  parent, name = posixpath.split(path)
                  # A missing parent is an error, not proof of an absent file.
                  names = self.names(parent)
                  need(name in names or not any(x.casefold() == name.casefold() for x in names), 'Colision de mayusculas en produccion')
                  listed = name in names
                  buffer = io.BytesIO()
                  def collect(chunk):
                      need(buffer.tell() + len(chunk) <= 50 * 1024 * 1024, 'Archivo remoto fuera de limite')
                      buffer.write(chunk)
                  try:
                      self.ftp.retrbinary('RETR ' + path, collect)
                  except ftplib.error_perm as exc:
                      if allow_absent and not listed and buffer.tell() == 0 and str(exc).startswith('550'):
                          return None
                      raise SystemExit('No se pudo leer archivo remoto esperado: ' + path) from None
                  need(listed, 'Archivo remoto no listado: ' + path)
                  return buffer.getvalue()

          def preflight(reader, package):
              items, blobs, blockers = [], {}, []
              total = 0
              for candidate in sorted((package / 'candidato').rglob('*')):
                  if not candidate.is_file():
                      continue
                  key = candidate.relative_to(package / 'candidato').as_posix()
                  area, relative = key.split('/', 1)
                  need(area in {'backend', 'frontend'}, 'Area de archivo inesperada')
                  remote = ('/htdocs/api-v2/' if area == 'backend' else '/htdocs/') + relative
                  ref = package / 'referencia' / key
                  expected = sha(ref.read_bytes()) if ref.is_file() else None
                  live = reader.read(remote, allow_absent=expected is None)
                  digest = sha(live) if live is not None else None
                  match = digest == expected
                  item = dict(path=key, remote=remote, exists=live is not None, sha256=digest,
                              reference_sha256=expected, candidate_sha256=sha(candidate.read_bytes()), match=match)
                  items.append(item)
                  if live is not None:
                      blobs['archivos/' + key] = live
                      total += len(live)
                  if not match:
                      blockers.append(key)
                  print(('COINCIDE' if match else 'DIVERGE') + ' ' + key + (' [ausente]' if live is None else ''))
                  need(total <= 100 * 1024 * 1024, 'Respaldo demasiado grande')
              for label, path, marker in [('backend-guard', '/htdocs/api-v2/.htaccess', b'Require all denied'),
                                           ('gateway', '/htdocs/api/index.php', b'rutahd2_api_ready')]:
                  data = reader.read(path)
                  need(data is not None, 'Proteccion remota ausente')
                  blobs['protecciones/' + label] = data
                  if marker not in data:
                      blockers.append(label)
                  items.append(dict(path=label, remote=path, exists=True, sha256=sha(data), protected=True, marker_present=marker in data))
                  total += len(data)
                  need(total <= 100 * 1024 * 1024, 'Respaldo demasiado grande')
              need(items, 'No hay archivos para respaldar')
              return items, blobs, blockers

          def diagnose_v108(blobs, package, historical_a, historical_d):
              import subprocess, tempfile, difflib
              def historical_file(root, name):
                  matches = [p for p in root.rglob(name) if p.is_file() and not p.is_symlink()]
                  if len(matches) != 1:
                      return None
                  return matches[0].read_bytes()
              route_a = historical_file(historical_a, 'routes.guard')
              route_d = historical_file(historical_d, 'routes.guard')
              old_index = historical_file(historical_d, 'index.html')
              expected_index = None
              if old_index is not None:
                  old_js = b'src="assets/js/contexto-sucursal-v107.js?v=20261126-v108cr2"'
                  new_js = b'src="assets/js/contexto-sucursal-v107.js?v=20261126-v108d"'
                  old_css = b'assets/css/selector-sucursal-v108c.css?v=20261126-v108cr2'
                  new_css = b'assets/css/selector-sucursal-v108c.css?v=20261126-v108d'
                  if old_index.count(old_js) == 1 and old_index.count(old_css) == 1:
                      expected_index = old_index.replace(old_js, new_js, 1).replace(old_css, new_css, 1)
              results = []
              for name, expected in [('backend/routes/api.php', route_d), ('frontend/index.html', expected_index)]:
                  live = blobs.get('archivos/' + name)
                  base = (package / 'referencia' / name).read_bytes()
                  candidate = (package / 'candidato' / name).read_bytes()
                  result = dict(path=name, live_sha256=sha(live) if live is not None else None,
                                reference_sha256=sha(base), candidate_sha256=sha(candidate),
                                historical_sha256=sha(expected) if expected is not None else None,
                                matches_historical=live is not None and expected is not None and live == expected)
                  if name == 'backend/routes/api.php':
                      result['historical_routes_agree'] = route_a is not None and route_d is not None and route_a == route_d
                      result['v108a_routes_sha256'] = sha(route_a) if route_a is not None else None
                  if live is not None:
                      try:
                          live_lines, base_lines = live.decode('utf-8').splitlines(), base.decode('utf-8').splitlines()
                          diff = difflib.SequenceMatcher(None, base_lines, live_lines, autojunk=False)
                          result['live_vs_reference_added_lines'] = sum(j2-j1 for op,i1,i2,j1,j2 in diff.get_opcodes() if op in ('insert','replace'))
                          result['live_vs_reference_removed_lines'] = sum(i2-i1 for op,i1,i2,j1,j2 in diff.get_opcodes() if op in ('delete','replace'))
                          with tempfile.TemporaryDirectory() as temp:
                              paths = [Path(temp)/n for n in ('live','base','candidate')]
                              for p, data in zip(paths,(live,base,candidate)):
                                  p.write_bytes(data)
                              merge = subprocess.run(['git','merge-file','-p', *map(str,paths)], capture_output=True, timeout=30)
                              result['merge_preview'] = 'clean' if merge.returncode == 0 else ('conflicts' if 1 <= merge.returncode <= 127 else 'error')
                              if merge.returncode == 0:
                                  result['merge_preview_sha256'] = sha(merge.stdout)
                      except (UnicodeError, OSError, subprocess.TimeoutExpired):
                          result['merge_preview'] = 'error'
                  print('DIAGNOSTICO ' + json.dumps(result, sort_keys=True))
                  results.append(result)
              return results

          def encrypt_backup(items, blobs, blockers, public_key, metadata):
              report = dict(**metadata, entries=items, blockers=blockers)
              buffer = io.BytesIO()
              with zipfile.ZipFile(buffer, 'w', compression=zipfile.ZIP_DEFLATED) as z:
                  z.writestr('INVENTARIO.json', json.dumps(report, ensure_ascii=False, indent=2))
                  for path, data in sorted(blobs.items()):
                      z.writestr(path, data)
              plain = buffer.getvalue()
              with zipfile.ZipFile(io.BytesIO(plain)) as z:
                  need(z.testzip() is None, 'Respaldo ZIP corrupto')
                  for name, data in blobs.items():
                      need(sha(z.read(name)) == sha(data), 'Respaldo interno no coincide')
              need(isinstance(public_key, rsa.RSAPublicKey) and public_key.key_size >= 2048, 'Clave publica RSA invalida')
              key, nonce = secrets.token_bytes(32), secrets.token_bytes(12)
              ciphertext = AESGCM(key).encrypt(nonce, plain, None)
              need(AESGCM(key).decrypt(nonce, ciphertext, None) == plain, 'Autoverificacion cifrada fallida')
              wrapped = public_key.encrypt(key, padding.OAEP(mgf=padding.MGF1(hashes.SHA256()), algorithm=hashes.SHA256(), label=None))
              enc = lambda value: base64.b64encode(value).decode('ascii')
              result = dict(format='rutahd-backup-pub04-v1', algorithm='RSA-OAEP-SHA256+AES-256-GCM',
                            encrypted_key_b64=enc(wrapped), nonce_b64=enc(nonce), ciphertext_b64=enc(ciphertext),
                            zip_sha256=sha(plain), public_key_sha256=sha(public_key.public_bytes(serialization.Encoding.DER, serialization.PublicFormat.SubjectPublicKeyInfo)))
              return result

          if __name__ == '__main__':
              password = os.environ.get('FTP_PASSWORD', '')
              need(bool(password), 'Secreto FTPS no configurado')
              pub = serialization.load_pem_public_key(Path('fuente-clave/deployment/keys/respaldo-sql-20261121-public.pem').read_bytes())
              need(isinstance(pub, rsa.RSAPublicKey) and pub.key_size >= 2048, 'Clave de respaldo invalida')
              try:
                  with ftplib.FTP_TLS(context=ssl.create_default_context(), timeout=45) as ftp:
                      ftp.connect('ftpupload.net', 21)
                      ftp.login('if0_43460400', password)
                      ftp.prot_p()
                      ftp.set_pasv(True)
                      items, blobs, blockers = preflight(ReadOnlyFTP(ftp), Path('paquete'))
              except (OSError, ftplib.Error) as exc:
                  raise SystemExit('Error FTPS; no se obtuvo preflight completo: ' + type(exc).__name__) from None
              metadata = dict(version=os.environ['VERSION'], source_run=os.environ['SOURCE_RUN'], artifact_id=os.environ['ARTIFACT_ID'],
                              source_zip_sha256=os.environ['EXPECTED_SHA'].lower(), preflight_run=os.environ['GITHUB_RUN_ID'], workflow_sha=os.environ['GITHUB_SHA'])
              diagnostics = []
              if os.environ['VERSION'] == 'V109D6C' and os.environ['ARTIFACT_ID'] == '15166647801':
                  diagnostics = diagnose_v108(blobs, Path('paquete'), Path('historico-v108a'), Path('historico-v108d'))
              metadata['diagnostics'] = diagnostics
              encrypted = encrypt_backup(items, blobs, blockers, pub, metadata)
              out = Path('respaldo-pub04')
              out.mkdir(exist_ok=False)
              (out / 'respaldo.cifrado.json').write_text(json.dumps(encrypted, separators=(',', ':')), encoding='utf-8')
              status = dict(**metadata, candidates=sum(not i.get('protected',False) for i in items),
                            existing=sum(i['exists'] for i in items if not i.get('protected',False)),
                            absent=sum(not i['exists'] for i in items), blockers=blockers,
                            encrypted_sha256=sha((out / 'respaldo.cifrado.json').read_bytes()))
              (out / 'resultado.json').write_text(json.dumps(status, indent=2), encoding='utf-8')
              print('Respaldo cifrado generado. Divergencias:', len(blockers))
          PY
      - name: Conservar respaldo cifrado y resultado de preflight
        uses: actions/upload-artifact@v4
        with:
          name: rutahd-pub04-${{ inputs.version }}-${{ github.run_id }}
          path: respaldo-pub04/
          retention-days: 30
          if-no-files-found: error
      - name: Evaluar preflight sin autorizar publicacion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r=json.loads(Path('respaldo-pub04/resultado.json').read_text())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\n## PUB04A — Preflight FTPS y diagnostico de referencias\n')
              for name in ('candidates','existing','absent','encrypted_sha256'):
                  f.write(f'- {name}: {r[name]}\n')
              f.write(f'- Divergencias: {len(r["blockers"])}\n')
              for item in r['blockers']:
                  f.write(f'  - {item}\n')
              for item in r.get('diagnostics', []):
                  f.write(f'- Diagnostico {item["path"]}: coincide historico={item["matches_historical"]}; merge preliminar={item.get("merge_preview", "no disponible")}\n')
              f.write('- Solo lectura FTPS. Sin DDL ni subida a InfinityFree.\n')
              f.write('- Pendientes: DDL/atribucion, dependencias, llave privada y prueba de restauracion.\n')
          if r['blockers']:
              raise SystemExit('Preflight detenido por divergencias. Respaldo cifrado conservado.')
          PY
