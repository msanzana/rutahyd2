name: Probar gateway HTTP InfinityFree y rutas Laravel
on:
  push:
    branches: [feature/catalogos-api-productos-v2-20261120]
    paths:
      - 'tests/puerta_api_infinityfree.php'
      - 'deployment/infinityfree/gateway-publico/index.php'
      - 'routes/api.php'
      - '.github/workflows/test-gateway-infinityfree.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gateway:
    runs-on: ubuntu-24.04
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, openssl, xml
          tools: composer:v2
      - name: Verificar código y restaurar vendor
        run: |
          php -l deployment/infinityfree/gateway-publico/index.php
          php -l routes/api.php
          php -l tests/puerta_api_infinityfree.php
          composer install --no-interaction --prefer-dist --no-progress
      - name: Exigir rutas correctas de gateway
        run: |
          php tests/puerta_api_infinityfree.php
          php artisan route:list --path=api --json > /tmp/rutas.json
          php -r '$r=json_decode(file_get_contents("/tmp/rutas.json"),true); $u=array_column($r,"uri"); foreach(["api/v1/estado","api/v1/sesion","api/v1/catalogos/{catalogo}","api/v1/recursos/{recurso}"] as $p) { if (!in_array($p,$u,true)) {fwrite(STDERR,"Missing route: ".$p."\n"); exit(1);} } echo "OK: 4 rutas Laravel esenciales\n";'
