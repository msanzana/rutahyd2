name: V107S - Selector de sucursal unica
on:
  push:
    branches: [feature/v107s-selector-unico-20261126]
    paths: [.github/workflows/v107s-publicar-selector.yml]
permissions: {contents: read}
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, iconv
      - name: Validar administracion aislada de sucursales
        env:
          APP_ENV: testing
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: log
        run: |
          set -euo pipefail
          php -l app/Http/Controllers/SucursalesControlador.php
          php -l app/Http/Controllers/ContextoSucursalControlador.php
          php -l routes/api.php
          composer install --no-interaction --prefer-dist --no-progress
          php tests/sucursales_v106.php | tee /tmp/v107s-test.log
          grep -Fx V106_ADMIN_OK /tmp/v107s-test.log
          php tests/contexto_sucursal_v107.php | tee /tmp/v107s-context.log
          grep -Fx V107_CONTEXT_OK /tmp/v107s-context.log
      - name: Preparar delta y respaldo de archivos productivos
        run: |
          set -euo pipefail
          mkdir -p /tmp/v107s/{before,after,browser,styles}
          git clone -q --depth=1 --branch feature/v107s-selector-unico-20261126 https://github.com/msanzana/rutahyd2front.git /tmp/v107s/front
          git -C /tmp/v107s/front fetch -q --depth=1 origin 3b5bb3a26caad8bc0791d3be1c893998f0465b91
          git -C /tmp/v107s/front fetch -q --depth=1 origin dfcd2e1f62e5623dcdf056e45f19e1127079e7af
          for n in contexto-sucursal-v107.js; do
            git -C /tmp/v107s/front show 3b5bb3a26caad8bc0791d3be1c893998f0465b91:assets/js/$n >/tmp/v107s/$n
            node --check /tmp/v107s/$n
          done
          cat >/tmp/v107s/transport.py <<'PY'
          import os,ssl,ftplib,io,pathlib,re,sys,subprocess
          from html.parser import HTMLParser
          p=pathlib.Path('/tmp/v107s')
          index='index.html'
          api='assets/js/catalogos-api.js'
          app='assets/js/login-produccion.js'
          js='assets/js/contexto-sucursal-v107.js'
          controller='app/Http/Controllers/ContextoSucursalControlador.php'
          admin='app/Http/Controllers/SucursalesControlador.php'
          routes='routes/api.php'
          changed=[js,controller]
          new=[]
          guards={'api-js.guard':'/htdocs/assets/js/catalogos-api.js','login-js.guard':'/htdocs/assets/js/login-produccion.js','routes.guard':'/htdocs/api-v2/routes/api.php','admin.guard':'/htdocs/api-v2/app/Http/Controllers/SucursalesControlador.php','ajustes-js.guard':'/htdocs/assets/js/inventario-v104.js','ajustes-back.guard':'/htdocs/api-v2/app/Http/Controllers/InventarioOperacionesControlador.php','sucursales-js.guard':'/htdocs/assets/js/sucursales-v106.js','app-js.guard':'/htdocs/assets/js/app-produccion.js','sesion.guard':'/htdocs/api-v2/app/Http/Controllers/SesionControlador.php','compras.guard':'/htdocs/assets/js/compras-consultas-v66.js','recepcion-css.guard':'/htdocs/assets/css/recepciones-compactas-v102.css','paleta-css.guard':'/htdocs/assets/css/paleta-secciones-v103.css','paleta-js.guard':'/htdocs/assets/js/paleta-secciones-v103.js','preload-js.guard':'/htdocs/assets/js/carga-global-v42.js','preload-css.guard':'/htdocs/assets/css/carga-global-v42.css','productos.guard':'/htdocs/assets/js/productos-remotos.js','stock-css.guard':'/htdocs/assets/css/stock-ficha-v98.css','recepcion.guard':'/htdocs/api-v2/app/Http/Controllers/RecepcionesBorradorControlador.php','stock.guard':'/htdocs/api-v2/app/Http/Controllers/ProductoComercialControlador.php','pdf.guard':'/htdocs/api-v2/app/Services/PdfRecepcionCompra.php','root.guard':'/htdocs/.htaccess','api.guard':'/htdocs/api/.htaccess','private.guard':'/htdocs/api-v2/.htaccess','gateway.guard':'/htdocs/api/index.php'}
          def remote(n):return guards.get(n,('/htdocs/api-v2/' if n in (controller,routes,admin) else '/htdocs/')+n)
          def get(f,n):
              b=io.BytesIO();f.retrbinary('RETR '+remote(n),b.write);return b.getvalue()
          def absent(f,n):
              try:get(f,n);return False
              except ftplib.error_perm as e:
                  if str(e).startswith('550'):return True
                  raise
          def put(f,n,b):f.storbinary('STOR '+remote(n),io.BytesIO(b))
          def save(area,n,b):
              d=p/area/n;d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(b)
          def read(area,n):return (p/area/n).read_bytes()
          def front(ref,n):return subprocess.check_output(['git','-C',str(p/'front'),'show',ref+':'+n])
          def verify_before(f):
              for n in new:assert absent(f,n),n
              for n in [index,*changed,*guards]:assert get(f,n)==read('before',n),n
          class Links(HTMLParser):
              def __init__(self):super().__init__();self.links=[];self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='link' and a.get('rel')=='stylesheet':self.links.append(a.get('href',''))
                  if tag=='script':self.scripts.append(a.get('src',''))
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(os.environ['FTP_HOST']);f.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);f.prot_p()
          with f:
              mode=sys.argv[1]
              if mode=='prepare':
                  for n in new:assert absent(f,n),'Unexpected new file '+n
                  for n in [index,*changed,*guards]:save('before',n,get(f,n))
                  assert read('before',js)==front('dfcd2e1f62e5623dcdf056e45f19e1127079e7af',js),'Selector productivo no coincide'
                  assert read('before',controller)==subprocess.check_output(['git','show','658296781ed7ba339746edcd890b1ff47577de78:'+controller]),'Controlador productivo no coincide'
                  assert read('before','api-js.guard')==front('dfcd2e1f62e5623dcdf056e45f19e1127079e7af',api)
                  assert read('before','login-js.guard')==front('dfcd2e1f62e5623dcdf056e45f19e1127079e7af',app)
                  assert b'ContextoSucursalControlador' in read('before','routes.guard')
                  save('after',js,(p/pathlib.Path(js).name).read_bytes())
                  save('after',controller,pathlib.Path(controller).read_bytes())
                  src=read('before',index).decode()
                  for required in ['inventario-v104.js?v=20261126-v105','catalogos-api.js?v=20261126-v107','login-produccion.js?v=20261126-v107','sucursales-v106.js?v=20261126-v106','app-produccion.js?v=20261126-v106','compras-consultas-v66.js?v=20261126-v102','recepciones-compactas-v102.css?v=20261126-v102','paleta-secciones-v103.css?v=20261126-v103','paleta-secciones-v103.js?v=20261126-v103','carga-global-v42.js?v=20261126-v99r','stock-ficha-v98.css?v=20261125-v98']:
                      assert required in src,required
                  old='src="'+js+'?v=20261126-v107"'
                  assert src.count(old)==1
                  src=src.replace(old,'src="'+js+'?v=20261126-v107s"',1)
                  parser=Links();parser.feed(src)
                  assert js+'?v=20261126-v107s' in parser.scripts
                  assert parser.scripts.index(js+'?v=20261126-v107s')<parser.scripts.index(app+'?v=20261126-v107')
                  save('after',index,src.encode())
                  for i,link in enumerate(parser.links):
                      n=link.split('?')[0].lstrip('/')
                      if re.fullmatch(r'assets/css/[A-Za-z0-9_.-]+\.css',n):save('styles',f'{i:03d}.css',get(f,n))
                  print('V107_PRECHECK_OK')
              elif mode=='publish':
                  verify_before(f);(p/'attempted').touch()
                  for n in [controller,js,index]:
                      with (p/'attempted').open('a') as log:log.write(n+'\n')
                      put(f,n,read('after',n))
                  for n in [index,*changed,*new]:assert get(f,n)==read('after',n),n
                  for n in guards:assert get(f,n)==read('before',n),n
                  print('V107_FTPS_BYTES_OK')
              elif mode=='rollback':
                  for n in reversed((p/'attempted').read_text().splitlines()):
                      if n in new:
                          if not absent(f,n):f.delete(remote(n))
                      else:put(f,n,read('before',n))
                  verify_before(f);print('V107_ROLLBACK_OK')
          PY
          python /tmp/v107s/transport.py prepare
      - name: Pruebas UI aisladas de contexto y acceso no bloqueado
        run: |
          set -euo pipefail
          cd /tmp/v107s/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import {readdirSync} from 'node:fs';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:1440,height:900},reducedMotion:'reduce'});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.route('https://ci.invalid/**',r=>r.fulfill({contentType:'text/html',body:'<meta name="viewport" content="width=device-width, initial-scale=1"><div><button id="menuProfile">Mi perfil</button></div><main id="workspaceContent"></main>'}));
            await page.goto('https://ci.invalid/');
            for(const f of readdirSync('/tmp/v107s/styles').sort())await page.addStyleTag({path:'/tmp/v107s/styles/'+f});
            await page.evaluate(()=>{
              window.signed=false;window.reads=0;window.writes=0;window.single=true;window.noAccess=false;
              window.RutaHDAccesos={authenticated:()=>window.signed};
              window.RutaHDMenuUsuario={close:()=>{}};
              window.RutaHDApiCatalogos={branchContext:async()=>{window.reads++;return {contexto_obligatorio:false,aislamiento_completo:false,seleccion_habilitada:window.single,modo_sucursal_unica:window.single,sucursales:window.noAccess?[]:[{id:1,codigo:'S01',nombre:'Casa CI',direccion:'Cunco CI'}],sucursal_actual:window.selected||null,version_contexto:window.writes};},selectBranchContext:async(id,v)=>{if(id!==1||v!==0)throw Error('Contexto inválido');window.writes++;window.selected={id:1,codigo:'S01',nombre:'Casa CI'};return {sucursal_actual:window.selected,version_contexto:1};}};
            });
            await page.addScriptTag({path:'/tmp/v107s/contexto-sucursal-v107.js'});
            await page.evaluate(()=>{window.complete=false;window.pending=RutaHDContextoSucursalV107.beforeLogin().then(x=>{window.complete=x;return x;});});
            const d=page.locator('dialog[open]');
            await d.getByText('S01 · Casa CI',{exact:true}).waitFor();
            if(await page.evaluate(()=>window.complete||window.writes))throw Error('Acceso anticipado');
            const enter=d.getByRole('button',{name:'Ingresar',exact:true});
            if(await enter.isEnabled())throw Error('Ingreso sin selección');
            await d.getByRole('radio').check();
            await enter.click();await d.waitFor({state:'detached'});
            if(!await page.evaluate(()=>window.pending)||await page.evaluate(()=>window.writes)!==1)throw Error('Confirmación no guardada');
            await page.evaluate(()=>{window.signed=true;document.dispatchEvent(new CustomEvent('rutahd:permisos-actualizados'));});
            await page.getByRole('menuitem',{name:'Sucursal actual'}).click();
            await d.getByText('S01 · Casa CI',{exact:true}).waitFor();
            if(await d.getByRole('radio').count())throw Error('Cambio operativo prematuro');
            await d.getByRole('button',{name:'Cerrar',exact:true}).last().click();
            await d.waitFor({state:'detached'});
            await page.setViewportSize({width:390,height:844});
            await page.evaluate(()=>{window.signed=false;window.noAccess=true;document.dispatchEvent(new CustomEvent('rutahd:sesion-finalizada'));window.pending=RutaHDContextoSucursalV107.beforeLogin();});
            await d.getByText('No tienes sucursales activas asignadas.',{exact:false}).waitFor();
            if(await d.getByRole('button',{name:'Ingresar',exact:true}).isEnabled())throw Error('Usuario sin acceso');
            await d.getByRole('button',{name:'Cerrar sesión',exact:true}).click();await d.waitFor({state:'detached'});
            if(await page.evaluate(()=>window.pending))throw Error('Cancelación permitió ingreso');
            await page.evaluate(()=>{window.single=false;window.noAccess=false;});
            if(!await page.evaluate(()=>RutaHDContextoSucursalV107.beforeLogin()))throw Error('Compatibilidad de modo previo');
            if(await page.evaluate(()=>window.writes)!==1||errors.length)throw Error(JSON.stringify(errors));
            console.log('V107S_UI_OK');
          }finally{await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: rutahd-v107s-respaldo-previo
          path: /tmp/v107s/before/
          retention-days: 30
          if-no-files-found: error
      - name: Publicar y verificar bytes
        run: python /tmp/v107s/transport.py publish
      - name: Verificar referencias publicas y proteccion JWT
        run: |
          set -euo pipefail
          cd /tmp/v107s/browser
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto('https://rutahyd2.free.nf/?v=20261126-v107s',{waitUntil:'load',timeout:60000});
            await page.waitForFunction(()=>window.RutaHDContextoSucursalV107&&window.RutaHDSucursalesV106&&window.RutaHDLogin&&window.RutaHDApiCatalogos?.branchContext,null,{timeout:45000});
            const result=await page.evaluate(async()=>({catalog:(await fetch('/api/v1/contexto-sucursal',{headers:{Accept:'application/json'}})).status,adjustment:(await fetch('/api/v1/inventario/ajustes-rapidos',{headers:{Accept:'application/json'}})).status,receipts:(await fetch('/api/v1/recepciones-borrador/1',{headers:{Accept:'application/json'}})).status,scripts:[...document.scripts].map(s=>s.src)}));
            if(response?.status()!==200||result.catalog!==401||result.adjustment!==401||result.receipts!==401||errors.length||!['catalogos-api.js','login-produccion.js'].every(n=>result.scripts.some(s=>s.includes(n+'?v=20261126-v107')))||!result.scripts.some(s=>s.includes('contexto-sucursal-v107.js?v=20261126-v107s')))throw Error(JSON.stringify({result,errors}));
            console.log('V107S_PUBLIC_OK');
          }finally{await browser.close();}
          JS
      - name: Restaurar originales si falla la publicacion
        if: failure()
        run: |
          if [ -f /tmp/v107s/attempted ]; then python /tmp/v107s/transport.py rollback; fi
