name: V108B - Preparar paquete integrado de Compras
on:
  push:
    branches: [feature/v108b1-consultas-sucursal-20261126]
    paths: [.github/workflows/v108b-paquete-integrado.yml]
permissions:
  contents: read
jobs:
  paquete:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Empaquetar candidatos fijados y referencias
        run: |
          set -euo pipefail
          base=de78f242f5b339897563f17b48ff2b92c2ea8c53
          candidate=5a91a44853c882fed2534146a14c877e5844132c
          frontbase=b91579217d339ce7916d5257c655a17de40b1873
          frontcandidate=fa998f143b803b14c160be52deb232dfba3fd979
          git clone -q --no-checkout https://github.com/msanzana/rutahyd2front.git /tmp/v108b-front
          for p in app/Http/Controllers/ComprasConsultasControlador.php app/Http/Controllers/RecepcionesBorradorControlador.php app/Http/Controllers/ConsolidacionesControlador.php app/Services/RegularizacionRecepcion.php; do
            mkdir -p "paquete/candidato/backend/$(dirname "$p")" "paquete/referencia/backend/$(dirname "$p")"
            git show "$candidate:$p" > "paquete/candidato/backend/$p"
            git show "$base:$p" > "paquete/referencia/backend/$p"
            cmp "paquete/candidato/backend/$p" "$p"
          done
          p=assets/js/compras-consultas-v66.js
          mkdir -p "paquete/candidato/frontend/$(dirname "$p")" "paquete/referencia/frontend/$(dirname "$p")"
          git -C /tmp/v108b-front show "$frontcandidate:$p" > "paquete/candidato/frontend/$p"
          git -C /tmp/v108b-front show "$frontbase:$p" > "paquete/referencia/frontend/$p"
          (
            cd paquete
            find candidato referencia -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
          printf '%s\n' 'V108B: paquete integrado de revisión, NO publicado.' "Backend candidato: $candidate" "Frontend candidato: $frontcandidate" "Backend referencia: $base" "Frontend referencia: $frontbase" 'CI aprobadas: 45888428130, 45888640761, 45888966773, 45889416664, 45889824303.' 'No incluye index.html: verificar versión productiva y aplicar actualización de referencia de caché al publicar por mecanismo autorizado.' 'La referencia GitHub no es respaldo productivo.' 'Pendiente conciliación de atribución histórica, revisión de consumidores internos y prueba API/UI integrada. No habilitar segunda sucursal.' 'Sin cambios de rutas ni DDL.' > paquete/ESTADO.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rutahd-v108b-paquete-integrado
          path: paquete/
          retention-days: 30
          if-no-files-found: error
