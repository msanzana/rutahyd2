name: V108CR2 - Selector de sucursal autónomo
on:
  push:
    branches: [feature/v108c-selector-interfaz-20261126]
    paths: [.github/workflows/v108c-publicar-selector-interfaz.yml]
permissions: {contents: read}
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar delta y respaldo de archivos productivos
        run: |
          set -euo pipefail
          mkdir -p /tmp/v108c/{before,after,browser,styles,visual}
          git clone -q --depth=1 --branch feature/v108c-selector-interfaz-20261126 https://github.com/msanzana/rutahyd2front.git /tmp/v108c/front
          git -C /tmp/v108c/front fetch -q --depth=1 origin 1b272a332cb20201a50d6845803dbc38b80ddbfc
          git -C /tmp/v108c/front fetch -q --depth=1 origin 3b5bb3a26caad8bc0791d3be1c893998f0465b91
          for n in contexto-sucursal-v107.js; do
            git -C /tmp/v108c/front show 1b272a332cb20201a50d6845803dbc38b80ddbfc:assets/js/$n >/tmp/v108c/$n
            node --check /tmp/v108c/$n
          done
          git -C /tmp/v108c/front show 1b272a332cb20201a50d6845803dbc38b80ddbfc:assets/css/selector-sucursal-v108c.css >/tmp/v108c/selector-sucursal-v108c.css
          cat >/tmp/v108c/transport.py <<'PY'
          import os,ssl,ftplib,io,pathlib,re,sys,subprocess
          from html.parser import HTMLParser
          p=pathlib.Path('/tmp/v108c')
          index='index.html'
          api='assets/js/catalogos-api.js'
          app='assets/js/login-produccion.js'
          js='assets/js/contexto-sucursal-v107.js'
          controller='app/Http/Controllers/ContextoSucursalControlador.php'
          admin='app/Http/Controllers/SucursalesControlador.php'
          routes='routes/api.php'
          css='assets/css/selector-sucursal-v108c.css'
          changed=[js]
          new=[css]
          guards={'context.guard':'/htdocs/api-v2/app/Http/Controllers/ContextoSucursalControlador.php','oc.guard':'/htdocs/api-v2/app/Http/Controllers/OrdenesCompraControlador.php','oc-context.guard':'/htdocs/api-v2/app/Services/ContextoCompras.php','api-js.guard':'/htdocs/assets/js/catalogos-api.js','login-js.guard':'/htdocs/assets/js/login-produccion.js','routes.guard':'/htdocs/api-v2/routes/api.php','admin.guard':'/htdocs/api-v2/app/Http/Controllers/SucursalesControlador.php','ajustes-js.guard':'/htdocs/assets/js/inventario-v104.js','ajustes-back.guard':'/htdocs/api-v2/app/Http/Controllers/InventarioOperacionesControlador.php','sucursales-js.guard':'/htdocs/assets/js/sucursales-v106.js','app-js.guard':'/htdocs/assets/js/app-produccion.js','sesion.guard':'/htdocs/api-v2/app/Http/Controllers/SesionControlador.php','compras.guard':'/htdocs/assets/js/compras-consultas-v66.js','recepcion-css.guard':'/htdocs/assets/css/recepciones-compactas-v102.css','paleta-css.guard':'/htdocs/assets/css/paleta-secciones-v103.css','paleta-js.guard':'/htdocs/assets/js/paleta-secciones-v103.js','preload-js.guard':'/htdocs/assets/js/carga-global-v42.js','preload-css.guard':'/htdocs/assets/css/carga-global-v42.css','productos.guard':'/htdocs/assets/js/productos-remotos.js','stock-css.guard':'/htdocs/assets/css/stock-ficha-v98.css','recepcion.guard':'/htdocs/api-v2/app/Http/Controllers/RecepcionesBorradorControlador.php','stock.guard':'/htdocs/api-v2/app/Http/Controllers/ProductoComercialControlador.php','pdf.guard':'/htdocs/api-v2/app/Services/PdfRecepcionCompra.php','root.guard':'/htdocs/.htaccess','api.guard':'/htdocs/api/.htaccess','private.guard':'/htdocs/api-v2/.htaccess','gateway.guard':'/htdocs/api/index.php'}
          def remote(n):return guards.get(n,('/htdocs/api-v2/' if n in (controller,routes,admin) else '/htdocs/')+n)
          def get(f,n):
              b=io.BytesIO();f.retrbinary('RETR '+remote(n),b.write);return b.getvalue()
          def absent(f,n):
              try:get(f,n);return False
              except ftplib.error_perm as e:
                  if str(e).startswith('550'):return True
                  raise
          def put(f,n,b):f.storbinary('STOR '+remote(n),io.BytesIO(b))
          def save(area,n,b):
              d=p/area/n;d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(b)
          def read(area,n):return (p/area/n).read_bytes()
          def front(ref,n):return subprocess.check_output(['git','-C',str(p/'front'),'show',ref+':'+n])
          def verify_before(f):
              for n in new:assert absent(f,n),n
              for n in [index,*changed,*guards]:assert get(f,n)==read('before',n),n
          class Links(HTMLParser):
              def __init__(self):super().__init__();self.links=[];self.scripts=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='link' and a.get('rel')=='stylesheet':self.links.append(a.get('href',''))
                  if tag=='script':self.scripts.append(a.get('src',''))
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(os.environ['FTP_HOST']);f.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);f.prot_p()
          with f:
              mode=sys.argv[1]
              if mode=='prepare':
                  for n in new:assert absent(f,n),'Unexpected new file '+n
                  for n in [index,*changed,*guards]:save('before',n,get(f,n))
                  assert read('before',js)==front('3b5bb3a26caad8bc0791d3be1c893998f0465b91',js),'Selector productivo no coincide'
                  assert read('before','context.guard')==subprocess.check_output(['git','show','c5565faca9ae4196eedb7923e5a76ddd3e359503:app/Http/Controllers/ContextoSucursalControlador.php'])
                  assert read('before','oc.guard')==subprocess.check_output(['git','show','de78f242f5b339897563f17b48ff2b92c2ea8c53:app/Http/Controllers/OrdenesCompraControlador.php'])
                  assert read('before','oc-context.guard')==subprocess.check_output(['git','show','de78f242f5b339897563f17b48ff2b92c2ea8c53:app/Services/ContextoCompras.php'])
                  for n in [js,css]:save('after',n,(p/pathlib.Path(n).name).read_bytes())
                  src=read('before',index).decode()
                  for required in ['inventario-v104.js?v=20261126-v105','catalogos-api.js?v=20261126-v107','login-produccion.js?v=20261126-v107','sucursales-v106.js?v=20261126-v106','app-produccion.js?v=20261126-v106','compras-consultas-v66.js?v=20261126-v102','recepciones-compactas-v102.css?v=20261126-v102','paleta-secciones-v103.css?v=20261126-v103','paleta-secciones-v103.js?v=20261126-v103','carga-global-v42.js?v=20261126-v99r','stock-ficha-v98.css?v=20261125-v98']:
                      assert required in src,required
                  old='src="'+js+'?v=20261126-v107s"'
                  assert src.count(old)==1
                  src=src.replace(old,'src="'+js+'?v=20261126-v108cr2"',1)
                  assert css not in src and src.count('</head>')==1
                  src=src.replace('</head>','  <link rel="stylesheet" href="'+css+'?v=20261126-v108cr2">\n</head>',1)
                  parser=Links();parser.feed(src)
                  assert js+'?v=20261126-v108cr2' in parser.scripts and css+'?v=20261126-v108cr2' in parser.links
                  assert parser.scripts.index(js+'?v=20261126-v108cr2')<parser.scripts.index(app+'?v=20261126-v107')
                  save('after',index,src.encode())
                  for i,link in enumerate(parser.links):
                      n=link.split('?')[0].lstrip('/')
                      if n==css:save('styles',f'{i:03d}.css',read('after',css))
                      elif re.fullmatch(r'assets/css/[A-Za-z0-9_.-]+\.css',n):save('styles',f'{i:03d}.css',get(f,n))
                  print('V107_PRECHECK_OK')
              elif mode=='publish':
                  verify_before(f);(p/'attempted').touch()
                  for n in [css,js,index]:
                      with (p/'attempted').open('a') as log:log.write(n+'\n')
                      put(f,n,read('after',n))
                  for n in [index,*changed,*new]:assert get(f,n)==read('after',n),n
                  for n in guards:assert get(f,n)==read('before',n),n
                  print('V107_FTPS_BYTES_OK')
              elif mode=='rollback':
                  for n in reversed((p/'attempted').read_text().splitlines()):
                      if n in new:
                          if not absent(f,n):f.delete(remote(n))
                      else:put(f,n,read('before',n))
                  verify_before(f);print('V107_ROLLBACK_OK')
          PY
          python /tmp/v108c/transport.py prepare
      - name: Pruebas UI aisladas de contexto y acceso no bloqueado
        run: |
          set -euo pipefail
          cd /tmp/v108c/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import {readdirSync} from 'node:fs';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:1440,height:900},reducedMotion:'reduce'});
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            await page.route('https://ci.invalid/**',r=>r.fulfill({contentType:'text/html',body:'<meta name="viewport" content="width=device-width, initial-scale=1"><div><button id="menuProfile">Mi perfil</button></div><main id="workspaceContent"></main>'}));
            await page.goto('https://ci.invalid/');
            for(const f of readdirSync('/tmp/v108c/styles').sort())await page.addStyleTag({path:'/tmp/v108c/styles/'+f});
            await page.evaluate(()=>{
              document.body.innerHTML='<header class="topbar"><div class="topbar-left">Ruta H&D</div><div class="topbar-right"><div id="userMenuAnchor"><button id="menuProfile">Mi perfil</button></div></div></header><main id="workspaceContent"></main>';
              window.signed=false;window.writes=0;window.single=true;window.noAccess=false;
              window.RutaHDAccesos={authenticated:()=>window.signed};
              window.RutaHDMenuUsuario={close:()=>{}};
              window.RutaHDApiCatalogos={branchContext:async()=>({contexto_obligatorio:false,aislamiento_completo:false,seleccion_habilitada:window.single,modo_sucursal_unica:window.single,sucursales:window.noAccess?[]:[{id:1,codigo:'S01',nombre:'Casa CI',direccion:'Casa'}],sucursal_actual:window.selected||null,version_contexto:window.writes}),selectBranchContext:async(id,v)=>{if(id!==1||v!==0)throw Error('Contexto inválido');window.writes++;window.selected={id:1,codigo:'S01',nombre:'Casa CI'};return {sucursal_actual:window.selected,version_contexto:1};}};
            });
            await page.addScriptTag({path:'/tmp/v108c/contexto-sucursal-v107.js'});
            await page.evaluate(()=>{window.complete=false;window.pending=RutaHDContextoSucursalV107.beforeLogin().then(x=>{window.complete=x;return x;});});
            const d=page.locator('dialog[open]'),card=d.locator('.hd-branch-card'),enter=d.getByRole('button',{name:'Ingresar',exact:true});
            await card.getByText('Casa CI',{exact:true}).waitFor();
            if(await enter.isEnabled())throw Error('Ingreso sin selección');
            if(await d.evaluate(e=>e.classList.contains('hd-doc-modal')||e.classList.contains('hd-v70-dialog')))throw Error('Selector sigue heredando modal CRUD');
            await page.screenshot({path:'/tmp/v108c/visual/01-escritorio-sin-seleccion.png'});
            const before=await card.evaluate(e=>({bg:getComputedStyle(e).backgroundColor,border:getComputedStyle(e).borderColor}));
            await card.getByText('Dirección: Casa',{exact:true}).click();
            if(!await d.getByRole('radio').isChecked()||!await enter.isEnabled())throw Error('Tarjeta no seleccionable');
            const after=await card.evaluate(e=>({bg:getComputedStyle(e).backgroundColor,border:getComputedStyle(e).borderColor}));
            if(before.bg===after.bg||before.border===after.border)throw Error('Selección sin contraste');
            await page.screenshot({path:'/tmp/v108c/visual/02-escritorio-seleccionado.png'});
            const bounds=await d.boundingBox(),button=await enter.boundingBox();console.log('V108CR2_DESKTOP',JSON.stringify({bounds,button}));if(bounds.width>421||bounds.height>370||button.width>180||button.height>48)throw Error(JSON.stringify({bounds,button}));
            await enter.click();await d.waitFor({state:'detached'});
            if(!await page.evaluate(()=>window.pending)||await page.evaluate(()=>window.writes)!==1)throw Error('Confirmación no guardada');
            await page.evaluate(()=>{window.signed=true;document.dispatchEvent(new CustomEvent('rutahd:permisos-actualizados'));});
            await page.locator('#hdBranchCurrent strong').getByText('Casa CI',{exact:true}).waitFor();
            await page.getByRole('menuitem',{name:'Sucursal actual'}).click();
            await d.getByText('Casa CI',{exact:true}).waitFor();
            if(await d.getByRole('radio').count())throw Error('Cambio operativo prematuro');
            await d.getByRole('button',{name:'Cerrar',exact:true}).last().click();await d.waitFor({state:'detached'});
            await page.setViewportSize({width:390,height:844});
            await page.evaluate(()=>{document.documentElement.dataset.theme='oscuro';window.signed=false;document.dispatchEvent(new CustomEvent('rutahd:sesion-finalizada'));window.pending=RutaHDContextoSucursalV107.beforeLogin();});
            await card.waitFor();
            if(await page.locator('#hdBranchCurrent').isVisible())throw Error('Sucursal visible sin sesión');
            await page.screenshot({path:'/tmp/v108c/visual/03-movil-oscuro.png'});
            const mobile=await d.boundingBox(),mobileButton=await enter.boundingBox();console.log('V108CR2_MOBILE',JSON.stringify({mobile,mobileButton}));if(mobile.width>363||mobile.x<0||mobile.height>370||mobileButton.height<44||mobileButton.width>180)throw Error(JSON.stringify({mobile,mobileButton}));
            await d.getByRole('radio').focus();await page.keyboard.press('Space');
            if(!await d.getByRole('radio').isChecked())throw Error('Selección teclado');
            if(await enter.isDisabled())throw Error('Selección teclado no habilita ingreso');
            await page.screenshot({path:'/tmp/v108c/visual/04-movil-oscuro-seleccionado.png'});
            await d.getByRole('button',{name:'Cerrar sesión'}).click();await d.waitFor({state:'detached'});
            if(await page.evaluate(()=>window.pending)||await page.evaluate(()=>window.writes)!==1||errors.length)throw Error(JSON.stringify(errors));
            console.log('V108CR2_UI_OK');
          }finally{await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rutahd-v108cr2-capturas-ui-aislada
          path: /tmp/v108c/visual/
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: rutahd-v108cr2-respaldo-previo
          path: /tmp/v108c/before/
          retention-days: 30
          if-no-files-found: error
      - name: Publicar y verificar bytes
        run: python /tmp/v108c/transport.py publish
      - name: Verificar referencias publicas y proteccion JWT
        run: |
          set -euo pipefail
          cd /tmp/v108c/browser
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto('https://rutahyd2.free.nf/?v=20261126-v108cr2',{waitUntil:'load',timeout:60000});
            await page.waitForFunction(()=>window.RutaHDContextoSucursalV107&&window.RutaHDSucursalesV106&&window.RutaHDLogin&&window.RutaHDApiCatalogos?.branchContext,null,{timeout:45000});
            const result=await page.evaluate(async()=>({catalog:(await fetch('/api/v1/contexto-sucursal',{headers:{Accept:'application/json'}})).status,adjustment:(await fetch('/api/v1/inventario/ajustes-rapidos',{headers:{Accept:'application/json'}})).status,receipts:(await fetch('/api/v1/recepciones-borrador/1',{headers:{Accept:'application/json'}})).status,scripts:[...document.scripts].map(s=>s.src),styles:[...document.querySelectorAll('link[rel=stylesheet]')].map(s=>s.href)}));
            if(response?.status()!==200||result.catalog!==401||result.adjustment!==401||result.receipts!==401||errors.length||!['catalogos-api.js','login-produccion.js'].every(n=>result.scripts.some(s=>s.includes(n+'?v=20261126-v107')))||!result.scripts.some(s=>s.includes('contexto-sucursal-v107.js?v=20261126-v108cr2'))||!result.styles.some(s=>s.includes('selector-sucursal-v108c.css?v=20261126-v108cr2')))throw Error(JSON.stringify({result,errors}));
            console.log('V108CR2_PUBLIC_OK');
          }finally{await browser.close();}
          JS
      - name: Restaurar originales si falla la publicacion
        if: failure()
        run: |
          if [ -f /tmp/v108c/attempted ]; then python /tmp/v108c/transport.py rollback; fi
