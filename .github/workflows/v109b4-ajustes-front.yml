name: V109B4 - Validar interfaz de ajustes generales
on:
  push:
    branches: [feature/v109a-inventario-contexto-20261126]
    paths:
      - .github/workflows/v109b4-ajustes-front.yml
      - tests/ajustes_generales_front_v109b4.mjs
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar candidato frontend fijado
        run: |
          set -euo pipefail
          git clone -q --depth=1 --branch feature/v109b4-ajustes-generales-20261126 https://github.com/msanzana/rutahyd2front.git /tmp/v109b4-front
          test "$(git -C /tmp/v109b4-front rev-parse HEAD)" = 178cc684a7ac9f9c7004fe394bbdcf419cddae98
          for f in catalogos-api inventario-v104 app-produccion; do node --check "/tmp/v109b4-front/assets/js/$f.js"; done
          npm install --prefix /tmp/v109b4-js --no-audit --no-fund jsdom@26.1.0
          node tests/ajustes_generales_front_v109b4.mjs /tmp/v109b4-front | tee /tmp/v109b4.log
          grep -Fx V109B4_FRONT_OK /tmp/v109b4.log
