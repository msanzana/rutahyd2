name: V109C1 - Validar cantidades de traspaso
on:
  push:
    branches: [feature/v109a-inventario-contexto-20261126]
    paths:
      - .github/workflows/v109c1-plan-traspaso.yml
      - app/Services/PlanCantidadesTraspaso.php
      - tests/plan_cantidades_traspaso_v109c1.php
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      APP_ENV: testing
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      MAIL_MAILER: log
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, iconv
      - name: Validar núcleo sin escrituras
        run: |
          set -euo pipefail
          php -l app/Services/PlanCantidadesTraspaso.php
          composer install --no-interaction --prefer-dist --no-progress
          php tests/plan_cantidades_traspaso_v109c1.php | tee /tmp/v109c1.log
          grep -Fx V109C1_CANTIDADES_OK /tmp/v109c1.log
