name: V109C6B - Validar interfaz de traspasos
on:
  push:
    branches: [feature/v109a-inventario-contexto-20261126]
    paths:
      - .github/workflows/v109c6b-traspasos-front.yml
      - tests/traspasos_front_v109c6b.mjs
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar candidato frontend fijado
        run: |
          set -euo pipefail
          git clone -q --depth=1 --branch feature/v109b4-ajustes-generales-20261126 https://github.com/msanzana/rutahyd2front.git /tmp/v109c6b-front
          test "$(git -C /tmp/v109c6b-front rev-parse HEAD)" = f9bd7415547f1c1d6bad73a69e12373736b8f773
          for f in catalogos-api inventario-v104 app-produccion; do node --check "/tmp/v109c6b-front/assets/js/$f.js"; done
          npm install --prefix /tmp/v109c6b-js --no-audit --no-fund jsdom@26.1.0
          node tests/traspasos_front_v109c6b.mjs /tmp/v109c6b-front | tee /tmp/v109c6b.log
          grep -Fx V109C6B_FRONT_OK /tmp/v109c6b.log
