name: V109C6C - Validar comprobantes internos
on:
  push:
    branches: [feature/v109a-inventario-contexto-20261126]
    paths:
      - .github/workflows/v109c6c-comprobantes.yml
      - app/Http/Controllers/TraspasosInventarioControlador.php
      - app/Http/Controllers/TraspasosConsultasControlador.php
      - routes/api.php
      - app/Services/ComprobanteTraspasoPdf.php
      - tests/traspasos_pdf_front_v109c6c.mjs
      - app/Services/PlanStockTraspaso.php
      - app/Services/LectorBaseValorizadaInventario.php
      - app/Services/BaseValorizadaInventario.php
      - routes/api.php
      - tests/traspasos_pdf_v109c6c.php
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      APP_ENV: testing
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, fileinfo, pdo_sqlite, iconv
      - name: Validar sintaxis y motor aislado
        run: |
          set -euo pipefail
          php -l app/Http/Controllers/TraspasosInventarioControlador.php
          php -l app/Http/Controllers/TraspasosConsultasControlador.php
          php -l app/Services/ComprobanteTraspasoPdf.php
          php -l routes/api.php
          php -l routes/api.php
          php -l tests/traspasos_pdf_v109c6c.php
          composer install --no-interaction --prefer-dist --no-progress
          php tests/traspasos_pdf_v109c6c.php | tee /tmp/v109c6c.log
          grep -Fx V109C6C_PDF_OK /tmp/v109c6c.log
          if ! command -v pdftotext >/dev/null; then sudo apt-get update -qq && sudo apt-get install -y poppler-utils; fi
          pdfinfo /tmp/v109c6c-comprobante.pdf
          pdftotext /tmp/v109c6c-comprobante.pdf /tmp/v109c6c-comprobante.txt
          grep -F 'SIN VALIDEZ TRIBUTARIA' /tmp/v109c6c-comprobante.txt
  validar-mariadb:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: temporal_ci_solamente
          MARIADB_DATABASE: rutahyd_v109c6c_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: testing
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: rutahyd_v109c6c_ci
      DB_USERNAME: root
      DB_PASSWORD: temporal_ci_solamente
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, fileinfo, pdo_mysql, iconv
      - name: Motor aislado MariaDB
        run: |
          set -euo pipefail
          php -l tests/traspasos_pdf_v109c6c.php
          composer install --no-interaction --prefer-dist --no-progress
          php tests/traspasos_pdf_v109c6c.php | tee /tmp/v109c6c-mariadb.log
          grep -Fx V109C6C_PDF_OK /tmp/v109c6c-mariadb.log
  validar-front:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar interfaz y cliente PDF
        run: |
          set -euo pipefail
          git init -q /tmp/v109c6c-front
          git -C /tmp/v109c6c-front fetch -q --depth=1 https://github.com/msanzana/rutahyd2front.git f6816596859d9d9d2f72ff98cd4c4371329fd461
          git -C /tmp/v109c6c-front checkout -q --detach FETCH_HEAD
          test "$(git -C /tmp/v109c6c-front rev-parse HEAD)" = f6816596859d9d9d2f72ff98cd4c4371329fd461
          for f in catalogos-api inventario-v104 app-produccion; do node --check "/tmp/v109c6c-front/assets/js/$f.js"; done
          npm install --prefix /tmp/v109c6c-js --no-audit --no-fund jsdom@26.1.0
          node tests/traspasos_pdf_front_v109c6c.mjs /tmp/v109c6c-front | tee /tmp/v109c6c-front.log
          grep -Fx V109C6C_FRONT_OK /tmp/v109c6c-front.log
