name: V109C7A - Validar integración de traspasos y compras
on:
  push:
    branches: [feature/v109a-inventario-contexto-20261126]
    paths:
      - .github/workflows/v109c7a-integracion.yml
      - app/Services/RegularizacionRecepcion.php
      - app/Services/BaseValorizadaInventario.php
      - app/Services/LectorBaseValorizadaInventario.php
      - app/Http/Controllers/RecepcionesBorradorControlador.php
      - app/Http/Controllers/ConsolidacionesControlador.php
      - app/Http/Controllers/TraspasosInventarioControlador.php
      - app/Http/Controllers/InventarioControlador.php
      - app/Services/PlanStockTraspaso.php
      - app/Services/PlanCantidadesTraspaso.php
      - tests/traspasos_compras_integracion_v109c7a.php
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: temporal_ci_solamente
          MARIADB_DATABASE: rutahd_v109c7a_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: testing
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: rutahd_v109c7a_ci
      DB_USERNAME: root
      DB_PASSWORD: temporal_ci_solamente
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_mysql, iconv
      - name: Regresión de consolidaciones, CPP y solicitudes en MariaDB aislada
        run: |
          set -euo pipefail
          php -l app/Services/RegularizacionRecepcion.php
          php -l app/Services/BaseValorizadaInventario.php
          php -l app/Services/LectorBaseValorizadaInventario.php
          php -l app/Http/Controllers/RecepcionesBorradorControlador.php
          php -l app/Http/Controllers/ConsolidacionesControlador.php
          php -l app/Http/Controllers/TraspasosInventarioControlador.php
          php -l app/Http/Controllers/InventarioControlador.php
          php -l tests/traspasos_compras_integracion_v109c7a.php
          composer install --no-interaction --prefer-dist --no-progress
          php tests/traspasos_compras_integracion_v109c7a.php | tee /tmp/v109c7a.log
          grep -Fx V109C7A_INTEGRACION_OK /tmp/v109c7a.log
