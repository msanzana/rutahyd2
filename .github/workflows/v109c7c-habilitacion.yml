name: V109C7C - Validar habilitación protegida de traspasos
on:
  push:
    branches: [feature/v109a-inventario-contexto-20261126]
    paths:
      - .github/workflows/v109c7c-habilitacion.yml
      - app/Http/Controllers/TraspasosInventarioControlador.php
      - app/Http/Controllers/TraspasosConsultasControlador.php
      - routes/api.php
      - app/Services/HabilitacionTraspasos.php
      - app/Http/Middleware/AutorizarTraspasoInterno.php
      - config/traspasos.php
      - app/Services/PlanStockTraspaso.php
      - app/Services/LectorBaseValorizadaInventario.php
      - app/Services/BaseValorizadaInventario.php
      - routes/api.php
      - tests/traspasos_habilitacion_v109c7c.php
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      APP_ENV: testing
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, fileinfo, pdo_sqlite, iconv
      - name: Validar sintaxis y motor aislado
        run: |
          set -euo pipefail
          php -l app/Http/Controllers/TraspasosInventarioControlador.php
          php -l app/Http/Controllers/TraspasosConsultasControlador.php
          php -l routes/api.php
          php -l routes/api.php
          php -l tests/traspasos_habilitacion_v109c7c.php
          composer install --no-interaction --prefer-dist --no-progress
          php tests/traspasos_habilitacion_v109c7c.php | tee /tmp/v109c7c.log
          grep -Fx V109C7C_GUARDAS_OK /tmp/v109c7c.log
          php artisan route:list --path=api/v1/inventario/traspasos --json > /tmp/v109c7c-rutas.json
          python - <<'PY'
          import json
          rows=json.load(open('/tmp/v109c7c-rutas.json'))
          expected={'':'gestionar','/{id}/aprobar':'aprobar','/{id}/anular':'anular','/{id}/confirmar':'confirmar','/{id}/despachar':'confirmar','/{id}/recepciones':'gestionar','/{id}/recepciones/{op}/aprobar':'aprobar','/{id}/recepciones/{op}/anular':'anular','/{id}/recepciones/{op}/confirmar':'confirmar'}
          writes=[r for r in rows if 'POST' in r['method'].split('|')]
          assert len(writes)==len(expected),writes
          for r in writes:
              suffix=r['uri'].removeprefix('api/v1/inventario/traspasos')
              perm=expected[suffix]
              assert any('AutorizarTraspasoInterno' in m for m in r['middleware']),r
              assert any('inventario.operaciones.'+perm in m for m in r['middleware']),r
              assert any('AutenticarToken' in m or 'token.rutahd' in m for m in r['middleware']),r
          print('V109C7C_RUTAS_OK')
          PY
  validar-mariadb:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: temporal_ci_solamente
          MARIADB_DATABASE: rutahyd_v109c7c_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      APP_ENV: testing
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_DATABASE: rutahyd_v109c7c_ci
      DB_USERNAME: root
      DB_PASSWORD: temporal_ci_solamente
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: log
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, fileinfo, pdo_mysql, iconv
      - name: Motor aislado MariaDB
        run: |
          set -euo pipefail
          php -l tests/traspasos_habilitacion_v109c7c.php
          composer install --no-interaction --prefer-dist --no-progress
          php tests/traspasos_habilitacion_v109c7c.php | tee /tmp/v109c7c-mariadb.log
          grep -Fx V109C7C_GUARDAS_OK /tmp/v109c7c-mariadb.log
