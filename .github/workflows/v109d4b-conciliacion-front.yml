name: V109D4B - Validar interfaz de conciliación
on:
  push:
    branches: [feature/v109a-inventario-contexto-20261126]
    paths:
      - .github/workflows/v109d4b-conciliacion-front.yml
      - tests/conteos_front_v109d4b.mjs
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar candidato frontend fijado
        run: |
          set -euo pipefail
          git clone -q --depth=1 --branch feature/v109b4-ajustes-generales-20261126 https://github.com/msanzana/rutahyd2front.git /tmp/v109d4b-front
          test "$(git -C /tmp/v109d4b-front rev-parse HEAD)" = 38ee12e884e2d5613f28497bd1b1dcf51b535e73
          for f in catalogos-api inventario-v104 app-produccion; do node --check "/tmp/v109d4b-front/assets/js/$f.js"; done
          npm install --prefix /tmp/v109d4b-js --no-audit --no-fund jsdom@26.1.0
          node tests/conteos_front_v109d4b.mjs /tmp/v109d4b-front | tee /tmp/v109d4b.log
          grep -Fx V109D4B_FRONT_OK /tmp/v109d4b.log
