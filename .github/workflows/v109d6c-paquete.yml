name: V109D6C - Paquete acumulado de revisión
on:
  push:
    branches: [feature/v109a-inventario-contexto-20261126]
    paths: [.github/workflows/v109d6c-paquete.yml]
permissions:
  contents: read
jobs:
  empaquetar:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Empaquetar candidatos y referencias sin acceder a producción
        run: |
          set -euo pipefail
          candidato=41105da2a03b436336e0f71ff1aed5b4529f40e1
          base=de78f242f5b339897563f17b48ff2b92c2ea8c53
          front=ee55aa4fec4d8f6a3fed7c17d2110a6c6925e9d4
          frontbase=b91579217d339ce7916d5257c655a17de40b1873
          git clone -q --no-checkout https://github.com/msanzana/rutahyd2front.git /tmp/rutahd-front
          git -C /tmp/rutahd-front fetch origin "$front" "$frontbase"
          mkdir -p paquete/candidato/backend paquete/candidato/frontend paquete/referencia/backend paquete/referencia/frontend
          for p in app/Http/Controllers/AjustesGeneralesControlador.php app/Http/Controllers/ComprasConsultasControlador.php app/Http/Controllers/ConsolidacionesControlador.php app/Http/Controllers/ConteosInventarioControlador.php app/Http/Controllers/InventarioControlador.php app/Http/Controllers/InventarioOperacionesControlador.php app/Http/Controllers/RecepcionesBorradorControlador.php app/Http/Controllers/TraspasosConsultasControlador.php app/Http/Controllers/TraspasosInventarioControlador.php app/Http/Middleware/AutorizarConteos.php app/Http/Middleware/AutorizarTraspasoInterno.php app/Services/ActaConteoPdf.php app/Services/BaseValorizadaInventario.php app/Services/ComprobanteTraspasoPdf.php app/Services/HabilitacionTraspasos.php app/Services/LectorBaseValorizadaInventario.php app/Services/PlanAjusteGeneral.php app/Services/PlanCantidadesTraspaso.php app/Services/PlanConteoInventario.php app/Services/PlanStockTraspaso.php app/Services/RegularizacionRecepcion.php config/conteos.php config/traspasos.php routes/api.php; do
            mkdir -p "paquete/candidato/backend/$(dirname "$p")" "paquete/referencia/backend/$(dirname "$p")"
            git show "$candidato:$p" > "paquete/candidato/backend/$p"
            php -l "paquete/candidato/backend/$p"
            if git cat-file -e "$base:$p" 2>/dev/null; then git show "$base:$p" > "paquete/referencia/backend/$p"; fi
          done
          for p in assets/js/app-produccion.js assets/js/catalogos-api.js assets/js/compras-consultas-v66.js assets/js/inventario-v104.js index.html; do
            mkdir -p "paquete/candidato/frontend/$(dirname "$p")" "paquete/referencia/frontend/$(dirname "$p")"
            git -C /tmp/rutahd-front show "$front:$p" > "paquete/candidato/frontend/$p"
            git -C /tmp/rutahd-front show "$frontbase:$p" > "paquete/referencia/frontend/$p"
            if [[ "$p" == *.js ]]; then node --check "paquete/candidato/frontend/$p"; fi
          done
          php -r '$c=require "paquete/candidato/backend/config/conteos.php"; if($c["escrituras"]!==false || $c["estado_confirmado"]!==null || $c["estado_anulado"]!==null || $c["alcance_selectivo_verificado"]!==false || $c["conteo_ciego_verificado"]!==false) exit(1);'
          php -r '$c=require "paquete/candidato/backend/config/traspasos.php"; if($c["escrituras"]!==false || $c["pares_recinto_verificados"]!==[]) exit(1);'
          test "$(find paquete/candidato/backend -type f | wc -l)" -eq 24
          test "$(find paquete/candidato/frontend -type f | wc -l)" -eq 5
          printf '%s\n' 'V109D6C: CANDIDATO DE REVISION; NO PUBLICAR DIRECTAMENTE' "Backend: $candidato" "Frontend: $front" "Referencia backend: $base" "Referencia frontend: $frontbase" 'Incluye delta desde V108A backend y V108D frontend: V108B, V109A-R1, V109B, V109C y V109D.' 'DDL49 ya aplicado: excluido deliberadamente.' 'Conteos y traspasos siguen bloqueados. Pendientes ENUM, aislamiento ciego, permisos HTTP y validación visual; traspasos requieren recintos verificados y contrato tributario.' 'Referencias GitHub no son respaldo real. Revisar rutas, index y diferencias productivas antes de cualquier instalación; respaldar y verificar reversión.' 'CI previa: D6A 45926851252; D6B 45926880124; D5 frontend 45912584607. No se repiten pruebas funcionales aprobadas en este workflow.' > paquete/ESTADO.txt
          (
            cd paquete
            find candidato referencia -type f -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
            sha256sum -c SHA256SUMS
          )
      - uses: actions/upload-artifact@v4
        with:
          name: rutahd-v109d6c-paquete-revision
          path: paquete/
          retention-days: 30
          if-no-files-found: error
