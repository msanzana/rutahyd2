name: V109E4C1 - Validar consumo de reservas
on:
  push:
    branches: [feature/v109a-inventario-contexto-20261126]
    paths:
      - .github/workflows/v109e4c1-reservas.yml
      - app/Services/PlanConsumoReserva.php
      - tests/plan_consumo_reserva_v109e4c1.php
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      APP_ENV: testing
      APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      MAIL_MAILER: log
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, iconv
      - name: Validar núcleo sin escrituras
        run: |
          set -euo pipefail
          php -l app/Services/PlanConsumoReserva.php
          composer install --no-interaction --prefer-dist --no-progress
          php tests/plan_consumo_reserva_v109e4c1.php | tee /tmp/v109e4c1.log
          grep -Fx V109E4C1_CONSUMO_OK /tmp/v109e4c1.log
