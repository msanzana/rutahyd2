name: V41 - diagnosticar busqueda SII con acentos (solo lectura)
on:
  push:
    branches: [hotfix/v41-giros-sii-busqueda-20261122]
    paths:
      - .github/workflows/v41-diagnostico-giros.yml
permissions:
  contents: read
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  auditar:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar herramientas FTPS y navegador
        run: |
          set -euo pipefail
          test -n "$FTP_PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          mkdir -p /tmp/rutahd-v38-audit/browser
          cd /tmp/rutahd-v38-audit/browser
          npm init -y >/dev/null
          npm install --no-audit --no-fund -q playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Crear sonda temporal protegida y de consulta exclusivamente SQL
        run: |
          set -euo pipefail
          set +x
          umask 077
          python3 - <<'PY'
          import pathlib, secrets, time, os
          name='hd_v41_giros_'+secrets.token_hex(16)+'.php'
          token=secrets.token_hex(32)
          expires=str(int(time.time()+900))
          php=r'''<?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');
          header('X-Content-Type-Options: nosniff');
          if(($_SERVER['REQUEST_METHOD']??'')!=='POST' ||
              time()>__EXPIRES__ ||
              !hash_equals('__TOKEN__',(string)($_SERVER['HTTP_X_HD_V38_AUDIT']??''))){
              http_response_code(404);exit;
          }
          try {
              $root=__DIR__.'/api-v2';
              require $root.'/vendor/autoload.php';
              \Dotenv\Dotenv::createImmutable($root)->safeLoad();
              if(($_ENV['DB_HOST']??'')!=='sql307.infinityfree.com' ||
                  ($_ENV['DB_DATABASE']??'')!=='if0_43460400_rutahyd2_es'){
                  throw new RuntimeException('destino_inesperado');
              }
              $pdo=new PDO('mysql:host='.$_ENV['DB_HOST'].
                  ';port=3306;dbname='.$_ENV['DB_DATABASE'].';charset=utf8mb4',
                  (string)($_ENV['DB_USERNAME']??''),(string)($_ENV['DB_PASSWORD']??''),
                  [PDO::ATTR_ERRMODE=>PDO::ERRMODE_EXCEPTION,
                      PDO::ATTR_TIMEOUT=>8,PDO::ATTR_EMULATE_PREPARES=>false]);
              $pdo->exec('SET SESSION TRANSACTION READ ONLY');
              $cases=[
                  'sin_buscar'=>['SELECT COUNT(*) FROM giros_sii WHERE activo=1',[]],
                  'buscar_acento_codigo_y_descripcion'=>[
                      'SELECT COUNT(*) FROM giros_sii WHERE activo=1 AND (codigo LIKE ? OR descripcion LIKE ?)',
                      ['%Fabricación de otros productos%','%Fabricación de otros productos%']],
                  'buscar_acento_solo_descripcion'=>[
                      'SELECT COUNT(*) FROM giros_sii WHERE activo=1 AND descripcion LIKE ?',
                      ['%Fabricación de otros productos%']],
                  'buscar_codigo_011101'=>[
                      'SELECT COUNT(*) FROM giros_sii WHERE activo=1 AND (codigo LIKE ? OR descripcion LIKE ?)',
                      ['%011101%','%011101%']],
                  'buscar_sin_acento'=>[
                      'SELECT COUNT(*) FROM giros_sii WHERE activo=1 AND (codigo LIKE ? OR descripcion LIKE ?)',
                      ['%Fabricacion%','%Fabricacion%']],
              ];
              $out=[];
              foreach($cases as $key=>$probe){
                  try{
                      $stmt=$pdo->prepare($probe[0]);
                      $stmt->execute($probe[1]);
                      $out[$key]=['ok'=>true,'total'=>(int)$stmt->fetchColumn()];
                  }catch(PDOException $e){
                      $info=$e->errorInfo;
                      $out[$key]=['ok'=>false,'sqlstate'=>(string)($info[0]??$e->getCode()),
                          'driver_code'=>(int)($info[1]??0)];
                  }
              }
              echo json_encode(['diagnostico'=>'SELECT_ONLY','casos'=>$out],
                  JSON_UNESCAPED_UNICODE);
          }catch(Throwable $e){
              http_response_code(503);
              echo json_encode(['diagnostico'=>'ERROR_DE_CONFIGURACION',
                  'clase'=>get_class($e)],JSON_UNESCAPED_UNICODE);
          }
          '''
          php=php.replace('__TOKEN__',token).replace('__EXPIRES__',expires)
          pathlib.Path('/tmp/rutahd-v38-audit/audit.php').write_text(php,encoding='utf-8')
          with open(os.environ['GITHUB_ENV'],'a') as f:
            f.write('AUDIT_NAME='+name+'\nAUDIT_KEY='+token+'\n')
          PY
          php -l /tmp/rutahd-v38-audit/audit.php
      - name: Subir sonda temporal que solo consulta giros por texto y código
        run: |
          set -euo pipefail
          set +x
          umask 077
          cat >/tmp/rutahd-v38-audit/upload.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 45
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          put /tmp/rutahd-v38-audit/audit.php -o "/htdocs/$AUDIT_NAME"
          bye
          EOF
          lftp -f /tmp/rutahd-v38-audit/upload.lftp >/dev/null
      - name: Probar COUNT con acentos y códigos en base exacta sin escritura
        working-directory: /tmp/rutahd-v38-audit/browser
        run: |
          set -euo pipefail
          set +x
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try {
            const page=await browser.newPage({locale:'es-CL'});
            await page.goto('https://rutahyd2.free.nf/',{
              waitUntil:'domcontentloaded',timeout:55000
            });
            await page.waitForTimeout(9000);
            const result=await page.evaluate(async({name,key})=>{
              const controller=new AbortController();
              const timer=setTimeout(()=>controller.abort(),25000);
              try{
                const r=await fetch('/'+name,{method:'POST',cache:'no-store',
                  credentials:'same-origin',headers:{
                    'X-HD-V38-Audit':key,Accept:'application/json'
                  },signal:controller.signal});
                const data=(r.headers.get('content-type')||'').includes('json')
                  ?await r.json():{};
                return {http:r.status,...data};
              }finally{clearTimeout(timer);}
            },{name:process.env.AUDIT_NAME,key:process.env.AUDIT_KEY});
            console.log('GIROS_V41_SELECT_ONLY',JSON.stringify(result));
            if(result.http!==200||result.diagnostico!=='SELECT_ONLY')
              throw Error('No se pudo diagnosticar SELECT del catálogo SII');
          }finally{await browser.close();}
          JS
          echo 'Consulta SII analizada con SELECT de sólo lectura. Sin cambios de datos.' >> "$GITHUB_STEP_SUMMARY"
      - name: Eliminar sonda temporal incluso ante fallo
        if: always()
        run: |
          set +x
          if [[ -n "$AUDIT_NAME" ]]; then
            cat >/tmp/rutahd-v38-audit/delete.lftp <<EOF
          set cmd:fail-exit yes
          set net:timeout 40
          set net:max-retries 2
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          rm "/htdocs/$AUDIT_NAME"
          bye
          EOF
            lftp -f /tmp/rutahd-v38-audit/delete.lftp >/dev/null || echo '::warning::Revisar sonda temporal de 15 minutos.'
          fi
          rm -f /tmp/rutahd-v38-audit/audit.php /tmp/rutahd-v38-audit/*.lftp
