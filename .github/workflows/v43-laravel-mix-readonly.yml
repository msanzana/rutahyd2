name: V43 - ejecutar método Laravel mix en lectura segura
on:
  push:
    branches: [diagnostico/v43-mix-500-20261122]
    paths: [.github/workflows/v43-laravel-mix-readonly.yml]
permissions:
  contents: read
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  diagnosticar:
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    steps:
      - name: Instalar FTPS y Chromium
        run: |
          set -euo pipefail
          test -n "$FTP_PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          mkdir -p /tmp/v43-laravel/browser
          cd /tmp/v43-laravel/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Construir sonda temporal para invocar Laravel sin middleware de usuario
        run: |
          set -euo pipefail
          set +x
          umask 077
          python3 - <<'PY'
          from pathlib import Path
          import os,secrets,time
          name='hd_v43_laravel_'+secrets.token_hex(16)+'.php'
          key=secrets.token_hex(32)
          expiry=str(int(time.time()+900))
          script=r'''<?php
          declare(strict_types=1);
          ini_set('display_errors','0');
          header('Content-Type: application/json; charset=utf-8');
          header('Cache-Control: no-store');
          header('X-Content-Type-Options: nosniff');
          if(($_SERVER['REQUEST_METHOD']??'')!=='POST'
              || time()>__EXP__
              || !hash_equals('__KEY__',(string)($_SERVER['HTTP_X_HD_LARAVEL_AUDIT']??''))){
              http_response_code(404);exit;
          }
          $out=['auditoria'=>'V43_LARAVEL_MIX_READ_ONLY'];
          try{
              $root=__DIR__.'/api-v2';
              require $root.'/vendor/autoload.php';
              $app=require $root.'/bootstrap/app.php';
              $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap();
              if(config('database.connections.mysql.database')!=='if0_43460400_rutahyd2_es'){
                  throw new RuntimeException('base_incorrecta');
              }
              $req=\Illuminate\Http\Request::create('/api/v1/proveedores/mix','GET',
                  ['page'=>1,'por_pagina'=>25]);
              $controller=$app->make(\App\Http\Controllers\ProductosProveedoresControlador::class);
              $response=$controller->mix($req);
              $json=json_decode((string)$response->getContent(),true,512,JSON_THROW_ON_ERROR);
              $out['ok']=$response->getStatusCode()===200 && isset($json['data']);
              $out['http']=$response->getStatusCode();
              $out['items']=count($json['data']??[]);
              $out['total_tipo']=gettype($json['total']??null);
              $out['paginas_tipo']=gettype($json['last_page']??null);
              if(!$out['ok'])http_response_code(412);
          }catch(Throwable $e){
              $out['ok']=false;
              $out['clase']=get_class($e);
              $out['fase']='invocacion_laravel';
              $info=$e instanceof \Illuminate\Database\QueryException
                  || $e instanceof PDOException ? $e->errorInfo:[];
              $out['sqlstate']=(string)($info[0]??$e->getCode());
              $out['codigo']=(int)($info[1]??0);
              $out['origen']=basename($e->getFile());
              $message=$e->getMessage();
              $out['columna_faltante']=preg_match(
                 "/Unknown column '([A-Za-z_][A-Za-z0-9_.]{0,100})'/",
                 $message,$m)?$m[1]:null;
              http_response_code(412);
          }
          echo json_encode($out,JSON_UNESCAPED_UNICODE|JSON_INVALID_UTF8_SUBSTITUTE);
          '''
          Path('/tmp/v43-laravel/probe.php').write_text(script.replace('__EXP__',expiry).replace('__KEY__',key))
          with open(os.environ['GITHUB_ENV'],'a') as f:
              f.write('AUDIT_NAME='+name+'\nAUDIT_KEY='+key+'\n')
          PY
          php -l /tmp/v43-laravel/probe.php
      - name: Enviar probe de solo lectura a PHP protegido
        run: |
          set -euo pipefail
          set +x
          umask 077
          cat >/tmp/v43-laravel/put.lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set net:timeout 45
          set net:max-retries 2
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          put /tmp/v43-laravel/probe.php -o /htdocs/$AUDIT_NAME
          bye
          EOF
          lftp -f /tmp/v43-laravel/put.lftp >/dev/null
      - name: Ejecutar respuesta del controlador y publicar solamente resultados no sensibles
        working-directory: /tmp/v43-laravel/browser
        run: |
          set -euo pipefail
          set +x
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({locale:'es-CL'});
            await page.goto('https://rutahyd2.free.nf/',{waitUntil:'domcontentloaded',timeout:55000});
            await page.waitForTimeout(4000);
            const result=await page.evaluate(async({name,key})=>{
              const ctrl=new AbortController();const timeout=setTimeout(()=>ctrl.abort(),25000);
              try{
                const r=await fetch('/'+name,{method:'POST',
                    headers:{'X-HD-Laravel-Audit':key,'Accept':'application/json'},
                    cache:'no-store',credentials:'same-origin',signal:ctrl.signal});
                return {audit_http:r.status,...await r.json()};
              }finally{clearTimeout(timeout);}
            },{name:process.env.AUDIT_NAME,key:process.env.AUDIT_KEY});
            console.log('V43_LARAVEL_CONTROLLER_AUDIT',JSON.stringify(result));
            if(result.auditoria!=='V43_LARAVEL_MIX_READ_ONLY'||
                ![200,412].includes(result.audit_http))
              throw new Error('Auditoría Laravel no respondió como se esperaba');
          }finally{await browser.close();}
          JS
          echo 'Sonda ejecutada directamente en controlador mix Laravel; no POST del CRUD, SQL de solo lectura.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retirar siempre la sonda y limpiar el runner
        if: always()
        run: |
          set +x
          if [[ -n "$AUDIT_NAME" ]];then
            cat >/tmp/v43-laravel/delete.lftp <<EOF
          set cmd:fail-exit yes
          set ftp:ssl-force yes
          set ftp:ssl-protect-data yes
          set ssl:verify-certificate yes
          set net:timeout 45
          set net:max-retries 3
          open -u "$FTP_USER","$FTP_PASSWORD" ftp://$FTP_HOST
          rm /htdocs/$AUDIT_NAME
          bye
          EOF
            lftp -f /tmp/v43-laravel/delete.lftp >/dev/null ||
              echo '::error::La sonda V43 (15 min) necesita limpieza manual FTPS'
          fi
          rm -rf /tmp/v43-laravel
