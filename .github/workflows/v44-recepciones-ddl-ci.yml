name: V44 - validar DDL preliminar de recepciones en MariaDB efímera
on:
  push:
    branches: [diseno/v44-recepciones-costo-promedio-20261122]
    paths:
      - .github/workflows/v44-recepciones-ddl-ci.yml
      - database/espanol/36_recepciones_mercaderia_borrador_ddl.sql
      - app/Services/CalculadoraCostoPromedioRecepcion.php
      - tests/calculadora_cpp_v44.php
permissions:
  contents: read
jobs:
  revisar-ddl:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: solo_ci_no_productivo
        ports: ['3306:3306']
        options: >-
          --health-cmd="mariadb-admin ping -h 127.0.0.1 -uroot -psolo_ci_no_productivo --silent"
          --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - name: Crear solo base efímera del runner
        run: |
          set -euo pipefail
          export MYSQL_PWD=solo_ci_no_productivo
          mysql -h 127.0.0.1 -uroot < database/espanol/01_esquema_completo_34_tablas_es.sql
          mysql -h 127.0.0.1 -uroot rutahyd2_es_local < database/espanol/20_proveedores_productos_codigos_barras_ddl.sql
          mysql -h 127.0.0.1 -uroot rutahyd2_es_local < database/espanol/36_recepciones_mercaderia_borrador_ddl.sql
          mysql -h 127.0.0.1 -uroot rutahyd2_es_local < database/espanol/36_recepciones_mercaderia_borrador_ddl.sql
      - name: Validar FK columnas e idempotencia sin consultar metadatos restringidos
        run: |
          set -euo pipefail
          export MYSQL_PWD=solo_ci_no_productivo
          mysql -h 127.0.0.1 -uroot -N rutahyd2_es_local -e "SHOW TABLES LIKE 'recepciones_mercaderia'" | grep -Fxq recepciones_mercaderia
          mysql -h 127.0.0.1 -uroot -N rutahyd2_es_local -e "SHOW TABLES LIKE 'recepciones_mercaderia_detalle'" | grep -Fxq recepciones_mercaderia_detalle
          mysql -h 127.0.0.1 -uroot -N rutahyd2_es_local -e 'SHOW COLUMNS FROM recepciones_mercaderia' > /tmp/v44_cabecera.columns
          mysql -h 127.0.0.1 -uroot -N rutahyd2_es_local -e 'SHOW COLUMNS FROM recepciones_mercaderia_detalle' > /tmp/v44_detalle.columns
          for col in id numero_interno proveedor_id bodega_id orden_compra_id estado token_idempotencia confirmado_en; do
            grep -Eq "^$col[[:space:]]" /tmp/v44_cabecera.columns
          done
          for col in id recepcion_id producto_proveedor_id presentacion_id cantidad_presentaciones unidades_por_envase_snapshot cantidad_unidades_base costo_neto_unitario_base movimiento_inventario_id; do
            grep -Eq "^$col[[:space:]]" /tmp/v44_detalle.columns
          done
          mysql -h 127.0.0.1 -uroot -N rutahyd2_es_local -e 'SHOW CREATE TABLE recepciones_mercaderia' > /tmp/v44_cabecera.create
          mysql -h 127.0.0.1 -uroot -N rutahyd2_es_local -e 'SHOW CREATE TABLE recepciones_mercaderia_detalle' > /tmp/v44_detalle.create
          grep -Fq 'fk_hd_rx_proveedor' /tmp/v44_cabecera.create
          grep -Fq 'fk_hd_rx_bodega' /tmp/v44_cabecera.create
          grep -Fq 'fk_hd_rx_det_vinculo' /tmp/v44_detalle.create
          grep -Fq 'fk_hd_rx_det_movimiento' /tmp/v44_detalle.create
          test "$(mysql -h 127.0.0.1 -uroot -N rutahyd2_es_local -e 'SELECT COUNT(*) FROM recepciones_mercaderia')" = 0
          test "$(mysql -h 127.0.0.1 -uroot -N rutahyd2_es_local -e 'SELECT COUNT(*) FROM recepciones_mercaderia_detalle')" = 0
          echo 'V44_DDL_OK: esquema de recepción validado dos veces en MariaDB efímera. No se tocó InfinityFree.' >> "$GITHUB_STEP_SUMMARY"
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: pdo_mysql, mbstring, xml, dom, curl, openssl, fileinfo
      - name: Probar CPP DECIMAL exacto sobre MariaDB temporal
        env:
          APP_NAME: RutaHD2_CI
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: rutahyd2_es_local
          DB_USERNAME: root
          DB_PASSWORD: solo_ci_no_productivo
          CACHE_STORE: array
          SESSION_DRIVER: array
        run: |
          set -euo pipefail
          php -l app/Services/CalculadoraCostoPromedioRecepcion.php
          php -l tests/calculadora_cpp_v44.php
          composer install --no-interaction --prefer-dist --no-progress
          php tests/calculadora_cpp_v44.php
          echo 'CPP exacto con DECIMAL, sin floats ni escrituras en producción.' >> "$GITHUB_STEP_SUMMARY"
      - name: Limpiar artefactos SQL temporales
        if: always()
        run: rm -f /tmp/v44_*.columns /tmp/v44_*.create
