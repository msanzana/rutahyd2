name: V49 - corregir código de compra editable por FTPS con respaldo
on:
  push:
    branches: [deploy/v49-codigo-compra-edicion-20261122]
    paths: [deployment/solicitudes/publicar-codigo-compra-v49.txt]
permissions:
  contents: read
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
      FRONT_BEFORE: 9fdec7343efd59b90eb11296360ee9477fd2d57c
      FRONT_AFTER: 4a39829ca26117078e6bce0a404bba55bdf0eed2
    steps:
      - uses: actions/checkout@v4
      - name: Preparar fuente V49 y FTPS
        run: |
          set -euo pipefail
          test -n "$FTP_PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          git clone -q --depth 1 --branch hotfix/v49-codigo-compra-edicion-20261122 https://github.com/msanzana/rutahyd2front.git /tmp/v49-source
          git -C /tmp/v49-source fetch -q --depth 1 origin "$FRONT_BEFORE" "$FRONT_AFTER"
          git -C /tmp/v49-source checkout -q --detach "$FRONT_AFTER"
          test "$(git -C /tmp/v49-source rev-parse HEAD)" = "$FRONT_AFTER"
          mkdir -p /tmp/v49/{before,after,verified}
      - name: Descargar los tres archivos actuales de InfinityFree sin modificar
        run: |
          set -euo pipefail
          set +x
          umask 077
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path('/tmp/v49')
          files=['assets/js/proveedores-productos.js',
                 'assets/css/interfaz-mix-validacion-v45.css','index.html']
          (p/'files.txt').write_text('\n'.join(files)+'\n')
          with (p/'read.lftp').open('w') as f:
            for line in ['set cmd:fail-exit yes','set ftp:ssl-force yes',
                'set ftp:ssl-protect-data yes','set ssl:verify-certificate yes',
                'set net:timeout 45','set net:max-retries 3']:print(line,file=f)
            print('open -u "'+os.environ['FTP_USER']+'","'+os.environ['FTP_PASSWORD']+'" ftp://'+os.environ['FTP_HOST'],file=f)
            for name in files:
              dest=p/'before'/name;dest.parent.mkdir(parents=True,exist_ok=True)
              print('get /htdocs/'+name+' -o '+str(dest),file=f)
            for remote,name in [
                ('/htdocs/api-v2/.htaccess','guard-private'),
                ('/htdocs/api/.htaccess','guard-api'),
                ('/htdocs/api/index.php','gateway')]:
              print('get '+remote+' -o '+str(p/'before'/name),file=f)
            print('bye',file=f)
          PY
          lftp -f /tmp/v49/read.lftp >/dev/null
          grep -Fq 'Require all denied' /tmp/v49/before/guard-private
          grep -Fq 'HTTP_AUTHORIZATION' /tmp/v49/before/guard-api
          grep -Fq 'rutahd2_api_ready' /tmp/v49/before/gateway
          grep -Fq 'proveedores-productos.js?v=20261122-v47prod' /tmp/v49/before/index.html
          grep -Fq 'interfaz-mix-validacion-v45.css?v=20261122-v47prod' /tmp/v49/before/index.html
      - name: Aplicar únicamente corrección V49 sobre archivos productivos
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib,subprocess,shutil
          p=pathlib.Path('/tmp/v49')
          scripts=['assets/js/proveedores-productos.js',
                   'assets/css/interfaz-mix-validacion-v45.css']
          for name in (p/'files.txt').read_text().splitlines():
            target=p/'after'/name;target.parent.mkdir(parents=True,exist_ok=True)
            shutil.copy2(p/'before'/name,target)
          patch=subprocess.run(['git','-C','/tmp/v49-source','diff','--no-ext-diff',
              '--binary','9fdec7343efd59b90eb11296360ee9477fd2d57c',
              '4a39829ca26117078e6bce0a404bba55bdf0eed2','--',*scripts],capture_output=True,check=True).stdout
          assert patch.count(b'diff --git')==2,'Diff V49 incluye archivos inesperados'
          output=subprocess.run(['patch','--batch','--fuzz=0','-p1','-d',str(p/'after')],
              input=patch,capture_output=True)
          if output.returncode:
              print(output.stdout.decode(errors='replace')[:1500])
              raise RuntimeError('No coincide el frontend remoto con la base V48; se aborta publicación')
          html=(p/'before/index.html').read_text()
          replacements={
              'proveedores-productos.js?v=20261122-v47prod':
              'proveedores-productos.js?v=20261122-v49prod',
              'interfaz-mix-validacion-v45.css?v=20261122-v47prod':
              'interfaz-mix-validacion-v45.css?v=20261122-v49prod'
          }
          for before,after in replacements.items():
              assert html.count(before)==1,before
              html=html.replace(before,after)
          (p/'after/index.html').write_text(html)
          assert 'carga-global-v42.js' in html
          assert 'giros-sii-v39.js' in html
          assert 'ubicacionesSubnav' in html
          assert 'usuarios.js?v=20261122-v48prod' in html
          js=(p/'after/assets/js/proveedores-productos.js').read_text()
          css=(p/'after/assets/css/interfaz-mix-validacion-v45.css').read_text()
          assert "code.readOnly=false;code.disabled=false;" in js
          assert "Usar Code 128 para este código" in js
          assert ".supplier-barcode-switch-type[hidden]" in css
          print('V49_PREFLIGHT_OK: solo selector JS, CSS y caché HTML; V48 completo conservado')
          PY
          node --check /tmp/v49/after/assets/js/proveedores-productos.js
      - name: Resguardar antes de publicar
        uses: actions/upload-artifact@v4
        with:
          name: rutahd-v49-respaldo-previo-codigo-compra
          path: /tmp/v49/before/
          retention-days: 30
          if-no-files-found: error
      - name: Publicar CSS primero JS después e index último
        run: |
          set -euo pipefail
          set +x
          umask 077
          touch /tmp/v49/upload-started
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path('/tmp/v49')
          files=['assets/css/interfaz-mix-validacion-v45.css',
            'assets/js/proveedores-productos.js','index.html']
          with (p/'put.lftp').open('w') as f:
            for line in ['set cmd:fail-exit yes','set ftp:ssl-force yes',
                'set ftp:ssl-protect-data yes','set ssl:verify-certificate yes',
                'set net:timeout 45','set net:max-retries 3']:print(line,file=f)
            print('open -u "'+os.environ['FTP_USER']+'","'+os.environ['FTP_PASSWORD']+'" ftp://'+os.environ['FTP_HOST'],file=f)
            for name in files:print('put '+str(p/'after'/name)+' -o /htdocs/'+name,file=f)
            print('bye',file=f)
          PY
          lftp -f /tmp/v49/put.lftp >/dev/null
      - name: Verificar los tres archivos y protecciones byte a byte
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path('/tmp/v49')
          with (p/'verify.lftp').open('w') as f:
            for line in ['set cmd:fail-exit yes','set ftp:ssl-force yes',
                'set ftp:ssl-protect-data yes','set ssl:verify-certificate yes',
                'set net:timeout 45','set net:max-retries 3']:print(line,file=f)
            print('open -u "'+os.environ['FTP_USER']+'","'+os.environ['FTP_PASSWORD']+'" ftp://'+os.environ['FTP_HOST'],file=f)
            for name in (p/'files.txt').read_text().splitlines():
              dest=p/'verified'/name;dest.parent.mkdir(parents=True,exist_ok=True)
              print('get /htdocs/'+name+' -o '+str(dest),file=f)
            for remote,name in [
                ('/htdocs/api-v2/.htaccess','guard-private'),
                ('/htdocs/api/.htaccess','guard-api'),
                ('/htdocs/api/index.php','gateway')]:
              print('get '+remote+' -o '+str(p/'verified'/name),file=f)
            print('bye',file=f)
          PY
          lftp -f /tmp/v49/verify.lftp >/dev/null
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('/tmp/v49')
          for name in (p/'files.txt').read_text().splitlines():
            assert (p/'after'/name).read_bytes()==(p/'verified'/name).read_bytes(),name
          for name in ['guard-private','guard-api','gateway']:
            assert (p/'before'/name).read_bytes()==(p/'verified'/name).read_bytes(),name
          print('V49_BYTES_OK: 3 archivos coinciden exactamente; backend/protecciones intactos')
          PY
      - name: Smoke público de scripts y caché sin credenciales
        run: |
          set -euo pipefail
          mkdir -p /tmp/v49/browser
          cd /tmp/v49/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({locale:'es-CL'});
            await page.goto('https://rutahyd2.free.nf/?v49=codigo-compra',{
              waitUntil:'domcontentloaded',timeout:55000});
            await page.waitForTimeout(3500);
            const evidence=await page.evaluate(()=>({
              logo:!!document.querySelector('.brand-logo'),
              menu:!!document.querySelector('#ubicacionesSubnav'),
              script:!!document.querySelector('script[src*="proveedores-productos.js?v=20261122-v49prod"]'),
              css:!!document.querySelector('link[href*="interfaz-mix-validacion-v45.css?v=20261122-v49prod"]'),
              finder:typeof window.RutaHDProveedoresProductos?.mount==='function'
            }));
            console.log('V49_SMOKE',JSON.stringify(evidence));
            if(!evidence.logo||!evidence.menu||!evidence.css||!evidence.script||!evidence.finder)
              console.log('::warning::InfinityFree respondió contenido intermedio; verificar UI con sesión. Integridad FTPS OK.');
          }finally{await browser.close();}
          JS
          echo 'V49: campo de compra editable tras validación EAN; se preserva el resto de V45 y la API.' >> "$GITHUB_STEP_SUMMARY"
      - name: Restaurar V45 si falla una etapa tras publicación
        if: failure()
        run: |
          set +x
          if [[ -f /tmp/v49/upload-started && -s /tmp/v49/before/index.html ]]; then
            python3 - <<'PY'
            import os,pathlib
            p=pathlib.Path('/tmp/v49')
            with (p/'rollback.lftp').open('w') as f:
              for line in ['set cmd:fail-exit yes','set ftp:ssl-force yes',
                'set ftp:ssl-protect-data yes','set ssl:verify-certificate yes',
                'set net:timeout 45','set net:max-retries 3']:print(line,file=f)
              print('open -u "'+os.environ['FTP_USER']+'","'+os.environ['FTP_PASSWORD']+'" ftp://'+os.environ['FTP_HOST'],file=f)
              for name in (p/'files.txt').read_text().splitlines():
                print('put '+str(p/'before'/name)+' -o /htdocs/'+name,file=f)
              print('bye',file=f)
            PY
            lftp -f /tmp/v49/rollback.lftp >/dev/null ||
              echo '::error::Rollback falló; recuperar rutahd-v49-respaldo-previo-codigo-compra'
          fi
      - name: Limpiar claves y scripts FTPS temporales
        if: always()
        run: rm -f /tmp/v49/*.lftp
