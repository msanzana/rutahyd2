name: V50 - Clientes FTP protegido
on:
  push:
    branches: [deploy/v50-clientes-20261122]
    paths: [deployment/solicitudes/publicar-clientes-v50.txt]
permissions:
  contents: read
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  clientes:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
      BACK_BASE: e7bd8881e9c8c8a6c01b0fab462642fa4cb289f4
      BACK_PIN: 7aec9f2befa1689b16f61853b5aa78de895e6c33
      FRONT_BASE: 4a39829ca26117078e6bce0a404bba55bdf0eed2
      FRONT_PIN: a3cfac116cc8227d318af851d8a4b3a62257313d
    steps:
      - uses: actions/checkout@v4
      - name: Preparar versiones aprobadas, Python y FTPS
        run: |
          set -euo pipefail
          test -n "$FTP_PASSWORD"
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp php-cli
          git fetch -q --depth=1 origin "$BACK_BASE" "$BACK_PIN"
          git clone -q --depth 1 --branch feature/v50-clientes-listado-20261122 https://github.com/msanzana/rutahyd2front.git /tmp/v50-front
          git -C /tmp/v50-front fetch -q --depth=1 origin "$FRONT_BASE" "$FRONT_PIN"
          git -C /tmp/v50-front checkout -q --detach "$FRONT_PIN"
          test "$(git -C /tmp/v50-front rev-parse HEAD)" = "$FRONT_PIN"
          mkdir -p /tmp/v50/{before,after,check}
      - name: Respaldar archivos publicados por FTPS sin escribir
        run: |
          set -euo pipefail
          set +x
          umask 077
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path('/tmp/v50')
          old=['app/Http/Controllers/EntidadesComercialesControlador.php',
            'app/Http/Controllers/RecursoControlador.php',
            'app/Models/Cliente.php','routes/api.php',
            'assets/js/app-produccion.js','assets/js/catalogos-api.js',
            'assets/js/modulos-oficiales.js','index.html']
          new=['assets/css/clientes-v50.css']
          guards={'guard-private':'/htdocs/api-v2/.htaccess',
                  'guard-api':'/htdocs/api/.htaccess',
                  'gateway':'/htdocs/api/index.php'}
          remotes={x:('/htdocs/api-v2/' if x.startswith(('app/','routes/')) else '/htdocs/')+x
                   for x in old+new}
          remotes.update(guards)
          (p/'originals').write_text('\n'.join(old)+'\n')
          (p/'upload').write_text('\n'.join(old[:-1]+new+['index.html'])+'\n')
          (p/'manifest').write_text('\n'.join(k+'\t'+v for k,v in remotes.items())+'\n')
          with (p/'read.lftp').open('w') as f:
            for command in ['set cmd:fail-exit yes','set ftp:ssl-force yes',
              'set ftp:ssl-protect-data yes','set ssl:verify-certificate yes',
              'set net:timeout 45','set net:max-retries 3']:print(command,file=f)
            print('open -u "'+os.environ['FTP_USER']+'","'+os.environ['FTP_PASSWORD']+
              '" ftp://'+os.environ['FTP_HOST'],file=f)
            for name in old+list(guards):
              dest=p/'before'/name;dest.parent.mkdir(parents=True,exist_ok=True)
              print('get '+remotes[name]+' -o '+str(dest),file=f)
            print('bye',file=f)
          PY
          lftp -f /tmp/v50/read.lftp >/dev/null
          grep -Fq 'Require all denied' /tmp/v50/before/guard-private
          grep -Fq 'HTTP_AUTHORIZATION' /tmp/v50/before/guard-api
          grep -Fq 'rutahd2_api_ready' /tmp/v50/before/gateway
          grep -Fq 'proveedores-productos.js?v=20261122-v49prod' /tmp/v50/before/index.html
          grep -Fq 'usuarios.js?v=20261122-v48prod' /tmp/v50/before/index.html
          grep -Fq 'catalogos-api.js?v=20261122-v42' /tmp/v50/before/index.html
          grep -Fq 'modulos-oficiales.js?v=20261122-copy39' /tmp/v50/before/index.html
          grep -Fq 'app-produccion.js?v=20261122-copy39' /tmp/v50/before/index.html
          ! grep -Fq 'clientes-v50.css' /tmp/v50/before/index.html
          echo 'V50_FTPS_READ_ONLY_OK: base V48/V49 y guards presentes'
      - name: Aplicar diferencias exactas y comprobar sintaxis
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,pathlib,subprocess,shutil
          p=pathlib.Path('/tmp/v50')
          backend=['app/Http/Controllers/EntidadesComercialesControlador.php',
            'app/Http/Controllers/RecursoControlador.php','app/Models/Cliente.php',
            'routes/api.php']
          frontend=['assets/js/app-produccion.js','assets/js/catalogos-api.js',
            'assets/js/modulos-oficiales.js']
          for name in (p/'originals').read_text().splitlines():
            dest=p/'after'/name;dest.parent.mkdir(parents=True,exist_ok=True)
            shutil.copy2(p/'before'/name,dest)
          for repo,base,pin,names in [
            (os.environ['GITHUB_WORKSPACE'],os.environ['BACK_BASE'],os.environ['BACK_PIN'],backend),
            ('/tmp/v50-front',os.environ['FRONT_BASE'],os.environ['FRONT_PIN'],frontend)]:
            patch=subprocess.run(['git','-C',repo,'diff','--no-ext-diff','--binary',
              base,pin,'--',*names],capture_output=True,check=True).stdout
            assert patch.count(b'diff --git')==len(names),'Inesperados archivos en diff'
            done=subprocess.run(['patch','--batch','--fuzz=0','-p1','-d',str(p/'after')],
              input=patch,capture_output=True)
            if done.returncode:
              print(done.stdout.decode(errors='replace')[:1300])
              raise RuntimeError('Base productiva distinta: cancelar sin escribir')
          (p/'after/assets/css').mkdir(parents=True,exist_ok=True)
          shutil.copy2('/tmp/v50-front/assets/css/clientes-v50.css',
            p/'after/assets/css/clientes-v50.css')
          html=(p/'after/index.html').read_text()
          source=pathlib.Path('/tmp/v50-front/index.html').read_text()
          begin=source.index('<div class="nav-group" id="clientsNavGroup">')
          end=source.index('<div class="nav-group" id="productsNavGroup">',begin)
          nav=source[begin:end].rstrip()
          old='<button type="button" data-nav="clientes" class="nav-link"><svg class="icon"><use href="#i-users"/></svg><span>Clientes</span></button>'
          assert html.count(old)==1 and 'clientsNavGroup' not in html
          html=html.replace(old,nav)
          versions={
            'assets/js/app-produccion.js?v=20261122-copy39':'assets/js/app-produccion.js?v=20261122-v50',
            'assets/js/catalogos-api.js?v=20261122-v42':'assets/js/catalogos-api.js?v=20261122-v50',
            'assets/js/modulos-oficiales.js?v=20261122-copy39':'assets/js/modulos-oficiales.js?v=20261122-v50'}
          for old,new in versions.items():
            assert html.count(old)==1,old
            html=html.replace(old,new)
          anchor='<link rel="stylesheet" href="assets/css/interfaz-mix-validacion-v45.css?v=20261122-v49prod">'
          assert html.count(anchor)==1 and 'clientes-v50.css' not in html
          html=html.replace(anchor,anchor+'\n  <link rel="stylesheet" href="assets/css/clientes-v50.css?v=20261122-v50">')
          for required in ['data-nav="clientes_listado"','toggleClientSubnav',
            'usuarios.js?v=20261122-v48prod','proveedores-productos.js?v=20261122-v49prod',
            'ubicacionesSubnav','carga-global-v42.js']:
            assert required in html,required
          (p/'after/index.html').write_text(html)
          assert 'customerCityPicker' in (p/'after/assets/js/modulos-oficiales.js').read_text()
          assert 'telefono.regex' in (p/'after/app/Http/Controllers/EntidadesComercialesControlador.php').read_text()
          assert '/clientes/tipos-juridicos' in (p/'after/routes/api.php').read_text()
          print('V50_PATCH_OK: 9 archivos previstos, patch sin fuzz')
          PY
          for file in /tmp/v50/after/assets/js/*.js;do node --check "$file";done
          for file in /tmp/v50/after/app/Http/Controllers/*.php /tmp/v50/after/app/Models/Cliente.php /tmp/v50/after/routes/api.php;do php -l "$file";done
      - name: Guardar respaldo inmutable previo a escritura
        uses: actions/upload-artifact@v4
        with:
          name: rutahd-v50-respaldo-previo-clientes
          path: /tmp/v50/before/
          retention-days: 30
          if-no-files-found: error
      - name: Publicar cuatro archivos PHP, CSS, JS y por último index
        run: |
          set -euo pipefail
          set +x
          umask 077
          touch /tmp/v50/upload-started
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path('/tmp/v50')
          manifest=dict(x.split('\t',1) for x in (p/'manifest').read_text().splitlines())
          with (p/'put.lftp').open('w') as f:
            for cmd in ['set cmd:fail-exit yes','set ftp:ssl-force yes',
              'set ftp:ssl-protect-data yes','set ssl:verify-certificate yes',
              'set net:timeout 45','set net:max-retries 3']:print(cmd,file=f)
            print('open -u "'+os.environ['FTP_USER']+'","'+os.environ['FTP_PASSWORD']+
              '" ftp://'+os.environ['FTP_HOST'],file=f)
            for name in (p/'upload').read_text().splitlines():
              print('put '+str(p/'after'/name)+' -o '+manifest[name],file=f)
            print('bye',file=f)
          PY
          lftp -f /tmp/v50/put.lftp >/dev/null
          echo 'V50_PUBLISHED: 9 archivos transferidos'
      - name: Verificar bytes remotos y protección de API
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path('/tmp/v50')
          manifest=dict(x.split('\t',1) for x in (p/'manifest').read_text().splitlines())
          items=(p/'upload').read_text().splitlines()+['guard-private','guard-api','gateway']
          with (p/'verify.lftp').open('w') as f:
            for cmd in ['set cmd:fail-exit yes','set ftp:ssl-force yes',
              'set ftp:ssl-protect-data yes','set ssl:verify-certificate yes',
              'set net:timeout 45','set net:max-retries 3']:print(cmd,file=f)
            print('open -u "'+os.environ['FTP_USER']+'","'+os.environ['FTP_PASSWORD']+
              '" ftp://'+os.environ['FTP_HOST'],file=f)
            for name in items:
              dest=p/'check'/name;dest.parent.mkdir(parents=True,exist_ok=True)
              print('get '+manifest[name]+' -o '+str(dest),file=f)
            print('bye',file=f)
          PY
          lftp -f /tmp/v50/verify.lftp >/dev/null
          python3 - <<'PY'
          import pathlib
          p=pathlib.Path('/tmp/v50')
          for name in (p/'upload').read_text().splitlines():
            assert (p/'after'/name).read_bytes()==(p/'check'/name).read_bytes(),name
          for name in ['guard-private','guard-api','gateway']:
            assert (p/'before'/name).read_bytes()==(p/'check'/name).read_bytes(),name
          print('V50_BYTES_OK: nueve archivos, guardas y gateway intactos')
          PY
      - name: Comprobar carga pública sin JWT ni POST
        run: |
          set -euo pipefail
          mkdir -p /tmp/v50/browser
          cd /tmp/v50/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({locale:'es-CL'});
            await page.goto('https://rutahyd2.free.nf/?v50=clientes',
              {waitUntil:'domcontentloaded',timeout:55000});
            await page.waitForTimeout(3200);
            const result=await page.evaluate(()=>({
              logo:!!document.querySelector('.brand-logo'),
              clientsMenu:!!document.querySelector('#clientSubnav [data-nav="clientes_listado"]'),
              css:!!document.querySelector('link[href*="clientes-v50.css?v=20261122-v50"]'),
              api:!!document.querySelector('script[src*="catalogos-api.js?v=20261122-v50"]'),
              ui:!!document.querySelector('script[src*="modulos-oficiales.js?v=20261122-v50"]'),
              app:!!document.querySelector('script[src*="app-produccion.js?v=20261122-v50"]'),
              v49:!!document.querySelector('script[src*="proveedores-productos.js?v=20261122-v49prod"]'),
              v48:!!document.querySelector('script[src*="usuarios.js?v=20261122-v48prod"]'),
              module:typeof window.RutaHDOficial?.mount==='function'
            }));
            console.log('V50_PUBLIC_SMOKE',JSON.stringify(result));
            if(!Object.values(result).every(Boolean))
              console.log('::warning::Puede existir desafío público de InfinityFree; verificación de bytes FTPS sí completa.');
          }finally{await browser.close();}
          JS
      - name: Recuperar ocho originales y retirar CSS nuevo si hubo error
        if: failure()
        run: |
          set +x
          if [ ! -f /tmp/v50/upload-started ];then
            echo 'V50_ROLLBACK_NO_APLICA: no se transfirió nada'
            exit 0
          fi
          python3 - <<'PY'
          import os,pathlib
          p=pathlib.Path('/tmp/v50')
          manifest=dict(x.split('\t',1) for x in (p/'manifest').read_text().splitlines())
          with (p/'rollback.lftp').open('w') as f:
            for cmd in ['set cmd:fail-exit yes','set ftp:ssl-force yes',
              'set ftp:ssl-protect-data yes','set ssl:verify-certificate yes',
              'set net:timeout 45','set net:max-retries 3']:print(cmd,file=f)
            print('open -u "'+os.environ['FTP_USER']+'","'+os.environ['FTP_PASSWORD']+
              '" ftp://'+os.environ['FTP_HOST'],file=f)
            for name in (p/'originals').read_text().splitlines():
              print('put '+str(p/'before'/name)+' -o '+manifest[name],file=f)
            print('rm '+manifest['assets/css/clientes-v50.css'],file=f)
            print('bye',file=f)
          PY
          lftp -f /tmp/v50/rollback.lftp >/dev/null ||
            echo '::error::Rollback incompleto, recuperar artefacto rutahd-v50-respaldo-previo-clientes'
      - name: Destruir scripts temporales con credenciales FTPS
        if: always()
        run: rm -f /tmp/v50/*.lftp
