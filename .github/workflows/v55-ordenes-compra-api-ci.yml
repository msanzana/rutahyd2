name: V55 - OC API JWT y correo simulado en MySQL temporal
on:
  push:
    branches: [feature/v55-ordenes-compra-estados-20261123]
    paths:
      - app/Http/Controllers/OrdenesCompraControlador.php
      - app/Services/PdfOrdenCompra.php
      - routes/api.php
      - database/espanol/38_estados_modulos_oc_productos_ddl.sql
      - tests/integracion_ordenes_compra_v55.php
      - .github/workflows/v55-ordenes-compra-api-ci.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  orders:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: temporal_ci_solamente
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptemporal_ci_solamente --silent"
          --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, intl, xml, dom, curl, pdo_mysql, openssl, fileinfo
      - name: PHP estático
        run: |
          set -euo pipefail
          php -l app/Http/Controllers/OrdenesCompraControlador.php
          php -l tests/integracion_ordenes_compra_v55.php
      - name: MySQL8 efímero, catálogo y DDL38
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente < database/espanol/01_esquema_completo_34_tablas_es.sql
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente < database/espanol/05_semillas_es.sql
          for f in 12_tokens_acceso_opcional.sql 13_catalogos_comerciales_aditivos.sql 14_productos_clasificacion_campos.sql 16_permisos_modulos_producto.sql 18_recuperacion_contrasenas.sql 19_rut_usuarios.sql 20_proveedores_productos_codigos_barras_ddl.sql 21_catalogos_referencia_semillas.sql 23_preferencias_usuarios_permisos_submodulos_ddl.sql 24_listas_precios_sin_triggers.sql 25_productos_fotos_ddl_sin_triggers.sql;do
            mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente rutahyd2_es_local < "database/espanol/$f"
          done
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente rutahyd2_es_local \
            < database/espanol/38_estados_modulos_oc_productos_ddl.sql
      - name: Laravel real JWT con Mail mock, sin red ni datos productivos
        env:
          APP_NAME: RutaHD2_CI
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          RUTAHD_JWT_SECRET: 'CI_ONLY_JWT_TEST_SIGNING_KEY_DO_NOT_USE_IN_PRODUCTION_2026'
          APP_URL: http://127.0.0.1
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: rutahyd2_es_local
          DB_USERNAME: root
          DB_PASSWORD: temporal_ci_solamente
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: smtp
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          php artisan route:list --path=api/v1/ordenes-compra
          php tests/integracion_ordenes_compra_v55.php
          echo V55_API_JWT_MYSQL_OK
