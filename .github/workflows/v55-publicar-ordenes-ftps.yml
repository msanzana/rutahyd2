name: V55 - Publicar Ordenes de Compra por FTPS con rollback
on:
  push:
    branches: [deploy/v55-ordenes-compra-ftps-20261123]
    paths: [.github/workflows/v55-publicar-ordenes-ftps.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  desplegar:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
      BACK_BASE: a60307b8dab65fc99bbb40927b2809d55066afc1
      BACK_PIN: f8ef78845e8b01703e98d0c9d9333c00d9f70db5
      FRONT_BASE: 3046e3ea2c95342a5bea7d8959553d747f064db3
      FRONT_PIN: c360f8c5dddb53f120805301eaaad4cc9855e538
    steps:
      - uses: actions/checkout@v4
      - name: Fuente fija, herramientas, preparación SIN cambios remotos
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_PASSWORD"
          test "$(git rev-parse HEAD)" = "$BACK_PIN"
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp php-cli >/dev/null
          git fetch -q --depth=1 origin "$BACK_BASE" "$BACK_PIN"
          git clone -q --depth=1 --branch feature/v55-ordenes-compra-20261123 https://github.com/msanzana/rutahyd2front.git /tmp/v55-front
          git -C /tmp/v55-front fetch -q --depth=1 origin "$FRONT_BASE" "$FRONT_PIN"
          git -C /tmp/v55-front checkout -q --detach "$FRONT_PIN"
          test "$(git -C /tmp/v55-front rev-parse HEAD)" = "$FRONT_PIN"
          umask 077
          mkdir -p /tmp/v55deploy/{before,after,check}

      - name: Respaldo FTPS de archivos originales, guardas y listado de nuevos
        run: |
          set -euo pipefail
          set +x
          umask 077
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('/tmp/v55deploy')
          existing=[
            'index.html',
            'assets/js/app-produccion.js',
            'assets/js/catalogos-api.js',
            'assets/js/listados-ui.js',
            'assets/js/buscador-productos-v39.js',
            'routes/api.php',
            'app/Models/OrdenCompra.php',
            'app/Models/DetalleOrdenCompra.php'
          ]
          new=[
            'app/Models/Estado.php','app/Models/Modulo.php',
            'app/Models/ModuloEstado.php',
            'app/Services/PdfOrdenCompra.php',
            'app/Http/Controllers/OrdenesCompraControlador.php',
            'assets/css/ordenes-compra-v55.css',
            'assets/js/ordenes-compra-v55.js',
          ]
          guards={
            'root.guard':'/htdocs/.htaccess',
            'api.guard':'/htdocs/api/.htaccess',
            'private.guard':'/htdocs/api-v2/.htaccess',
            'gateway.guard':'/htdocs/api/index.php',
          }
          def remote(name):
            return ('/htdocs/api-v2/' if name.startswith(('app/','routes/')) else '/htdocs/')+name
          manifest={name:remote(name) for name in existing+new}
          manifest.update(guards)
          (p/'existing.txt').write_text('\n'.join(existing)+'\n')
          (p/'new.txt').write_text('\n'.join(new)+'\n')
          (p/'manifest.txt').write_text(''.join(k+'\t'+v+'\n' for k,v in manifest.items()))
          with (p/'read.lftp').open('w') as f:
            for cmd in ['set cmd:fail-exit yes','set ftp:ssl-force yes',
              'set ftp:ssl-protect-data yes','set ssl:verify-certificate yes',
              'set net:timeout 45','set net:max-retries 3']:
              print(cmd,file=f)
            print('open -u "'+os.environ['FTP_USER']+'","'+os.environ['FTP_PASSWORD']+
              '" ftp://'+os.environ['FTP_HOST'],file=f)
            for name in existing+list(guards):
              dest=p/'before'/name
              dest.parent.mkdir(parents=True,exist_ok=True)
              print('get '+manifest[name]+' -o '+str(dest),file=f)
            for path in ['/htdocs/api-v2/app/Models',
              '/htdocs/api-v2/app/Services','/htdocs/api-v2/app/Http/Controllers',
              '/htdocs/assets/js','/htdocs/assets/css']:
              print('cls -1 '+path,file=f)
            print('bye',file=f)
          PY
          lftp -f /tmp/v55deploy/read.lftp >/tmp/v55deploy/listing.txt 2>/tmp/v55deploy/ftps-read.log
          rm -f /tmp/v55deploy/read.lftp

      - name: Preflight SHA exacto V54 y nombres nuevos ausentes
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('/tmp/v55deploy')
          hashes={
            'index.html':'e35b1001049f2d78ea5adb9ffbf4ccdec1e62a10fbf79271d845e7df577a2049',
            'assets/js/app-produccion.js':'f73cefb59d17276cba3e6afdbe036d1ca3f7ba2e65ecd3aa7c53a8a4fc606fae',
            'assets/js/catalogos-api.js':'43ee39965f08949591e5ffe5fb1991d4ffa500b020b278db697a354d536c6b9f',
            'assets/js/listados-ui.js':'9af8b700f8b4ac723c2b2edca974e27f8568f26f317459bc5f55ecc1fdd6fd9e',
            'assets/js/buscador-productos-v39.js':'3f17bad1b688fc703ece0bccaf627a9c0467136c72093549cfcb69c3b53ff749',
            'routes/api.php':'501299bcefbd327284b5d0a9909cb02a3c48466e0b7e3dda6db7540133ad836e',
            'app/Models/OrdenCompra.php':'5e46b869eba69ce85e42d43b510a5a489992db417d0bb25e8d78224236153e89',
            'app/Models/DetalleOrdenCompra.php':'16b4a209c2f1e49b4789742d8707446402d9a5c107d3ee4297dfcf2b28c577d5',
            'root.guard':'a6cbd7462dc5a8492cbdb15e406ad5058557f616375380b813dcf8d24ed47d1e',
            'api.guard':'ae0248cbcc21787c4595995a9cf76fd8c2edf34bb90cb1051820fc830bde9706',
            'private.guard':'f19e0a6ec4db41ce29fa249819d1121707608a25e2f697f023d94788f9751a0b',
            'gateway.guard':'37b5ad7eabd2d7a9ba22c831a3464db8d16fc8cf32950aa6a8a6da811b942687',
          }
          for name,expected in hashes.items():
            actual=hashlib.sha256((p/'before'/name).read_bytes()).hexdigest()
            assert actual==expected,'Un archivo remoto cambió desde auditoría: '+name
          listed={line.strip().rstrip('/').split('/')[-1]
            for line in (p/'listing.txt').read_text().splitlines()}
          for name in (p/'new.txt').read_text().splitlines():
            assert Path(name).name not in listed,'El archivo nuevo ya existe en servidor: '+name
          html=(p/'before/index.html').read_text()
          assert 'v53-cache-20261123' in html
          assert 'app-produccion.js?v=20261123-v54' in html
          assert 'modulos-oficiales.js?v=20261123-v52' in html
          assert 'no-store, no-cache' in (p/'before/root.guard').read_text()
          assert 'HTTP_AUTHORIZATION' in (p/'before/api.guard').read_text()
          assert 'Require all denied' in (p/'before/private.guard').read_text()
          assert 'rutahd2_api_ready' in (p/'before/gateway.guard').read_text()
          print('V55_PREFLIGHT_SHA_OK: V54 intacta, todos los archivos nuevos ausentes')
          PY

      - name: Aplicar parches sin fuzz, generar HTML sobre V54 y validar sintaxis
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import os,subprocess,shutil
          p=Path('/tmp/v55deploy')
          existing=(p/'existing.txt').read_text().splitlines()
          new=(p/'new.txt').read_text().splitlines()
          for name in existing:
            target=p/'after'/name
            target.parent.mkdir(parents=True,exist_ok=True)
            shutil.copy2(p/'before'/name,target)
          front=['assets/js/app-produccion.js','assets/js/catalogos-api.js',
            'assets/js/listados-ui.js','assets/js/buscador-productos-v39.js']
          back=['routes/api.php','app/Models/OrdenCompra.php',
            'app/Models/DetalleOrdenCompra.php']
          for repo,base,pin,names in [
            ('/tmp/v55-front',os.environ['FRONT_BASE'],os.environ['FRONT_PIN'],front),
            (os.environ['GITHUB_WORKSPACE'],os.environ['BACK_BASE'],os.environ['BACK_PIN'],back)]:
            for path in names:
              patch=subprocess.run(['git','-C',repo,'diff','--no-ext-diff','--binary',
                base,pin,'--',path],capture_output=True,check=True).stdout
              assert patch.count(b'diff --git')==1,path
              applied=subprocess.run(['patch','--batch','--fuzz=0','-p1',
                '-d',str(p/'after')],input=patch,capture_output=True)
              if applied.returncode:
                print(applied.stdout.decode(errors='replace')[:1500])
                raise RuntimeError('Patch no coincide: '+path)
              print('V55_PATCH_OK',path)
          for name in new:
            repo=Path('/tmp/v55-front') if name.startswith('assets/') else Path(os.environ['GITHUB_WORKSPACE'])
            dst=p/'after'/name
            dst.parent.mkdir(parents=True,exist_ok=True)
            shutil.copy2(repo/name,dst)
          # Solo modificar las etiquetas y el menú indispensables: NO reemplazar
          # el index por una versión desactualizada del repositorio.
          original=(p/'before/index.html').read_text()
          html=original
          oldMenu='<button type="button" data-nav="compras" class="nav-link"><svg class="icon"><use href="#i-orders"/></svg><span>Compras</span></button>'
          src=(Path('/tmp/v55-front')/'index.html').read_text()
          start=src.index('<div class="nav-group" id="purchasesNavGroup">')
          stop=src.index('<button type="button" data-nav="ventas"',start)
          newMenu=src[start:stop].rstrip()
          assert '<div id="purchaseSubnav"' in newMenu
          assert html.count(oldMenu)==1
          html=html.replace(oldMenu,newMenu)
          oldCss='  <link rel="stylesheet" href="assets/css/clientes-v50.css?v=20261123-v52">'
          newCss='  <link rel="stylesheet" href="assets/css/ordenes-compra-v55.css?v=20261123-v55">'
          assert html.count(oldCss)==1 and newCss not in html
          html=html.replace(oldCss,oldCss+'\n'+newCss)
          tags={
            'listados-ui.js?v=20261123-v52':'listados-ui.js?v=20261123-v55',
            'catalogos-api.js?v=20261122-v50':'catalogos-api.js?v=20261123-v55',
            'buscador-productos-v39.js?v=20261123-v52':
              'buscador-productos-v39.js?v=20261123-v55'
          }
          for old,newValue in tags.items():
            assert html.count(old)==1,'Versión existente inesperada: '+old
            html=html.replace(old,newValue)
          oldScript='  <script src="assets/js/app-produccion.js?v=20261123-v54" defer></script>'
          newScript=('  <script src="assets/js/ordenes-compra-v55.js?v=20261123-v55" defer></script>\n'+
            '  <script src="assets/js/app-produccion.js?v=20261123-v55" defer></script>')
          assert html.count(oldScript)==1
          html=html.replace(oldScript,newScript)
          assert html.count('data-nav="compras_ordenes"')==1
          assert html.count('ordenes-compra-v55.js?v=20261123-v55')==1
          assert 'v53-cache-20261123' in html
          assert 'modulos-oficiales.js?v=20261123-v52' in html
          assert 'giros-sii-v39.js?v=20261123-v52' in html
          (p/'after/index.html').write_text(html)
          assert html!=original
          print('V55_HTML_PATCH_OK: conservadas etiquetas V52/V53/V54 restantes')
          PY
          for name in app/Models/Estado.php app/Models/Modulo.php app/Models/ModuloEstado.php \
            app/Services/PdfOrdenCompra.php app/Http/Controllers/OrdenesCompraControlador.php \
            app/Models/OrdenCompra.php app/Models/DetalleOrdenCompra.php routes/api.php;do
            php -l "/tmp/v55deploy/after/$name"
          done
          for name in assets/js/app-produccion.js assets/js/catalogos-api.js \
            assets/js/listados-ui.js assets/js/buscador-productos-v39.js \
            assets/js/ordenes-compra-v55.js;do
            node --check "/tmp/v55deploy/after/$name"
          done
          echo 'V55_PATCH_AND_SYNTAX_OK: 16 archivos previstos'

      - name: Conservar respaldo para restauración antes de escribir
        uses: actions/upload-artifact@v4
        with:
          name: rutahd-v55-respaldo-antes-ordenes-compra
          path: /tmp/v55deploy/before/
          retention-days: 30
          if-no-files-found: error

      - name: Publicar primero clases backend y recursos, HTML al final
        run: |
          set -euo pipefail
          set +x
          umask 077
          touch /tmp/v55deploy/upload-started
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('/tmp/v55deploy')
          remote=dict(x.split('\t',1) for x in (p/'manifest.txt').read_text().splitlines())
          sequence=[
            'app/Models/Estado.php','app/Models/Modulo.php','app/Models/ModuloEstado.php',
            'app/Services/PdfOrdenCompra.php',
            'app/Http/Controllers/OrdenesCompraControlador.php',
            'app/Models/OrdenCompra.php','app/Models/DetalleOrdenCompra.php',
            'routes/api.php',
            'assets/css/ordenes-compra-v55.css','assets/js/ordenes-compra-v55.js',
            'assets/js/listados-ui.js','assets/js/catalogos-api.js',
            'assets/js/buscador-productos-v39.js','assets/js/app-produccion.js',
            'index.html'
          ]
          assert len(sequence)==len(set(sequence))==15
          (p/'uploaded.txt').write_text('\n'.join(sequence)+'\n')
          with (p/'put.lftp').open('w') as f:
            for cmd in ['set cmd:fail-exit yes','set ftp:ssl-force yes',
              'set ftp:ssl-protect-data yes','set ssl:verify-certificate yes',
              'set net:timeout 45','set net:max-retries 3']:print(cmd,file=f)
            print('open -u "'+os.environ['FTP_USER']+'","'+os.environ['FTP_PASSWORD']+
              '" ftp://'+os.environ['FTP_HOST'],file=f)
            for name in sequence:print('put '+str(p/'after'/name)+' -o '+remote[name],file=f)
            print('bye',file=f)
          PY
          lftp -f /tmp/v55deploy/put.lftp >/dev/null 2>/tmp/v55deploy/ftps-put.log
          rm -f /tmp/v55deploy/put.lftp
          echo 'V55_FTPS_PUBLISHED: 15 archivos, rutas y HTML último'

      - name: Descargar archivos nuevamente, comparar bytes y guardas intactas
        run: |
          set -euo pipefail
          set +x
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('/tmp/v55deploy')
          remote=dict(x.split('\t',1) for x in (p/'manifest.txt').read_text().splitlines())
          names=(p/'uploaded.txt').read_text().splitlines()+[
            'root.guard','api.guard','private.guard','gateway.guard']
          with (p/'verify.lftp').open('w') as f:
            for cmd in ['set cmd:fail-exit yes','set ftp:ssl-force yes',
              'set ftp:ssl-protect-data yes','set ssl:verify-certificate yes',
              'set net:timeout 45','set net:max-retries 3']:print(cmd,file=f)
            print('open -u "'+os.environ['FTP_USER']+'","'+os.environ['FTP_PASSWORD']+
              '" ftp://'+os.environ['FTP_HOST'],file=f)
            for name in names:
              dest=p/'check'/name
              dest.parent.mkdir(parents=True,exist_ok=True)
              print('get '+remote[name]+' -o '+str(dest),file=f)
            print('bye',file=f)
          PY
          lftp -f /tmp/v55deploy/verify.lftp >/dev/null 2>/tmp/v55deploy/ftps-verify.log
          rm -f /tmp/v55deploy/verify.lftp
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/v55deploy')
          names=(p/'uploaded.txt').read_text().splitlines()
          for name in names:
            assert (p/'check'/name).read_bytes()==(p/'after'/name).read_bytes(),name
          for name in ['root.guard','api.guard','private.guard','gateway.guard']:
            assert (p/'check'/name).read_bytes()==(p/'before'/name).read_bytes(),name
          print('V55_BYTES_OK: 15 archivos exactos, 4 protecciones sin modificar')
          PY

      - name: Smoke Chromium público, sin credenciales ni escrituras de negocio
        run: |
          set -euo pipefail
          mkdir -p /tmp/v55deploy/browser
          cd /tmp/v55deploy/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({locale:'es-CL',viewport:{width:1280,height:800}});
            const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto('https://rutahyd2.free.nf/',{
              waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>
              Boolean(window.RutaHDProduccion?.navigate)&&
              Boolean(window.RutaHDOrdenesCompra?.mount),null,{timeout:45000});
            await page.waitForTimeout(1800);
            const front=await page.evaluate(()=>({
              meta:document.querySelector('meta[name="rutahd-release"]')?.content,
              menu:!!document.querySelector('#purchaseSubnav [data-nav="compras_ordenes"]'),
              css:!!document.querySelector('link[href*="ordenes-compra-v55.css?v=20261123-v55"]'),
              module:!!document.querySelector('script[src*="ordenes-compra-v55.js?v=20261123-v55"]'),
              api:typeof window.RutaHDApiCatalogos?.purchaseOrders==='function',
              pdf:typeof window.RutaHDApiCatalogos?.purchaseOrderPdf==='function',
              finder:typeof window.RutaHDBuscadorProductos?.open==='function',
              login:!!document.querySelector('#loginDialog'),
              clients:!!document.querySelector('#clientSubnav [data-nav="clientes_listado"]'),
            }));
            const api=await page.evaluate(async()=>{
              try {
                const r=await fetch('/api/v1/ordenes-compra',{
                  headers:{Accept:'application/json'},credentials:'same-origin',cache:'no-store'});
                return {status:r.status,kind:r.headers.get('content-type')||''};
              }catch(e){return {error:String(e).slice(0,80)};}
            });
            console.log('V55_PUBLIC_SMOKE',JSON.stringify({
              http:response?.status(),front,api,errors
            }));
            if(response?.status()!==200||
              front.meta!=='v53-cache-20261123'||
              !Object.values(front).every(Boolean)||
              errors.length)throw Error('Fallo en inicio del frontend V55');
            if(api.kind.includes('application/json')&&api.status!==401)
              throw Error('API OC no denegó acceso sin JWT: '+api.status);
            if(api.status!==401)console.log('::warning::API 401 no confirmada por desafío web; requiere seguimiento');
            console.log('V55_SMOKE_PUBLIC_OK');
          }finally{await browser.close();}
          JS

      - name: Restaurar todos los originales y retirar archivos nuevos ante error
        if: failure()
        run: |
          set +x
          if [ ! -f /tmp/v55deploy/upload-started ];then
            echo 'V55_ROLLBACK_NO_APLICA: producción no fue modificada'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('/tmp/v55deploy')
          remote=dict(x.split('\t',1) for x in (p/'manifest.txt').read_text().splitlines())
          existing=(p/'existing.txt').read_text().splitlines()
          new=(p/'new.txt').read_text().splitlines()
          # HTML primero, luego rutas y JS/PHP originales, finalmente nuevas clases.
          sequence=['index.html','routes/api.php']+[x for x in existing if x not in ['index.html','routes/api.php']]
          with (p/'rollback.lftp').open('w') as f:
            for cmd in ['set cmd:fail-exit yes','set ftp:ssl-force yes',
              'set ftp:ssl-protect-data yes','set ssl:verify-certificate yes',
              'set net:timeout 45','set net:max-retries 3']:print(cmd,file=f)
            print('open -u "'+os.environ['FTP_USER']+'","'+os.environ['FTP_PASSWORD']+
              '" ftp://'+os.environ['FTP_HOST'],file=f)
            for name in sequence:
              print('put '+str(p/'before'/name)+' -o '+remote[name],file=f)
            print('set cmd:fail-exit no',file=f)
            for name in new:print('rm '+remote[name],file=f)
            print('bye',file=f)
          PY
          lftp -f /tmp/v55deploy/rollback.lftp >/dev/null 2>/tmp/v55deploy/ftps-rollback.log &&
            echo 'V55_ROLLBACK_ATTEMPTED: anteriores restaurados, nuevos retirados' ||
            echo '::error::Restauración incompleta; usar artifact rutahd-v55-respaldo-antes-ordenes-compra'

      - name: Eliminar scripts FTP temporales que contienen credenciales
        if: always()
        run: rm -f /tmp/v55deploy/*.lftp
