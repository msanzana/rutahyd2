name: V56 - Auditoria FTPS UI solo lectura
on:
  push:
    branches: [audit/v56-ui-readonly-20261123]
    paths: [.github/workflows/v56-ftps-readonly.yml]
  workflow_dispatch:
permissions: {contents: read}
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  auditar:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
      FRONT_BASE: c360f8c5dddb53f120805301eaaad4cc9855e538
      FRONT_PIN: 8f5df98355a688366e45dedbf23ebe3775d3d767
    steps:
      - uses: actions/checkout@v4
      - name: Preparar fuente fijada y transporte
        run: |
          set -euo pipefail
          set +x
          test -n "$FTP_PASSWORD"
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp >/dev/null
          git clone -q --depth=1 --branch feature/v56-oc-compacta-selects-20261123 https://github.com/msanzana/rutahyd2front.git /tmp/v56front
          git -C /tmp/v56front fetch -q --depth=1 origin "$FRONT_BASE" "$FRONT_PIN"
          git -C /tmp/v56front checkout -q --detach "$FRONT_PIN"
          test "$(git -C /tmp/v56front rev-parse HEAD)" = "$FRONT_PIN"
          mkdir -p /tmp/v56audit/before
      - name: Descargar producción sin modificar nada
        run: |
          set -euo pipefail
          set +x
          umask 077
          python3 - <<'PY'
          from pathlib import Path
          import os
          p=Path('/tmp/v56audit')
          locations={
            'index.html':'/htdocs/index.html',
            'assets/js/ordenes-compra-v55.js':'/htdocs/assets/js/ordenes-compra-v55.js',
            'assets/css/ordenes-compra-v55.css':'/htdocs/assets/css/ordenes-compra-v55.css',
            'root.htaccess':'/htdocs/.htaccess',
            'api.htaccess':'/htdocs/api/.htaccess',
            'private.htaccess':'/htdocs/api-v2/.htaccess',
            'gateway':'/htdocs/api/index.php',
          }
          with (p/'readonly.lftp').open('w') as f:
            for cmd in ('set cmd:fail-exit yes','set ftp:ssl-force yes',
              'set ftp:ssl-protect-data yes','set ssl:verify-certificate yes',
              'set net:timeout 45','set net:max-retries 3'):print(cmd,file=f)
            print('open -u "'+os.environ['FTP_USER']+'","'+os.environ['FTP_PASSWORD']+
              '" ftp://'+os.environ['FTP_HOST'],file=f)
            for name,remote in locations.items():
              dst=p/'before'/name;dst.parent.mkdir(parents=True,exist_ok=True)
              print('get '+remote+' -o '+str(dst),file=f)
            print('cls -1 /htdocs/assets/js',file=f)
            print('cls -1 /htdocs/assets/css',file=f)
            print('bye',file=f)
          PY
          lftp -f /tmp/v56audit/readonly.lftp >/tmp/v56audit/listing.txt 2>/tmp/v56audit/read-error.log
          rm -f /tmp/v56audit/readonly.lftp
      - name: Verificar V55 y parches exactos sobre producción
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,subprocess,os
          p=Path('/tmp/v56audit');old=p/'before'
          html=(old/'index.html').read_text()
          for tag in ['v53-cache-20261123','ordenes-compra-v55.js?v=20261123-v55',
            'ordenes-compra-v55.css?v=20261123-v55','app-produccion.js?v=20261123-v55',
            'clientes-v50.css?v=20261123-v52']:
            assert tag in html,'Etiqueta inesperada: '+tag
          assert 'no-store, no-cache' in (old/'root.htaccess').read_text()
          assert 'HTTP_AUTHORIZATION' in (old/'api.htaccess').read_text()
          assert 'Require all denied' in (old/'private.htaccess').read_text()
          assert 'rutahd2_api_ready' in (old/'gateway').read_text()
          names={line.strip().split('/')[-1] for line in (p/'listing.txt').read_text().splitlines()}
          for new in ['select-buscable-v56.js','select-buscable-v56.css']:
            assert new not in names,'El archivo nuevo ya existe: '+new
          for name in ['index.html','assets/js/ordenes-compra-v55.js',
            'assets/css/ordenes-compra-v55.css','root.htaccess',
            'api.htaccess','private.htaccess','gateway']:
            b=(old/name).read_bytes()
            print('V56_REMOTE_SHA',name,hashlib.sha256(b).hexdigest(),len(b))
          for name in ['index.html','assets/js/ordenes-compra-v55.js',
            'assets/css/ordenes-compra-v55.css']:
            patch=subprocess.run(['git','-C','/tmp/v56front','diff','--binary',
              '--no-ext-diff',os.environ['FRONT_BASE'],os.environ['FRONT_PIN'],
              '--',name],check=True,capture_output=True).stdout
            assert patch.count(b'diff --git')==1,name
            result=subprocess.run(['patch','--batch','--fuzz=0',
              '--dry-run','-p1','-d',str(old)],input=patch,capture_output=True)
            print('V56_PATCH_PREFLIGHT',name,'OK' if result.returncode==0 else 'CONFLICT')
            if result.returncode:
              print(result.stdout.decode(errors='replace')[:1600])
              raise AssertionError('Divergencia remota: cancelar')
          print('V56_FTPS_READONLY_OK')
          PY
      - name: Borrar scripts temporales con credenciales
        if: always()
        run: rm -f /tmp/v56audit/*.lftp
