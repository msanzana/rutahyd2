name: V63 - Documentos CRUD JWT MySQL efímero
on:
  push:
    branches: [feature/v63-documentos-crud-20261124]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  api:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: temporal_ci_solamente
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -ptemporal_ci_solamente --silent"
          --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, intl, xml, dom, curl, pdo_mysql, openssl, fileinfo
      - name: Verificar sintaxis
        run: |
          set -euo pipefail
          php -l app/Http/Controllers/TiposDocumentosControlador.php
          php -l routes/api.php
          php -l tests/integracion_tipos_documentos_v63.php
      - name: Preparar esquema de pruebas, no producción
        run: |
          set -euo pipefail
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente < database/espanol/01_esquema_completo_34_tablas_es.sql
          mysql -h 127.0.0.1 -uroot -ptemporal_ci_solamente < database/espanol/05_semillas_es.sql
      - name: JWT real y CRUD Documentos contra MySQL efímero
        env:
          APP_NAME: RutaHD2_V63_CI
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          RUTAHD_JWT_SECRET: 'CI_ONLY_JWT_TEST_SIGNING_KEY_DO_NOT_USE_IN_PRODUCTION_2026'
          APP_URL: http://127.0.0.1
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: rutahyd2_es_local
          DB_USERNAME: root
          DB_PASSWORD: temporal_ci_solamente
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: log
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          php artisan route:list --path=api/v1/tipos-documentos
          php tests/integracion_tipos_documentos_v63.php
