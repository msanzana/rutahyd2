name: V68 - Publicar filtros compactos
on:
  push:
    branches: [deploy/v68-filtros-compactos-20261124]
    paths: [.github/workflows/v68-publicar-filtros.yml]
permissions: {contents: read}
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Obtener fuentes fijadas y validar sintaxis
        run: |
          set -euo pipefail
          git clone -q --depth=1 --branch fix/v68-filtros-compactos-20261124 https://github.com/msanzana/rutahyd2front.git /tmp/front67
          git -C /tmp/front67 fetch -q --depth=1 origin 816580822ae8c4bf1e1e47f5e8896c48bd678da1 eb26e5d391317bbc409e3e9baedb44c59f8d101e
          mkdir -p /tmp/v68
          cat > /tmp/v68/transport.py <<'PY'
          import os,ssl,ftplib,io,pathlib,subprocess,re,sys
          p=pathlib.Path('/tmp/v68')
          back='app/Http/Controllers/ComprasConsultasControlador.php'
          front=['assets/css/tipos-documentos-v63.css']
          files=front+['index.html']
          guards={'root.guard':'/htdocs/.htaccess','api.guard':'/htdocs/api/.htaccess','private.guard':'/htdocs/api-v2/.htaccess','gateway.guard':'/htdocs/api/index.php'}
          def remote(n):return guards.get(n,('/htdocs/api-v2/' if n==back else '/htdocs/')+n)
          def get(f,n):
              b=io.BytesIO();f.retrbinary('RETR '+remote(n),b.write);return b.getvalue()
          def put(f,n,b):f.storbinary('STOR '+remote(n),io.BytesIO(b))
          def save(area,n,b):
              d=p/area/n;d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(b)
          def read(area,n):return (p/area/n).read_bytes()
          def git(repo,ref,n):return subprocess.check_output(['git','-C',repo,'show',ref+':'+n])
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(os.environ['FTP_HOST']);f.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);f.prot_p()
          with f:
              mode=sys.argv[1]
              if mode=='prepare':
                  for n in files+list(guards):save('before',n,get(f,n))
                  for n in front:
                      repo=os.environ['GITHUB_WORKSPACE'] if n==back else '/tmp/front67'
                      old='c9f2c07de170d6d8cc58b317dc50edbe48aeec47' if n==back else '816580822ae8c4bf1e1e47f5e8896c48bd678da1'
                      new='646e28770decd9a7ec3d1740911d1e82cbcc0d00' if n==back else 'eb26e5d391317bbc409e3e9baedb44c59f8d101e'
                      if read('before',n)==git(repo,old,n):save('after',n,git(repo,new,n))
                      else:
                          save('after',n,read('before',n))
                          delta=subprocess.check_output(['git','-C',repo,'diff','--binary',old,new,'--',n])
                          assert delta.count(b'diff --git')==1,n
                          subprocess.run(['patch','--batch','--fuzz=0','-p1','-d',str(p/'after')],input=delta,check=True)
                  html=read('before','index.html').decode()
                  for n in front:
                      pattern=re.escape(n)+r'\?v=[^"\s]+'
                      matches=re.findall(pattern,html)
                      assert len(matches)==1,(n,matches)
                      html=html.replace(matches[0],n+'?v=20261124-v68',1)
                  save('after','index.html',html.encode())
                  print('V68_PRECHECK_OK')
              elif mode=='publish':
                  for n in files+list(guards):assert get(f,n)==read('before',n),n
                  (p/'attempted').touch()
                  for n in files:
                      with (p/'attempted').open('a') as log:log.write(n+'\n')
                      put(f,n,read('after',n))
                  for n in files:assert get(f,n)==read('after',n),n
                  for n in guards:assert get(f,n)==read('before',n),n
                  print('V68_FTPS_BYTES_OK')
              elif mode=='rollback':
                  for n in reversed((p/'attempted').read_text().splitlines()):put(f,n,read('before',n))
                  for n in files+list(guards):assert get(f,n)==read('before',n),n
                  print('V68_ROLLBACK_OK')
          PY
          python /tmp/v68/transport.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: rutahd-v68-respaldo-previo
          path: /tmp/v68/before/
          retention-days: 30
          if-no-files-found: error
      - name: Publicar y cotejar bytes
        run: python /tmp/v68/transport.py publish
      - name: Verificar carga y protección JWT
        run: |
          set -euo pipefail
          mkdir -p /tmp/v68/browser
          cd /tmp/v68/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto('https://rutahyd2.free.nf/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>!!window.RutaHDComprasConsultas?.mount,null,{timeout:45000});
            const result=await page.evaluate(async()=>{
              const version=[...document.querySelectorAll('link[rel=stylesheet]')].some(s=>s.href.includes('tipos-documentos-v63.css?v=20261124-v68'));
              const status=(await fetch('/api/v1/inventario-consultas/kardex',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              return {version,status};
            });
            if(response?.status()!==200||!result.version||result.status!==401||errors.length)throw Error(JSON.stringify({result,errors}));
            for(const width of [1440,390]){
              await page.setViewportSize({width,height:850});
              const dims=await page.evaluate(()=>{
                const root=document.createElement('section');root.className='hd-documents hd-v67';root.style.cssText='position:fixed;inset:10px;z-index:99999;background:white';const form=document.createElement('form');form.className='hd-doc-filter';const l=document.createElement('label');l.className='hd-doc-field';const input=document.createElement('input');input.type='search';l.append(input);const b=document.createElement('button');b.className='button primary';b.textContent='Buscar';form.append(l,b);root.append(form);document.body.append(root);const out={search:input.getBoundingClientRect().width,button:b.getBoundingClientRect().width,height:b.getBoundingClientRect().height};root.remove();return out;
              });
              if(dims.search>281||Math.abs(dims.button-100)>2||dims.height>40||dims.search<100)throw Error(JSON.stringify(dims));
              console.log('V68_DIMENSIONS',width,JSON.stringify(dims));
            }
            console.log('V68_PUBLIC_OK');
          }finally{await browser.close();}
          JS
      - name: Restaurar originales si falla la publicación
        if: failure()
        run: |
          if [ -f /tmp/v68/attempted ]; then python /tmp/v68/transport.py rollback; fi
