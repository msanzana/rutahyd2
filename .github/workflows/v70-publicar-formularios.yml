name: V70 - Publicar formularios de compras
on:
  push:
    branches: [deploy/v70-formularios-compras-20261124]
    paths: [.github/workflows/v70-publicar-formularios.yml]
permissions: {contents: read}
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Obtener fuentes fijadas y validar sintaxis
        run: |
          set -euo pipefail
          git clone -q --depth=1 --branch feature/v70-formularios-compras-20261124 https://github.com/msanzana/rutahyd2front.git /tmp/front67
          git -C /tmp/front67 fetch -q --depth=1 origin 7bf6baa41ed91daa2986ffdf50a80d687443b297 9fa48bb103820b2c10073e88bee7752f1918bdd5
          mkdir -p /tmp/v70
          cat > /tmp/v70/transport.py <<'PY'
          import os,ssl,ftplib,io,pathlib,subprocess,re,sys
          p=pathlib.Path('/tmp/v70')
          back='app/Http/Controllers/ComprasConsultasControlador.php'
          front=['assets/js/compras-consultas-v66.js','assets/css/tipos-documentos-v63.css']
          files=front+['index.html']
          guards={'root.guard':'/htdocs/.htaccess','api.guard':'/htdocs/api/.htaccess','private.guard':'/htdocs/api-v2/.htaccess','gateway.guard':'/htdocs/api/index.php'}
          def remote(n):return guards.get(n,('/htdocs/api-v2/' if n==back else '/htdocs/')+n)
          def get(f,n):
              b=io.BytesIO();f.retrbinary('RETR '+remote(n),b.write);return b.getvalue()
          def put(f,n,b):f.storbinary('STOR '+remote(n),io.BytesIO(b))
          def save(area,n,b):
              d=p/area/n;d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(b)
          def read(area,n):return (p/area/n).read_bytes()
          def git(repo,ref,n):return subprocess.check_output(['git','-C',repo,'show',ref+':'+n])
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(os.environ['FTP_HOST']);f.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);f.prot_p()
          with f:
              mode=sys.argv[1]
              if mode=='prepare':
                  for n in files+list(guards):save('before',n,get(f,n))
                  for n in front:
                      repo=os.environ['GITHUB_WORKSPACE'] if n==back else '/tmp/front67'
                      old='7bf6baa41ed91daa2986ffdf50a80d687443b297'
                      new='9fa48bb103820b2c10073e88bee7752f1918bdd5'
                      assert old!=new,'Base y destino idénticos'
                      if read('before',n)==git(repo,old,n):save('after',n,git(repo,new,n))
                      else:
                          save('after',n,read('before',n))
                          delta=subprocess.check_output(['git','-C',repo,'diff','--binary',old,new,'--',n])
                          assert delta.count(b'diff --git')==1,n
                          subprocess.run(['patch','--batch','--fuzz=0','-p1','-d',str(p/'after')],input=delta,check=True)
                  html=read('before','index.html').decode()
                  for n in front:
                      pattern=re.escape(n)+r'\?v=[^"\s]+'
                      matches=re.findall(pattern,html)
                      assert len(matches)==1,(n,matches)
                      html=html.replace(matches[0],n+'?v=20261124-v70',1)
                  save('after','index.html',html.encode())
                  print('V70_PRECHECK_OK')
              elif mode=='publish':
                  for n in files+list(guards):assert get(f,n)==read('before',n),n
                  (p/'attempted').touch()
                  for n in files:
                      with (p/'attempted').open('a') as log:log.write(n+'\n')
                      put(f,n,read('after',n))
                  for n in files:assert get(f,n)==read('after',n),n
                  for n in guards:assert get(f,n)==read('before',n),n
                  print('V70_FTPS_BYTES_OK')
              elif mode=='rollback':
                  for n in reversed((p/'attempted').read_text().splitlines()):put(f,n,read('before',n))
                  for n in files+list(guards):assert get(f,n)==read('before',n),n
                  print('V70_ROLLBACK_OK')
          PY
          python /tmp/v70/transport.py prepare
          node --check /tmp/v70/after/assets/js/compras-consultas-v66.js
      - uses: actions/upload-artifact@v4
        with:
          name: rutahd-v70-respaldo-previo
          path: /tmp/v70/before/
          retention-days: 30
          if-no-files-found: error
      - name: Publicar y cotejar bytes
        run: python /tmp/v70/transport.py publish
      - name: Verificar carga y protección JWT
        run: |
          set -euo pipefail
          mkdir -p /tmp/v70/browser
          cd /tmp/v70/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto('https://rutahyd2.free.nf/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>!!window.RutaHDComprasConsultas?.mount,null,{timeout:45000});
            const result=await page.evaluate(async()=>{
              const version=[...document.scripts].some(s=>s.src.includes('compras-consultas-v66.js?v=20261124-v70'));
              const status=(await fetch('/api/v1/inventario-consultas/kardex',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              return {version,status};
            });
            if(response?.status()!==200||!result.version||result.status!==401||errors.length)throw Error(JSON.stringify({result,errors}));
            // Contexto independiente: no tocar el login real ni enviar operaciones a producción.
            const ui=await browser.newPage({viewport:{width:1440,height:900}});
            await ui.route('**/*',route=>route.abort());
            await ui.setContent('<main id="v70-test-root"></main>');
            await ui.addStyleTag({path:'/tmp/v70/after/assets/css/tipos-documentos-v63.css'});
            await ui.evaluate(()=>{
              window.RutaHDApiCatalogos=Object.freeze({
                purchaseConsultation:async()=>({total:0,last_page:1,data:[]}),
                documentTypes:async()=>({last_page:1,data:[{id:1,nombre:'Factura electrónica',documento_compra:1,familia:'FACTURA'}]}),
                resources:async()=>({last_page:1,data:[{id:1,nombre:'Bodega central',activo:1}]}),
                orderStates:async()=>({items:[{id:1,codigo:'ACTIVA'}]}),
                purchaseOrders:async({estadoId})=>{if(estadoId!==1)throw Error('Estado activo no aplicado');return {total:1,last_page:1,data:[{id:123,numero:'OC-PRUEBA',estado_codigo:'ACTIVA',proveedor_nombre:'Proveedor simulado'}]};},
                getPurchaseOrder:async(id)=>{if(id!==123)throw Error('OC incorrecta');return {id:123,numero:'OC-PRUEBA',estado_codigo:'ACTIVA',proveedor_nombre:'Proveedor simulado',detalles:[{sku:'SKU-PRUEBA',nombre:'Producto simulado',cantidad:2,costo_unitario_neto:100,subtotal_neto:200}]};}
              });
            });
            await ui.addScriptTag({path:'/tmp/v70/after/assets/js/compras-consultas-v66.js'});
            for(const key of ['recepciones','consolidaciones']){
              await ui.evaluate(key=>window.RutaHDComprasConsultas.mount(document.getElementById('v70-test-root'),key),key);
              const button=ui.locator('#v70-test-root [data-action="nuevo-documento"]');
              if(await button.count()!==1)throw Error('No existe botón '+key);
              await button.click({timeout:10000});
              const dialog=ui.locator('dialog.hd-doc-modal');
              await dialog.waitFor({state:'visible',timeout:10000});
              if(!(await dialog.locator('h2').textContent()).includes(key==='recepciones'?'Nueva recepción':'Nueva consolidación'))throw Error('Título incorrecto');
              await dialog.getByRole('button',{name:'Seleccionar orden OC-PRUEBA'}).click({timeout:10000});
              if(await dialog.getByRole('radio').count())throw Error('Radio no eliminado');
              await dialog.getByText('SKU-PRUEBA',{exact:true}).waitFor({state:'visible',timeout:10000});
              const save=dialog.getByRole('button',{name:key==='recepciones'?'Guardar recepción':'Guardar consolidación',exact:true});
              if(!(await save.isVisible())||!(await save.isDisabled()))throw Error('Guardado debe quedar visible y bloqueado');
              if(key==='recepciones'){
                await dialog.getByLabel('Tipo de documento',{exact:true}).selectOption('1');
                await dialog.getByLabel('Bodega de recepción',{exact:true}).selectOption('1');
                await dialog.getByLabel('Folio del documento',{exact:true}).fill('12345');
                await dialog.getByLabel('Cantidad recibida SKU-PRUEBA').fill('2');
              }
              const aligned=await ui.evaluate(()=>{const b=document.querySelector('[data-action="nuevo-documento"]'),s=b.closest('form').querySelector('button[type=submit]');return Math.abs(b.getBoundingClientRect().bottom-s.getBoundingClientRect().bottom)<2;});
              if(!aligned)throw Error('Botones fuera de alineación');
              await dialog.getByRole('button',{name:'Cerrar',exact:true}).last().click({timeout:10000});
              await dialog.waitFor({state:'detached',timeout:10000});
              console.log('V70_UI_OK',key);
            }
            await ui.close();
            console.log('V70_PUBLIC_OK');
          }finally{await browser.close();}
          JS
      - name: Restaurar originales si falla la publicación
        if: failure()
        run: |
          if [ -f /tmp/v70/attempted ]; then python /tmp/v70/transport.py rollback; fi
