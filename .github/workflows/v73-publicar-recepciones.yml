name: V73 - Publicar borradores de recepciones
on:
  push:
    branches: [deploy/v73-recepciones-borrador-20261125]
    paths: [.github/workflows/v73-publicar-recepciones.yml]
permissions: {contents: read}
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: temporal_ci_solamente
          MARIADB_DATABASE: rutahd_v73_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, intl, xml, dom, curl, pdo_mysql, openssl, fileinfo
      - name: Probar guardado, edición y rollback en MariaDB aislado
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: rutahd_v73_ci
          DB_USERNAME: root
          DB_PASSWORD: temporal_ci_solamente
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: log
        run: |
          set -euo pipefail
          php -l routes/api.php
          php -l app/Http/Controllers/RecepcionesBorradorControlador.php
          composer install --no-interaction --prefer-dist --no-progress
          php artisan route:list --path=api/v1/recepciones-borrador
          php tests/recepciones_borrador_v73.php
      - name: Preparar cambios y respaldo FTPS
        run: |
          set -euo pipefail
          git clone -q --depth=1 --branch feature/v73-recepciones-borrador-20261125 https://github.com/msanzana/rutahyd2front.git /tmp/front67
          git -C /tmp/front67 fetch -q --depth=1 origin ea00174a8fe173801b0ebb9e1b8b1be1205ce37c d6e73eae51596c71f10011c6e280267bc1337a99
          mkdir -p /tmp/v73
          cat > /tmp/v73/transport.py <<'PY'
          import os,ssl,ftplib,io,pathlib,subprocess,re,sys
          p=pathlib.Path('/tmp/v73')
          newfile='app/Http/Controllers/RecepcionesBorradorControlador.php'
          back=['routes/api.php',newfile]
          front=['assets/js/catalogos-api.js','assets/js/compras-consultas-v66.js']
          files=back+front+['index.html']
          guards={'root.guard':'/htdocs/.htaccess','api.guard':'/htdocs/api/.htaccess','private.guard':'/htdocs/api-v2/.htaccess','gateway.guard':'/htdocs/api/index.php'}
          def remote(n):return guards.get(n,('/htdocs/api-v2/' if n in back else '/htdocs/')+n)
          def get(f,n):
              b=io.BytesIO();f.retrbinary('RETR '+remote(n),b.write);return b.getvalue()
          def absent(f,n):
              try:get(f,n);return False
              except ftplib.error_perm as e:
                  if str(e).startswith('550'):return True
                  raise
          def put(f,n,b):f.storbinary('STOR '+remote(n),io.BytesIO(b))
          def save(area,n,b):
              d=p/area/n;d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(b)
          def read(area,n):return (p/area/n).read_bytes()
          def git(repo,ref,n):return subprocess.check_output(['git','-C',repo,'show',ref+':'+n])
          def verify_before(f,n):
              if n==newfile:assert absent(f,n),n
              else:assert get(f,n)==read('before',n),n
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(os.environ['FTP_HOST']);f.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);f.prot_p()
          with f:
              mode=sys.argv[1]
              if mode=='prepare':
                  for n in files+list(guards):
                      if n==newfile:
                          assert absent(f,n),'El archivo nuevo ya existe: detener para no sobrescribir'
                          save('before','new-file-absent.txt',n.encode())
                      else:save('before',n,get(f,n))
                  for n in back+front:
                      repo=os.environ['GITHUB_WORKSPACE'] if n in back else '/tmp/front67'
                      old='f7d2eaa127ec69fff73d10a2e41679bafcdbc06d' if n in back else 'ea00174a8fe173801b0ebb9e1b8b1be1205ce37c'
                      new='dc3bb595257fb2dd997aa464bead18a55a38f4c0' if n in back else 'd6e73eae51596c71f10011c6e280267bc1337a99'
                      if n==newfile or read('before',n)==git(repo,old,n):save('after',n,git(repo,new,n))
                      else:
                          save('after',n,read('before',n))
                          delta=subprocess.check_output(['git','-C',repo,'diff','--binary',old,new,'--',n])
                          assert delta.count(b'diff --git')==1,n
                          subprocess.run(['patch','--batch','--fuzz=0','-p1','-d',str(p/'after')],input=delta,check=True)
                  html=read('before','index.html').decode()
                  for n in front:
                      pattern=re.escape(n)+r'(?:\?v=[^"\s]+)?(?=["\s])'
                      matches=re.findall(pattern,html)
                      assert len(matches)==1,(n,matches)
                      html=html.replace(matches[0],n+'?v=20261125-v73',1)
                  save('after','index.html',html.encode())
                  print('V73_PRECHECK_OK')
              elif mode=='publish':
                  for n in files+list(guards):verify_before(f,n)
                  (p/'attempted').touch()
                  for n in [newfile,'routes/api.php']+front+['index.html']:
                      with (p/'attempted').open('a') as log:log.write(n+'\n')
                      put(f,n,read('after',n))
                  for n in files:assert get(f,n)==read('after',n),n
                  for n in guards:assert get(f,n)==read('before',n),n
                  print('V73_FTPS_BYTES_OK')
              elif mode=='rollback':
                  for n in reversed((p/'attempted').read_text().splitlines()):
                      if n==newfile:
                          if not absent(f,n):f.delete(remote(n))
                      else:put(f,n,read('before',n))
                  for n in files+list(guards):verify_before(f,n)
                  print('V73_ROLLBACK_OK')
          PY
          python /tmp/v73/transport.py prepare
          php -l /tmp/v73/after/routes/api.php
          php -l /tmp/v73/after/app/Http/Controllers/RecepcionesBorradorControlador.php
          node --check /tmp/v73/after/assets/js/compras-consultas-v66.js
          node --check /tmp/v73/after/assets/js/catalogos-api.js
      - name: Probar guardado y reapertura de borrador en interfaz aislada
        run: |
          set -euo pipefail
          mkdir -p /tmp/v73/browser
          cd /tmp/v73/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const ui=await browser.newPage({viewport:{width:1440,height:900}});
            await ui.route('**/*',route=>route.abort());
            await ui.setContent('<main id="test-root"></main>');
            await ui.addStyleTag({path:'/tmp/front67/assets/css/tipos-documentos-v63.css'});
            await ui.evaluate(()=>{
              let draft=null;
              window.RutaHDApiCatalogos=Object.freeze({
                purchaseConsultation:async()=>({data:draft?[{id:12,estado:'PENDIENTE',numero_interno:'REC-12'}]:[],total:draft?1:0,last_page:1,bodegas:[{id:1,nombre:'Bodega CI'}]}),
                documentTypes:async()=>({data:[{id:1,nombre:'Factura',familia:'FACTURA',codigo_sii:33,documento_compra:1}],last_page:1}),
                resources:async()=>({data:[{id:1,nombre:'Bodega CI',activo:1}],last_page:1}),
                orderStates:async()=>({items:[{id:1,codigo:'ACTIVA'}]}),
                purchaseOrders:async()=>({data:[{id:10,numero:'OC-CI',estado_codigo:'ACTIVA',proveedor_nombre:'Proveedor CI'}],total:1,last_page:1}),
                getPurchaseOrder:async()=>({id:10,numero:'OC-CI',estado_codigo:'ACTIVA',proveedor_nombre:'Proveedor CI',detalles:[{id:5,producto_id:7,sku:'SKU-CI',nombre:'Producto CI',cantidad:3,costo_unitario_neto:100,subtotal_neto:300}]}),
                createReceiptDraft:async p=>{if(p.detalles[0].cantidad_documentada!=='3'||p.detalles[0].cantidad_recibida!=='2'||p.detalles[0].costo_unitario_neto!=='120.1234'||p.orden_compra_id!==10)throw Error('Payload incorrecto');draft={recepcion:{id:12,orden_compra_id:10,estado:'PENDIENTE',version_borrador:1,documento_id:1,bodega_id:1,folio:p.folio,fecha_documento:p.fecha_documento,fecha_recepcion:p.fecha_recepcion,subtotal_neto:'360.00000000',total_exento:'0.00000000',otros_impuestos:'0.00000000',total_informado:'428.00000000'},detalles:p.detalles};return {id:12,mensaje:'Borrador guardado.'};},
                getReceiptDraft:async()=>draft,
                updateReceiptDraft:async(id,p)=>{if(id!==12||p.version_borrador!==1||p.detalles[0].cantidad_recibida!=='3')throw Error('Edición incorrecta');window.v73Updated=true;return {id:12,mensaje:'Borrador actualizado.'};}
              });
            });
            await ui.addScriptTag({path:'/tmp/v73/after/assets/js/compras-consultas-v66.js'});
            await ui.evaluate(()=>window.RutaHDComprasConsultas.mount(document.getElementById('test-root'),'recepciones'));
            await ui.getByRole('button',{name:'+ Nueva recepción',exact:true}).click();
            const dialog=ui.locator('dialog');
            await dialog.getByRole('button',{name:'Seleccionar orden OC-CI'}).click();
            await dialog.getByLabel('Tipo de documento',{exact:true}).selectOption('1');
            await dialog.getByLabel('Bodega de recepción',{exact:true}).selectOption('1');
            await dialog.getByLabel('Folio del documento',{exact:true}).fill('CI-1');
            await dialog.getByLabel('Fecha de emisión',{exact:true}).fill('2026-11-25');
            await dialog.getByLabel('Fecha de recepción',{exact:true}).fill('2026-11-25');
            await dialog.getByLabel('Monto neto afecto',{exact:true}).fill('360');
            await dialog.getByLabel('Total documento proveedor',{exact:true}).fill('428');
            await dialog.getByLabel('Cantidad documentada SKU-CI').fill('3');
            await dialog.getByLabel('Cantidad recibida SKU-CI').fill('2');
            await dialog.getByLabel('Costo documento SKU-CI').fill('120.1234');
            await dialog.getByRole('button',{name:'Guardar borrador',exact:true}).click();
            await dialog.waitFor({state:'detached',timeout:10000});
            await ui.getByRole('button',{name:'Modificar recepción 12'}).click();
            await ui.waitForFunction(()=>document.querySelector('dialog [aria-label="Cantidad recibida SKU-CI"]')?.value==='2');
            if(await dialog.getByLabel('Cantidad documentada SKU-CI').inputValue()!=='3')throw Error('Documento no restaurado');
            await dialog.getByLabel('Cantidad recibida SKU-CI').fill('3');
            await dialog.getByRole('button',{name:'Guardar borrador',exact:true}).click();
            await ui.waitForFunction(()=>window.v73Updated===true);
            console.log('V73_UI_OK');
          }finally{await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: rutahd-v73-respaldo-previo
          path: /tmp/v73/before/
          retention-days: 30
          if-no-files-found: error
      - name: Publicar y cotejar bytes
        run: python /tmp/v73/transport.py publish
      - name: Verificar carga y protección JWT
        run: |
          set -euo pipefail
          cd /tmp/v73/browser
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto('https://rutahyd2.free.nf/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>!!window.RutaHDComprasConsultas?.mount,null,{timeout:45000});
            const result=await page.evaluate(async()=>{
              const version=[...document.scripts].some(s=>s.src.includes('compras-consultas-v66.js?v=20261125-v73'));
              const status=(await fetch('/api/v1/inventario-consultas/kardex',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              const draft=(await fetch('/api/v1/recepciones-borrador/1',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              return {version,status,draft};
            });
            if(response?.status()!==200||!result.version||result.status!==401||result.draft!==401||errors.length)throw Error(JSON.stringify({result,errors}));
            console.log('V73_PUBLIC_OK');
          }finally{await browser.close();}
          JS
      - name: Restaurar originales si falla la publicación
        if: failure()
        run: |
          if [ -f /tmp/v73/attempted ]; then python /tmp/v73/transport.py rollback; fi
