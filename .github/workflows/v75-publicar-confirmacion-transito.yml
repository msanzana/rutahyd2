name: V75 - Publicar cierre V74B y tránsito V75
on:
  push:
    branches: [deploy/v74b-v75-confirmar-transito-20261125]
    paths: [.github/workflows/v75-publicar-confirmacion-transito.yml]
permissions: {contents: read}
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: temporal_ci_solamente
          MARIADB_DATABASE: rutahd_v75_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, intl, xml, dom, curl, pdo_mysql, openssl, fileinfo
      - name: Probar confirmación y tránsito atómicos en MariaDB aislado
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: rutahd_v75_ci
          DB_USERNAME: root
          DB_PASSWORD: temporal_ci_solamente
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: log
        run: |
          set -euo pipefail
          php -l routes/api.php
          php -l app/Http/Controllers/RecepcionesBorradorControlador.php
          composer install --no-interaction --prefer-dist --no-progress
          php artisan route:list --path=api/v1/recepciones-borrador
          php tests/recepciones_confirmacion_v75.php
      - name: Preparar cambios y respaldo FTPS
        run: |
          set -euo pipefail
          git clone -q --depth=1 --branch feature/v74b-v75-confirmar-transito-20261125 https://github.com/msanzana/rutahyd2front.git /tmp/front67
          git -C /tmp/front67 fetch -q --depth=1 origin c1a0af553be8cedbb737af7e5415ffcf1244c1a6 cbb7b42920a9327c4d2dcdea7919fe50217bc08a
          mkdir -p /tmp/v75
          cat > /tmp/v75/transport.py <<'PY'
          import os,ssl,ftplib,io,pathlib,subprocess,re,sys
          p=pathlib.Path('/tmp/v75')
          newfile=None
          back=['routes/api.php','app/Http/Controllers/RecepcionesBorradorControlador.php']
          front=['assets/js/catalogos-api.js','assets/js/compras-consultas-v66.js']
          files=back+front+['index.html']
          guards={'root.guard':'/htdocs/.htaccess','api.guard':'/htdocs/api/.htaccess','private.guard':'/htdocs/api-v2/.htaccess','gateway.guard':'/htdocs/api/index.php'}
          def remote(n):return guards.get(n,('/htdocs/api-v2/' if n in back else '/htdocs/')+n)
          def get(f,n):
              b=io.BytesIO();f.retrbinary('RETR '+remote(n),b.write);return b.getvalue()
          def absent(f,n):
              try:get(f,n);return False
              except ftplib.error_perm as e:
                  if str(e).startswith('550'):return True
                  raise
          def put(f,n,b):f.storbinary('STOR '+remote(n),io.BytesIO(b))
          def save(area,n,b):
              d=p/area/n;d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(b)
          def read(area,n):return (p/area/n).read_bytes()
          def git(repo,ref,n):return subprocess.check_output(['git','-C',repo,'show',ref+':'+n])
          def verify_before(f,n):
              if n==newfile:assert absent(f,n),n
              else:assert get(f,n)==read('before',n),n
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(os.environ['FTP_HOST']);f.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);f.prot_p()
          with f:
              mode=sys.argv[1]
              if mode=='prepare':
                  for n in files+list(guards):
                      if n==newfile:
                          assert absent(f,n),'El archivo nuevo ya existe: detener para no sobrescribir'
                          save('before','new-file-absent.txt',n.encode())
                      else:save('before',n,get(f,n))
                  for n in back+front:
                      repo=os.environ['GITHUB_WORKSPACE'] if n in back else '/tmp/front67'
                      old='170e629a0d9d03ee7eda5b41a207ef3487effd6a' if n in back else 'c1a0af553be8cedbb737af7e5415ffcf1244c1a6'
                      new='c84e3507376a27ab44b49b352ffe54b03f98027f' if n in back else 'cbb7b42920a9327c4d2dcdea7919fe50217bc08a'
                      if n==newfile or read('before',n)==git(repo,old,n):save('after',n,git(repo,new,n))
                      else:
                          save('after',n,read('before',n))
                          delta=subprocess.check_output(['git','-C',repo,'diff','--binary',old,new,'--',n])
                          assert delta.count(b'diff --git')==1,n
                          subprocess.run(['patch','--batch','--fuzz=0','-p1','-d',str(p/'after')],input=delta,check=True)
                  html=read('before','index.html').decode()
                  for n in front:
                      pattern=re.escape(n)+r'(?:\?v=[^"\s]+)?(?=["\s])'
                      matches=re.findall(pattern,html)
                      assert len(matches)==1,(n,matches)
                      html=html.replace(matches[0],n+'?v=20261125-v75',1)
                  save('after','index.html',html.encode())
                  print('V75_PRECHECK_OK')
              elif mode=='publish':
                  for n in files+list(guards):verify_before(f,n)
                  (p/'attempted').touch()
                  for n in [back[1],back[0]]+front+['index.html']:
                      with (p/'attempted').open('a') as log:log.write(n+'\n')
                      put(f,n,read('after',n))
                  for n in files:assert get(f,n)==read('after',n),n
                  for n in guards:assert get(f,n)==read('before',n),n
                  print('V75_FTPS_BYTES_OK')
              elif mode=='rollback':
                  for n in reversed((p/'attempted').read_text().splitlines()):
                      if n==newfile:
                          if not absent(f,n):f.delete(remote(n))
                      else:put(f,n,read('before',n))
                  for n in files+list(guards):verify_before(f,n)
                  print('V75_ROLLBACK_OK')
          PY
          python /tmp/v75/transport.py prepare
          php -l /tmp/v75/after/routes/api.php
          php -l /tmp/v75/after/app/Http/Controllers/RecepcionesBorradorControlador.php
          node --check /tmp/v75/after/assets/js/compras-consultas-v66.js
          node --check /tmp/v75/after/assets/js/catalogos-api.js
      - name: Probar confirmación y aceptación de descuadres en interfaz aislada
        run: |
          set -euo pipefail
          mkdir -p /tmp/v75/browser
          cd /tmp/v75/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const ui=await browser.newPage({viewport:{width:1440,height:900}});
            await ui.route('**/*',route=>route.abort());
            await ui.setContent('<main id="test-root"></main>');
            await ui.addStyleTag({path:'/tmp/front67/assets/css/tipos-documentos-v63.css'});
            await ui.evaluate(()=>{
              let active=true;
              window.RutaHDApiCatalogos=Object.freeze({
                purchaseConsultation:async()=>({data:[{id:12,estado:active?'PENDIENTE':'DESCUADRADA',numero_interno:'REC-12'}],total:1,last_page:1,bodegas:[{id:1,nombre:'Bodega CI'}]}),
                getReceiptDraft:async()=>({recepcion:{id:12,estado:active?'PENDIENTE':'DESCUADRADA',numero_interno:'REC-12',version_borrador:3,folio:'CI-1',fecha_recepcion:'2026-11-25'},detalles:[{producto_id:5,cantidad_documentada:'3',cantidad_recibida:'2',cantidad_aceptada:'2',costo_unitario_neto:'100'}],diferencias:[{tipo_diferencia:'FALTANTE',cantidad_diferencia:'1',motivo:'Cantidad física distinta del documento.',estado_resolucion:'ABIERTA'}]}),
                reviewReceiptDraft:async()=>({id:12,numero_interno:'REC-12',version_borrador:2,cierre_habilitado:true,huella_revision:'a'.repeat(64),resultado_previsto:'DESCUADRADA',diferencias:[{tipo:'FALTANTE',producto:'Producto CI',cantidad_diferencia:'1',motivo:'Cantidad física distinta del documento.'}],lineas:[{sku:'SKU-CI',nombre:'Producto CI',cantidad_documentada:'3',cantidad_recibida:'2',costo_oc:'100',costo_unitario_neto:'100'}],saldos_oc:[{detalle_orden_compra_id:5,cantidad_pendiente:'1'}]}),
                confirmReceiptDraft:async(id,p)=>{if(id!==12||p.version_borrador!==2||p.huella_revision!=='a'.repeat(64)||!p.aceptar_diferencias||p.motivo!=='Motivo CI'||!/^[a-f0-9-]{36}$/.test(p.token_confirmacion))throw Error('Confirmación incorrecta');active=false;window.v75Confirmed=true;return {mensaje:'Recepción confirmada como DESCUADRADA.'};}
              });
            });
            await ui.addScriptTag({path:'/tmp/v75/after/assets/js/compras-consultas-v66.js'});
            await ui.evaluate(()=>window.RutaHDComprasConsultas.mount(document.getElementById('test-root'),'recepciones'));
            await ui.getByRole('button',{name:'Revisar diferencias 12'}).click();
            const dialog=ui.locator('dialog');
            await dialog.getByText('Resultado previsto: Descuadrada',{exact:true}).waitFor();
            await dialog.getByRole('button',{name:'Confirmar recepción',exact:true}).click();
            await dialog.getByText('Acepte las diferencias e indique el motivo para continuar.',{exact:true}).waitFor();
            await dialog.getByLabel('Acepto guardar la recepción descuadrada',{exact:true}).check();
            await dialog.getByLabel('Motivo de aceptación de diferencias',{exact:true}).fill('Motivo CI');
            await dialog.getByRole('button',{name:'Confirmar recepción',exact:true}).click();
            await dialog.waitFor({state:'detached'});
            await ui.waitForFunction(()=>window.v75Confirmed===true);
            await ui.getByRole('button',{name:'Ver recepción 12'}).click();
            await dialog.getByText('Diferencias registradas',{exact:true}).waitFor();
            await dialog.getByText('FALTANTE',{exact:true}).waitFor();
            if(await ui.getByRole('button',{name:'Anular recepción 12'}).count())throw Error('Anulación disponible tras cierre');
            console.log('V75_UI_OK');
          }finally{await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: rutahd-v75-respaldo-previo
          path: /tmp/v75/before/
          retention-days: 30
          if-no-files-found: error
      - name: Publicar y cotejar bytes
        run: python /tmp/v75/transport.py publish
      - name: Verificar carga y protección JWT
        run: |
          set -euo pipefail
          cd /tmp/v75/browser
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto('https://rutahyd2.free.nf/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>!!window.RutaHDComprasConsultas?.mount,null,{timeout:45000});
            const result=await page.evaluate(async()=>{
              const version=[...document.scripts].some(s=>s.src.includes('compras-consultas-v66.js?v=20261125-v75'));
              const status=(await fetch('/api/v1/inventario-consultas/kardex',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              const draft=(await fetch('/api/v1/recepciones-borrador/1',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              const revision=(await fetch('/api/v1/recepciones-borrador/1/revision',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              const cancel=(await fetch('/api/v1/recepciones-borrador/1/anular',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:'{}',cache:'no-store'})).status;
              const confirm=(await fetch('/api/v1/recepciones-borrador/1/confirmar',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:'{}',cache:'no-store'})).status;
              return {version,status,draft,revision,cancel,confirm};
            });
            if(response?.status()!==200||!result.version||result.status!==401||result.draft!==401||result.revision!==401||result.cancel!==401||result.confirm!==401||errors.length)throw Error(JSON.stringify({result,errors}));
            console.log('V75_PUBLIC_OK');
          }finally{await browser.close();}
          JS
      - name: Restaurar originales si falla la publicación
        if: failure()
        run: |
          if [ -f /tmp/v75/attempted ]; then python /tmp/v75/transport.py rollback; fi
