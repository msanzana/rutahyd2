name: V77 - Publicar consolidación V76 y CPP V77
on:
  push:
    branches: [deploy/v76-v77-consolidacion-cpp-20261125]
    paths: [.github/workflows/v77-publicar-consolidacion-cpp.yml]
permissions: {contents: read}
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: temporal_ci_solamente
          MARIADB_DATABASE: rutahd_v77_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, intl, xml, dom, curl, pdo_mysql, openssl, fileinfo
      - name: Probar consolidación, CPP y rollback en MariaDB aislado
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: rutahd_v77_ci
          DB_USERNAME: root
          DB_PASSWORD: temporal_ci_solamente
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: log
        run: |
          set -euo pipefail
          php -l routes/api.php
          php -l app/Http/Controllers/ConsolidacionesControlador.php
          php -l app/Services/CostoPromedioPonderado.php
          composer install --no-interaction --prefer-dist --no-progress
          php artisan route:list --path=api/v1/consolidaciones-recepcion
          php tests/consolidaciones_cpp_v77.php
      - name: Preparar cambios y respaldo FTPS
        run: |
          set -euo pipefail
          git clone -q --depth=1 --branch feature/v76-v77-consolidacion-cpp-20261125 https://github.com/msanzana/rutahyd2front.git /tmp/front67
          git -C /tmp/front67 fetch -q --depth=1 origin cbb7b42920a9327c4d2dcdea7919fe50217bc08a d15381ad8dc853e0d95a07e0c2c331063358fe81
          mkdir -p /tmp/v77
          cat > /tmp/v77/transport.py <<'PY'
          import os,ssl,ftplib,io,pathlib,subprocess,re,sys
          p=pathlib.Path('/tmp/v77')
          newfile='app/Http/Controllers/ConsolidacionesControlador.php'
          back=['routes/api.php',newfile,'app/Services/CostoPromedioPonderado.php']
          front=['assets/js/catalogos-api.js','assets/js/compras-consultas-v66.js']
          files=back+front+['index.html']
          guards={'root.guard':'/htdocs/.htaccess','api.guard':'/htdocs/api/.htaccess','private.guard':'/htdocs/api-v2/.htaccess','gateway.guard':'/htdocs/api/index.php'}
          def remote(n):return guards.get(n,('/htdocs/api-v2/' if n in back else '/htdocs/')+n)
          def get(f,n):
              b=io.BytesIO();f.retrbinary('RETR '+remote(n),b.write);return b.getvalue()
          def absent(f,n):
              try:get(f,n);return False
              except ftplib.error_perm as e:
                  if str(e).startswith('550'):return True
                  raise
          def put(f,n,b):f.storbinary('STOR '+remote(n),io.BytesIO(b))
          def save(area,n,b):
              d=p/area/n;d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(b)
          def read(area,n):return (p/area/n).read_bytes()
          def git(repo,ref,n):return subprocess.check_output(['git','-C',repo,'show',ref+':'+n])
          def verify_before(f,n):
              if n==newfile:assert absent(f,n),n
              else:assert get(f,n)==read('before',n),n
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(os.environ['FTP_HOST']);f.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);f.prot_p()
          with f:
              mode=sys.argv[1]
              if mode=='prepare':
                  for n in files+list(guards):
                      if n==newfile:
                          assert absent(f,n),'El archivo nuevo ya existe: detener para no sobrescribir'
                          save('before','new-file-absent.txt',n.encode())
                      else:save('before',n,get(f,n))
                  for n in back+front:
                      repo=os.environ['GITHUB_WORKSPACE'] if n in back else '/tmp/front67'
                      old='a260b6ae0659665adf8374b63354dbdce0d60754' if n in back else 'cbb7b42920a9327c4d2dcdea7919fe50217bc08a'
                      new='d0d2bccc776c28fd03c5d8169504f1f2659d083a' if n in back else 'd15381ad8dc853e0d95a07e0c2c331063358fe81'
                      if n==newfile or read('before',n)==git(repo,old,n):save('after',n,git(repo,new,n))
                      else:
                          save('after',n,read('before',n))
                          delta=subprocess.check_output(['git','-C',repo,'diff','--binary',old,new,'--',n])
                          assert delta.count(b'diff --git')==1,n
                          subprocess.run(['patch','--batch','--fuzz=0','-p1','-d',str(p/'after')],input=delta,check=True)
                  html=read('before','index.html').decode()
                  for n in front:
                      pattern=re.escape(n)+r'(?:\?v=[^"\s]+)?(?=["\s])'
                      matches=re.findall(pattern,html)
                      assert len(matches)==1,(n,matches)
                      html=html.replace(matches[0],n+'?v=20261125-v77',1)
                  save('after','index.html',html.encode())
                  print('V77_PRECHECK_OK')
              elif mode=='publish':
                  for n in files+list(guards):verify_before(f,n)
                  (p/'attempted').touch()
                  for n in [newfile,back[2],back[0]]+front+['index.html']:
                      with (p/'attempted').open('a') as log:log.write(n+'\n')
                      put(f,n,read('after',n))
                  for n in files:assert get(f,n)==read('after',n),n
                  for n in guards:assert get(f,n)==read('before',n),n
                  print('V77_FTPS_BYTES_OK')
              elif mode=='rollback':
                  for n in reversed((p/'attempted').read_text().splitlines()):
                      if n==newfile:
                          if not absent(f,n):f.delete(remote(n))
                      else:put(f,n,read('before',n))
                  for n in files+list(guards):verify_before(f,n)
                  print('V77_ROLLBACK_OK')
          PY
          python /tmp/v77/transport.py prepare
          php -l /tmp/v77/after/routes/api.php
          php -l /tmp/v77/after/app/Http/Controllers/ConsolidacionesControlador.php
          php -l /tmp/v77/after/app/Services/CostoPromedioPonderado.php
          node --check /tmp/v77/after/assets/js/compras-consultas-v66.js
          node --check /tmp/v77/after/assets/js/catalogos-api.js
      - name: Probar consolidación, guardado y cierre en interfaz aislada
        run: |
          set -euo pipefail
          mkdir -p /tmp/v77/browser
          cd /tmp/v77/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const ui=await browser.newPage({viewport:{width:1440,height:900}});
            await ui.route('**/*',route=>route.abort());
            await ui.setContent('<main id="test-root"></main>');
            await ui.addStyleTag({path:'/tmp/front67/assets/css/tipos-documentos-v63.css'});
            await ui.evaluate(()=>{
              let saved=false,closed=false;
              const order={id:4,numero:'OC-CI-4',estado_codigo:'ACTIVA',proveedor_nombre:'Proveedor CI',solicitada_en:'2026-11-25'};
              const rec=[{id:12,numero_interno:'REC-12',folio:'CI-1',bodega_id:1,bodega:'Bodega CI',estado:'RECEPCIONADA',total:'238'},{id:13,numero_interno:'REC-13',folio:'CI-2',bodega_id:1,bodega:'Bodega CI',estado:'RECEPCIONADA',total:'119'}];
              const response=()=>({orden:order,estado:closed?'CONSOLIDADA':'ACTIVA',consolidacion:{id:22,numero_interno:'CON-22',observaciones:'CI'},recepciones:rec,candidatas:rec,productos:[{sku:'SKU-CI',nombre:'Producto CI',cantidad_documentada:'3',cantidad_recibida:'3',cantidad_aceptada:'3',costo_unitario_neto_ponderado:'100',total:'357'}],saldos_oc:[],diferencias:[],bloqueos:[],cierre_habilitado:!closed,huella:'a'.repeat(64)});
              window.RutaHDApiCatalogos=Object.freeze({
                purchaseConsultation:async()=>({data:saved?[{id:22,numero_interno:'CON-22',estado:closed?'CONSOLIDADA':'ACTIVA'}]:[],total:saved?1:0,last_page:1,bodegas:[{id:1,nombre:'Bodega CI'}]}),
                orderStates:async()=>({items:[{id:1,codigo:'ACTIVA'}]}),
                purchaseOrders:async()=>({data:[order],total:1,last_page:1}),
                consolidationCandidates:async id=>({orden:order,recepciones:rec,otras_recepciones:[]}),
                createConsolidation:async p=>{if(p.orden_compra_id!==4||p.recepciones.length!==2||p.observaciones!=='CI')throw Error('Guardado incorrecto');saved=true;return{id:22,mensaje:'Consolidación guardada.'};},
                getConsolidation:async()=>response(),
                confirmConsolidation:async(id,p)=>{if(id!==22||p.huella!=='a'.repeat(64)||!/^[a-f0-9-]{36}$/.test(p.token_confirmacion))throw Error('Confirmación incorrecta');closed=true;window.v77Closed=true;return {mensaje:'Consolidación confirmada.'};}
              });
            });
            await ui.addScriptTag({path:'/tmp/v77/after/assets/js/compras-consultas-v66.js'});
            await ui.evaluate(()=>window.RutaHDComprasConsultas.mount(document.getElementById('test-root'),'consolidaciones'));
            await ui.getByRole('button',{name:'+ Nueva consolidación',exact:true}).click();
            const d=ui.locator('dialog');
            await d.getByRole('button',{name:'Seleccionar orden OC-CI-4'}).click();
            await d.getByLabel('Incluir recepción REC-12',{exact:true}).check();
            await d.getByLabel('Incluir recepción REC-13',{exact:true}).check();
            await d.getByLabel('Observaciones',{exact:true}).fill('CI');
            await d.getByRole('button',{name:'Guardar',exact:true}).click();
            await d.getByText('Productos consolidados',{exact:true}).waitFor();
            await d.getByRole('button',{name:'Confirmar consolidación',exact:true}).click();
            await d.waitFor({state:'detached'});
            await ui.waitForFunction(()=>window.v77Closed===true);
            await ui.getByRole('button',{name:'Ver consolidación 22'}).click();
            await d.getByText('Productos consolidados',{exact:true}).waitFor();
            if(await d.getByRole('button',{name:'Confirmar consolidación',exact:true}).isVisible())throw Error('Cierre repetible desde interfaz');
            console.log('V77_UI_OK');
          }finally{await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: rutahd-v77-respaldo-previo
          path: /tmp/v77/before/
          retention-days: 30
          if-no-files-found: error
      - name: Publicar y cotejar bytes
        run: python /tmp/v77/transport.py publish
      - name: Verificar carga y protección JWT
        run: |
          set -euo pipefail
          cd /tmp/v77/browser
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto('https://rutahyd2.free.nf/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>!!window.RutaHDComprasConsultas?.mount,null,{timeout:45000});
            const result=await page.evaluate(async()=>{
              const version=[...document.scripts].some(s=>s.src.includes('compras-consultas-v66.js?v=20261125-v77'));
              const status=(await fetch('/api/v1/inventario-consultas/kardex',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              const draft=(await fetch('/api/v1/recepciones-borrador/1',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              const revision=(await fetch('/api/v1/recepciones-borrador/1/revision',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              const cancel=(await fetch('/api/v1/recepciones-borrador/1/anular',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:'{}',cache:'no-store'})).status;
              const confirm=(await fetch('/api/v1/recepciones-borrador/1/confirmar',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:'{}',cache:'no-store'})).status;
              const consolidation=(await fetch('/api/v1/consolidaciones-recepcion/1',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              const close=(await fetch('/api/v1/consolidaciones-recepcion/1/confirmar',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:'{}',cache:'no-store'})).status;
              return {version,status,draft,revision,cancel,confirm,consolidation,close};
            });
            if(response?.status()!==200||!result.version||result.status!==401||result.draft!==401||result.revision!==401||result.cancel!==401||result.confirm!==401||result.consolidation!==401||result.close!==401||errors.length)throw Error(JSON.stringify({result,errors}));
            console.log('V77_PUBLIC_OK');
          }finally{await browser.close();}
          JS
      - name: Restaurar originales si falla la publicación
        if: failure()
        run: |
          if [ -f /tmp/v77/attempted ]; then python /tmp/v77/transport.py rollback; fi
