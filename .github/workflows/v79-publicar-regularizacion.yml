name: V79 - Publicar regularización V78 y correo V79
on:
  push:
    branches: [deploy/v78-v79-regularizacion-20261125]
    paths: [.github/workflows/v79-publicar-regularizacion.yml]
permissions: {contents: read}
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: temporal_ci_solamente
          MARIADB_DATABASE: rutahd_v79_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, intl, xml, dom, curl, pdo_mysql, openssl, fileinfo
      - name: Probar regularización y correo log en MariaDB aislado
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: rutahd_v79_ci
          DB_USERNAME: root
          DB_PASSWORD: temporal_ci_solamente
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: log
        run: |
          set -euo pipefail
          php -l routes/api.php
          php -l app/Http/Controllers/ConsolidacionesControlador.php
          php -l app/Services/RegularizacionRecepcion.php
          php -l app/Http/Controllers/ComprasConsultasControlador.php
          composer install --no-interaction --prefer-dist --no-progress
          php artisan route:list --path=api/v1/consolidaciones-recepcion
          php tests/regularizacion_correo_v79.php
      - name: Preparar cambios y respaldo FTPS
        run: |
          set -euo pipefail
          git clone -q --depth=1 --branch feature/v78-v79-regularizacion-20261125 https://github.com/msanzana/rutahyd2front.git /tmp/front67
          git -C /tmp/front67 fetch -q --depth=1 origin d15381ad8dc853e0d95a07e0c2c331063358fe81 6ed07aea542e2d8322af56ce4c1f455f3be56796
          mkdir -p /tmp/v79
          cat > /tmp/v79/transport.py <<'PY'
          import os,ssl,ftplib,io,pathlib,subprocess,re,sys
          p=pathlib.Path('/tmp/v79')
          newfile='app/Services/RegularizacionRecepcion.php'
          back=['routes/api.php',newfile,'app/Http/Controllers/ConsolidacionesControlador.php','app/Http/Controllers/ComprasConsultasControlador.php']
          front=['assets/js/catalogos-api.js','assets/js/compras-consultas-v66.js']
          files=back+front+['index.html']
          guards={'root.guard':'/htdocs/.htaccess','api.guard':'/htdocs/api/.htaccess','private.guard':'/htdocs/api-v2/.htaccess','gateway.guard':'/htdocs/api/index.php'}
          def remote(n):return guards.get(n,('/htdocs/api-v2/' if n in back else '/htdocs/')+n)
          def get(f,n):
              b=io.BytesIO();f.retrbinary('RETR '+remote(n),b.write);return b.getvalue()
          def absent(f,n):
              try:get(f,n);return False
              except ftplib.error_perm as e:
                  if str(e).startswith('550'):return True
                  raise
          def put(f,n,b):f.storbinary('STOR '+remote(n),io.BytesIO(b))
          def save(area,n,b):
              d=p/area/n;d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(b)
          def read(area,n):return (p/area/n).read_bytes()
          def git(repo,ref,n):return subprocess.check_output(['git','-C',repo,'show',ref+':'+n])
          def verify_before(f,n):
              if n==newfile:assert absent(f,n),n
              else:assert get(f,n)==read('before',n),n
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(os.environ['FTP_HOST']);f.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);f.prot_p()
          with f:
              mode=sys.argv[1]
              if mode=='prepare':
                  for n in files+list(guards):
                      if n==newfile:
                          assert absent(f,n),'El archivo nuevo ya existe: detener para no sobrescribir'
                          save('before','new-file-absent.txt',n.encode())
                      else:save('before',n,get(f,n))
                  for n in back+front:
                      repo=os.environ['GITHUB_WORKSPACE'] if n in back else '/tmp/front67'
                      old='f265dcf84526a9c22eccb63dcf2c4fba1ef16b53' if n in back else 'd15381ad8dc853e0d95a07e0c2c331063358fe81'
                      new='2c1064a6f774c5bcdec3173e9ccdc3d6d80daa42' if n in back else '6ed07aea542e2d8322af56ce4c1f455f3be56796'
                      if n==newfile or read('before',n)==git(repo,old,n):save('after',n,git(repo,new,n))
                      else:
                          save('after',n,read('before',n))
                          delta=subprocess.check_output(['git','-C',repo,'diff','--binary',old,new,'--',n])
                          assert delta.count(b'diff --git')==1,n
                          subprocess.run(['patch','--batch','--fuzz=0','-p1','-d',str(p/'after')],input=delta,check=True)
                  html=read('before','index.html').decode()
                  for n in front:
                      pattern=re.escape(n)+r'(?:\?v=[^"\s]+)?(?=["\s])'
                      matches=re.findall(pattern,html)
                      assert len(matches)==1,(n,matches)
                      html=html.replace(matches[0],n+'?v=20261125-v79',1)
                  save('after','index.html',html.encode())
                  print('V79_PRECHECK_OK')
              elif mode=='publish':
                  for n in files+list(guards):verify_before(f,n)
                  (p/'attempted').touch()
                  for n in [newfile,back[2],back[3],back[0]]+front+['index.html']:
                      with (p/'attempted').open('a') as log:log.write(n+'\n')
                      put(f,n,read('after',n))
                  for n in files:assert get(f,n)==read('after',n),n
                  for n in guards:assert get(f,n)==read('before',n),n
                  print('V79_FTPS_BYTES_OK')
              elif mode=='rollback':
                  for n in reversed((p/'attempted').read_text().splitlines()):
                      if n==newfile:
                          if not absent(f,n):f.delete(remote(n))
                      else:put(f,n,read('before',n))
                  for n in files+list(guards):verify_before(f,n)
                  print('V79_ROLLBACK_OK')
          PY
          python /tmp/v79/transport.py prepare
          php -l /tmp/v79/after/routes/api.php
          php -l /tmp/v79/after/app/Http/Controllers/ConsolidacionesControlador.php
          php -l /tmp/v79/after/app/Services/RegularizacionRecepcion.php
          php -l /tmp/v79/after/app/Http/Controllers/ComprasConsultasControlador.php
          node --check /tmp/v79/after/assets/js/compras-consultas-v66.js
          node --check /tmp/v79/after/assets/js/catalogos-api.js
      - name: Probar cierre descuadrado y solicitudes en interfaz aislada
        run: |
          set -euo pipefail
          mkdir -p /tmp/v79/browser
          cd /tmp/v79/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const ui=await browser.newPage({viewport:{width:1440,height:900}});
            await ui.route('**/*',route=>route.abort());
            await ui.setContent('<main id="test-root"></main>');
            await ui.addStyleTag({path:'/tmp/front67/assets/css/tipos-documentos-v63.css'});
            await ui.evaluate(()=>{
              let closed=false,sent=false;
              const order={id:4,numero:'OC-CI-4',estado_codigo:'ACTIVA'};
              const rec=[{id:12,numero_interno:'REC-12',folio:'CI-1',bodega_id:1,bodega:'Bodega CI',estado:'DESCUADRADA',total:'238'}];
              const response=()=>({orden:order,estado:closed?'CONSOLIDADA':'ACTIVA',consolidacion:{id:22,numero_interno:'CON-22',observaciones:'CI'},recepciones:rec,candidatas:rec,productos:[{sku:'SKU-CI',nombre:'Producto CI',cantidad_documentada:'2',cantidad_recibida:'1',cantidad_aceptada:'1',costo_unitario_neto_ponderado:'100',total:'119'}],saldos_oc:[],diferencias:[{tipo_diferencia:'FALTANTE',cantidad_diferencia:'1',motivo:'Faltante CI'}],bloqueos:[],cierre_habilitado:!closed,requiere_aceptacion:true,huella:'a'.repeat(64),solicitudes:closed?[{id:9,numero_interno:'SOL-9',tipo_solicitud:'NC',monto_total:'119',notificacion_id:11,estado_correo:sent?'ENVIADA':'ERROR',ultimo_error:sent?null:'Correo no confirmado'}]:[]});
              window.RutaHDApiCatalogos=Object.freeze({
                purchaseConsultation:async()=>({data:[{id:22,numero_interno:'CON-22',estado:closed?'CONSOLIDADA':'ACTIVA',solicitudes_count:closed?1:0}],total:1,last_page:1,bodegas:[{id:1,nombre:'Bodega CI'}]}),
                getConsolidation:async()=>response(),
                confirmConsolidation:async(id,p)=>{if(id!==22||p.huella!=='a'.repeat(64)||!p.aceptar_diferencias||p.motivo!=='Motivo CI')throw Error('Confirmación incorrecta');closed=true;window.v79Closed=true;return {mensaje:'Consolidación confirmada.'};},
                regularizationPdf:async id=>{if(id!==9)throw Error('PDF incorrecto');return new Blob(['%PDF-1.4\n'],{type:'application/pdf'});},
                retryRegularizationMail:async(id,p)=>{if(id!==11||!p.verificar_envio)throw Error('Reintento incorrecto');sent=true;return {mensaje:'Estado de envío: ENVIADA'};}
              });
            });
            await ui.addScriptTag({path:'/tmp/v79/after/assets/js/compras-consultas-v66.js'});
            await ui.evaluate(()=>window.RutaHDComprasConsultas.mount(document.getElementById('test-root'),'consolidaciones'));
            await ui.getByRole('button',{name:'Modificar consolidación 22'}).click();
            const d=ui.locator('dialog');
            await d.getByText('Productos consolidados',{exact:true}).waitFor();
            await d.getByRole('button',{name:'Confirmar consolidación',exact:true}).click();
            await d.getByText('Acepte las diferencias e indique el motivo del cierre.',{exact:true}).waitFor();
            await d.getByLabel('Acepto cerrar con diferencias y solicitar regularización',{exact:true}).check();
            await d.getByLabel('Motivo del cierre con diferencias',{exact:true}).fill('Motivo CI');
            await d.getByRole('button',{name:'Confirmar consolidación',exact:true}).click();
            await d.waitFor({state:'detached'});
            await ui.waitForFunction(()=>window.v79Closed===true);
            await ui.getByRole('button',{name:'Solicitudes 22'}).click();
            await d.getByText('SOL-9 · Nota de crédito',{exact:true}).waitFor();
            await d.getByRole('button',{name:'Ver PDF 9'}).click();
            await d.getByText('Descargar PDF',{exact:true}).waitFor();
            await d.getByLabel('Verifiqué que el proveedor no recibió este correo',{exact:true}).check();
            await d.getByRole('button',{name:'Enviar correo',exact:true}).click();
            await d.getByText('Estado de envío: ENVIADA',{exact:true}).waitFor();
            console.log('V79_UI_OK');
          }finally{await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: rutahd-v79-respaldo-previo
          path: /tmp/v79/before/
          retention-days: 30
          if-no-files-found: error
      - name: Publicar y cotejar bytes
        run: python /tmp/v79/transport.py publish
      - name: Verificar carga y protección JWT
        run: |
          set -euo pipefail
          cd /tmp/v79/browser
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto('https://rutahyd2.free.nf/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>!!window.RutaHDComprasConsultas?.mount,null,{timeout:45000});
            const result=await page.evaluate(async()=>{
              const version=[...document.scripts].some(s=>s.src.includes('compras-consultas-v66.js?v=20261125-v79'));
              const status=(await fetch('/api/v1/inventario-consultas/kardex',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              const draft=(await fetch('/api/v1/recepciones-borrador/1',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              const revision=(await fetch('/api/v1/recepciones-borrador/1/revision',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              const cancel=(await fetch('/api/v1/recepciones-borrador/1/anular',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:'{}',cache:'no-store'})).status;
              const confirm=(await fetch('/api/v1/recepciones-borrador/1/confirmar',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:'{}',cache:'no-store'})).status;
              const consolidation=(await fetch('/api/v1/consolidaciones-recepcion/1',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              const close=(await fetch('/api/v1/consolidaciones-recepcion/1/confirmar',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:'{}',cache:'no-store'})).status;
              const pdf=(await fetch('/api/v1/solicitudes-regularizacion/1/pdf',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              const retry=(await fetch('/api/v1/notificaciones-regularizacion/1/reenviar',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:'{}',cache:'no-store'})).status;
              return {version,status,draft,revision,cancel,confirm,consolidation,close,pdf,retry};
            });
            if(response?.status()!==200||!result.version||result.status!==401||result.draft!==401||result.revision!==401||result.cancel!==401||result.confirm!==401||result.consolidation!==401||result.close!==401||result.pdf!==401||result.retry!==401||errors.length)throw Error(JSON.stringify({result,errors}));
            console.log('V79_PUBLIC_OK');
          }finally{await browser.close();}
          JS
      - name: Restaurar originales si falla la publicación
        if: failure()
        run: |
          if [ -f /tmp/v79/attempted ]; then python /tmp/v79/transport.py rollback; fi
