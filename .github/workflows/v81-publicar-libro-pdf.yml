name: V81 - Publicar libro V80 y documentos PDF V81
on:
  push:
    branches: [deploy/v80-v81-libro-pdf-20261125]
    paths: [.github/workflows/v81-publicar-libro-pdf.yml]
permissions: {contents: read}
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: temporal_ci_solamente
          MARIADB_DATABASE: rutahd_v81_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, intl, xml, dom, curl, pdo_mysql, openssl, fileinfo
      - name: Probar libro y PDFs en MariaDB aislado
        env:
          APP_ENV: testing
          APP_DEBUG: 'false'
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: rutahd_v81_ci
          DB_USERNAME: root
          DB_PASSWORD: temporal_ci_solamente
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: log
        run: |
          set -euo pipefail
          php -l routes/api.php
          php -l app/Http/Controllers/ConsolidacionesControlador.php
          php -l app/Services/LibroComprasInterno.php
          php -l app/Services/PdfRecepcionCompra.php
          php -l app/Http/Controllers/RecepcionesBorradorControlador.php
          php -l app/Http/Controllers/ComprasConsultasControlador.php
          composer install --no-interaction --prefer-dist --no-progress
          php artisan route:list --path=api/v1/consolidaciones-recepcion
          php tests/libro_pdf_v81.php
          command -v pdfinfo >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          pdfinfo /tmp/v81-recepcion.pdf
          pdfinfo /tmp/v81-consolidacion.pdf
          pdftotext /tmp/v81-consolidacion.pdf /tmp/v81-consolidacion.txt
          grep -F 'CI-5-2' /tmp/v81-consolidacion.txt
          grep -F 'SOL-' /tmp/v81-consolidacion.txt
      - name: Preparar cambios y respaldo FTPS
        run: |
          set -euo pipefail
          git clone -q --depth=1 --branch feature/v80-v81-libro-pdf-20261125 https://github.com/msanzana/rutahyd2front.git /tmp/front67
          git -C /tmp/front67 fetch -q --depth=1 origin 864f9526af4880eb01bf036f6fe514c0f26f96ad 001f09b14d10cc34c246cf75e5f22b95c126cbe3
          mkdir -p /tmp/v81
          cat > /tmp/v81/transport.py <<'PY'
          import os,ssl,ftplib,io,pathlib,subprocess,re,sys
          p=pathlib.Path('/tmp/v81')
          newfiles=['app/Services/LibroComprasInterno.php','app/Services/PdfRecepcionCompra.php']
          back=['routes/api.php','app/Http/Controllers/RecepcionesBorradorControlador.php','app/Http/Controllers/ConsolidacionesControlador.php','app/Http/Controllers/ComprasConsultasControlador.php']+newfiles
          front=['assets/js/catalogos-api.js','assets/js/compras-consultas-v66.js']
          files=back+front+['index.html']
          guards={'root.guard':'/htdocs/.htaccess','api.guard':'/htdocs/api/.htaccess','private.guard':'/htdocs/api-v2/.htaccess','gateway.guard':'/htdocs/api/index.php'}
          def remote(n):return guards.get(n,('/htdocs/api-v2/' if n in back else '/htdocs/')+n)
          def get(f,n):
              b=io.BytesIO();f.retrbinary('RETR '+remote(n),b.write);return b.getvalue()
          def absent(f,n):
              try:get(f,n);return False
              except ftplib.error_perm as e:
                  if str(e).startswith('550'):return True
                  raise
          def put(f,n,b):f.storbinary('STOR '+remote(n),io.BytesIO(b))
          def save(area,n,b):
              d=p/area/n;d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(b)
          def read(area,n):return (p/area/n).read_bytes()
          def git(repo,ref,n):return subprocess.check_output(['git','-C',repo,'show',ref+':'+n])
          def verify_before(f,n):
              if n in newfiles:assert absent(f,n),n
              else:assert get(f,n)==read('before',n),n
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(os.environ['FTP_HOST']);f.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);f.prot_p()
          with f:
              mode=sys.argv[1]
              if mode=='prepare':
                  for n in files+list(guards):
                      if n in newfiles:
                          assert absent(f,n),'El archivo nuevo ya existe: detener para no sobrescribir'
                          save('before','absent-'+pathlib.Path(n).name+'.txt',n.encode())
                      else:save('before',n,get(f,n))
                  for n in back+front:
                      repo=os.environ['GITHUB_WORKSPACE'] if n in back else '/tmp/front67'
                      old='61e90ebe5997b3451f10cf30d498c1e2ebaece45' if n in back else '864f9526af4880eb01bf036f6fe514c0f26f96ad'
                      new='41c0f424c6bd996ae2fb9e4623ab1218588598e5' if n in back else '001f09b14d10cc34c246cf75e5f22b95c126cbe3'
                      if n in newfiles or read('before',n)==git(repo,old,n):save('after',n,git(repo,new,n))
                      else:
                          save('after',n,read('before',n))
                          delta=subprocess.check_output(['git','-C',repo,'diff','--binary',old,new,'--',n])
                          assert delta.count(b'diff --git')==1,n
                          subprocess.run(['patch','--batch','--fuzz=0','-p1','-d',str(p/'after')],input=delta,check=True)
                  html=read('before','index.html').decode()
                  for n in front:
                      pattern=re.escape(n)+r'(?:\?v=[^"\s]+)?(?=["\s])'
                      matches=re.findall(pattern,html)
                      assert len(matches)==1,(n,matches)
                      html=html.replace(matches[0],n+'?v=20261125-v81',1)
                  save('after','index.html',html.encode())
                  print('V81_PRECHECK_OK')
              elif mode=='publish':
                  for n in files+list(guards):verify_before(f,n)
                  (p/'attempted').touch()
                  for n in newfiles+[back[1],back[2],back[3],back[0]]+front+['index.html']:
                      with (p/'attempted').open('a') as log:log.write(n+'\n')
                      put(f,n,read('after',n))
                  for n in files:assert get(f,n)==read('after',n),n
                  for n in guards:assert get(f,n)==read('before',n),n
                  print('V81_FTPS_BYTES_OK')
              elif mode=='rollback':
                  for n in reversed((p/'attempted').read_text().splitlines()):
                      if n in newfiles:
                          if not absent(f,n):f.delete(remote(n))
                      else:put(f,n,read('before',n))
                  for n in files+list(guards):verify_before(f,n)
                  print('V81_ROLLBACK_OK')
          PY
          python /tmp/v81/transport.py prepare
          php -l /tmp/v81/after/routes/api.php
          php -l /tmp/v81/after/app/Http/Controllers/ConsolidacionesControlador.php
          php -l /tmp/v81/after/app/Services/LibroComprasInterno.php
          php -l /tmp/v81/after/app/Services/PdfRecepcionCompra.php
          php -l /tmp/v81/after/app/Http/Controllers/RecepcionesBorradorControlador.php
          php -l /tmp/v81/after/app/Http/Controllers/ComprasConsultasControlador.php
          node --check /tmp/v81/after/assets/js/compras-consultas-v66.js
          node --check /tmp/v81/after/assets/js/catalogos-api.js
      - name: Probar iconos PDF y conservar solicitudes en interfaz aislada
        run: |
          set -euo pipefail
          mkdir -p /tmp/v81/browser
          cd /tmp/v81/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import {readFileSync} from 'node:fs';
          const browser=await chromium.launch({headless:true});
          try{
            const ui=await browser.newPage({acceptDownloads:true,viewport:{width:1440,height:900}});
            const errors=[];ui.on('pageerror',e=>errors.push(e.message));
            await ui.route('**/*',route=>route.abort());
            await ui.setContent('<main id="test-root"></main>');
            await ui.addStyleTag({path:'/tmp/front67/assets/css/tipos-documentos-v63.css'});
            await ui.evaluate(({rec,con})=>{
              window.RutaHDApiCatalogos=Object.freeze({
                purchaseConsultation:async key=>({data:key==='recepciones'?[{id:12,estado:'RECEPCIONADA',numero_interno:'REC-12'},{id:13,estado:'PENDIENTE',numero_interno:'REC-13'}]:[{id:22,estado:'CONSOLIDADA',numero_interno:'CON-22',solicitudes_count:1}],total:key==='recepciones'?2:1,last_page:1,bodegas:[{id:1,nombre:'Bodega CI'}]}),
                operationalPurchasePdf:async(kind,id)=>{if((kind==='recepcion'&&![12,13].includes(id))||(kind==='consolidacion'&&id!==22))throw Error('Documento incorrecto');window.lastPdf={kind,id};return new Blob([new Uint8Array(kind==='recepcion'?rec:con)],{type:'application/pdf'});}
              });
            },{rec:[...readFileSync('/tmp/v81-recepcion.pdf')],con:[...readFileSync('/tmp/v81-consolidacion.pdf')]});
            await ui.addScriptTag({path:'/tmp/v81/after/assets/js/compras-consultas-v66.js'});
            await ui.evaluate(()=>window.RutaHDComprasConsultas.mount(document.getElementById('test-root'),'recepciones'));
            for(const id of [12,13]){
              await ui.getByRole('button',{name:'Ver PDF de recepción '+id,exact:true}).click();
              const d=ui.locator('dialog');
              await d.getByRole('link',{name:'Descargar PDF'}).waitFor();
              if(!await d.locator('iframe').getAttribute('src'))throw Error('Falta vista previa');
              const actual=await ui.evaluate(()=>window.lastPdf);if(actual.kind!=='recepcion'||actual.id!==id)throw Error('Recepción incorrecta');
              await d.getByRole('button',{name:'Cerrar',exact:true}).click();
              await d.waitFor({state:'detached'});
            }
            await ui.evaluate(()=>{const root=document.getElementById('test-root');root.replaceChildren();window.RutaHDComprasConsultas.mount(root,'consolidaciones');});
            await ui.getByRole('button',{name:'Solicitudes 22',exact:true}).waitFor();
            await ui.getByRole('button',{name:'Ver PDF de consolidación 22',exact:true}).click();
            const d=ui.locator('dialog');await d.getByRole('link',{name:'Descargar PDF'}).waitFor();
            const pending=ui.waitForEvent('download');await d.getByRole('link',{name:'Descargar PDF'}).click();const dl=await pending;await dl.saveAs('/tmp/v81-descargado.pdf');
            if(!readFileSync('/tmp/v81-descargado.pdf').equals(readFileSync('/tmp/v81-consolidacion.pdf')))throw Error('PDF descargado no coincide');
            if(errors.length)throw Error(errors.join('; '));
            console.log('V81_UI_PDF_OK');
          }finally{await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: rutahd-v81-respaldo-previo
          path: /tmp/v81/before/
          retention-days: 30
          if-no-files-found: error
      - name: Publicar y cotejar bytes
        run: python /tmp/v81/transport.py publish
      - name: Verificar carga y protección JWT
        run: |
          set -euo pipefail
          cd /tmp/v81/browser
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto('https://rutahyd2.free.nf/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>!!window.RutaHDComprasConsultas?.mount,null,{timeout:45000});
            const result=await page.evaluate(async()=>{
              const version=[...document.scripts].some(s=>s.src.includes('compras-consultas-v66.js?v=20261125-v81'));
              const status=(await fetch('/api/v1/inventario-consultas/kardex',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              const draft=(await fetch('/api/v1/recepciones-borrador/1',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              const revision=(await fetch('/api/v1/recepciones-borrador/1/revision',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              const cancel=(await fetch('/api/v1/recepciones-borrador/1/anular',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:'{}',cache:'no-store'})).status;
              const confirm=(await fetch('/api/v1/recepciones-borrador/1/confirmar',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:'{}',cache:'no-store'})).status;
              const consolidation=(await fetch('/api/v1/consolidaciones-recepcion/1',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              const close=(await fetch('/api/v1/consolidaciones-recepcion/1/confirmar',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:'{}',cache:'no-store'})).status;
              const pdf=(await fetch('/api/v1/solicitudes-regularizacion/1/pdf',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              const retry=(await fetch('/api/v1/notificaciones-regularizacion/1/reenviar',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:'{}',cache:'no-store'})).status;
              const operationalPdf=(await fetch('/api/v1/documentos-recepcion/recepcion/1/pdf',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              return {version,status,draft,revision,cancel,confirm,consolidation,close,pdf,retry,operationalPdf};
            });
            if(response?.status()!==200||!result.version||result.status!==401||result.draft!==401||result.revision!==401||result.cancel!==401||result.confirm!==401||result.consolidation!==401||result.close!==401||result.pdf!==401||result.retry!==401||result.operationalPdf!==401||errors.length)throw Error(JSON.stringify({result,errors}));
            console.log('V81_PUBLIC_OK');
          }finally{await browser.close();}
          JS
      - name: Restaurar originales si falla la publicación
        if: failure()
        run: |
          if [ -f /tmp/v81/attempted ]; then python /tmp/v81/transport.py rollback; fi
