name: V82 - Publicar exportaciones del libro de compras
on:
  push:
    branches: [deploy/v82-exportacion-libro-20261125]
    paths: [.github/workflows/v82-publicar-exportaciones.yml]
permissions: {contents: read}
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Obtener fuentes fijadas y validar sintaxis
        run: |
          set -euo pipefail
          git clone -q --depth=1 --branch feature/v82-exportacion-libro-20261125 https://github.com/msanzana/rutahyd2front.git /tmp/front67
          git -C /tmp/front67 fetch -q --depth=1 origin 2a68f12e4180c81ecd6283f0014b60805f469782 ea00174a8fe173801b0ebb9e1b8b1be1205ce37c
          mkdir -p /tmp/v82
          cat > /tmp/v82/transport.py <<'PY'
          import os,ssl,ftplib,io,pathlib,subprocess,re,sys
          p=pathlib.Path('/tmp/v82')
          back='app/Http/Controllers/ComprasConsultasControlador.php'
          front=['assets/js/compras-consultas-v66.js']
          files=[back]+front+['index.html']
          guards={'root.guard':'/htdocs/.htaccess','api.guard':'/htdocs/api/.htaccess','private.guard':'/htdocs/api-v2/.htaccess','gateway.guard':'/htdocs/api/index.php'}
          def remote(n):return guards.get(n,('/htdocs/api-v2/' if n==back else '/htdocs/')+n)
          def get(f,n):
              b=io.BytesIO();f.retrbinary('RETR '+remote(n),b.write);return b.getvalue()
          def put(f,n,b):f.storbinary('STOR '+remote(n),io.BytesIO(b))
          def save(area,n,b):
              d=p/area/n;d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(b)
          def read(area,n):return (p/area/n).read_bytes()
          def git(repo,ref,n):return subprocess.check_output(['git','-C',repo,'show',ref+':'+n])
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(os.environ['FTP_HOST']);f.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);f.prot_p()
          with f:
              mode=sys.argv[1]
              if mode=='prepare':
                  for n in files+list(guards):save('before',n,get(f,n))
                  for n in [back]+front:
                      repo=os.environ['GITHUB_WORKSPACE'] if n==back else '/tmp/front67'
                      old='31e260847c6ba6b681944e1f6adcf1fd3aaa2bb3' if n==back else '2a68f12e4180c81ecd6283f0014b60805f469782'
                      new='f80fe20dee174acefb86d1d290c5a1caa45c6b5d' if n==back else 'ea00174a8fe173801b0ebb9e1b8b1be1205ce37c'
                      assert old!=new,'Base y destino idénticos'
                      if read('before',n)==git(repo,old,n):save('after',n,git(repo,new,n))
                      else:
                          save('after',n,read('before',n))
                          delta=subprocess.check_output(['git','-C',repo,'diff','--binary',old,new,'--',n])
                          assert delta.count(b'diff --git')==1,n
                          subprocess.run(['patch','--batch','--fuzz=0','-p1','-d',str(p/'after')],input=delta,check=True)
                  html=read('before','index.html').decode()
                  for n in front:
                      pattern=re.escape(n)+r'\?v=[^"\s]+'
                      matches=re.findall(pattern,html)
                      assert len(matches)==1,(n,matches)
                      html=html.replace(matches[0],n+'?v=20261125-v82',1)
                  save('after','index.html',html.encode())
                  print('V82_PRECHECK_OK')
              elif mode=='publish':
                  for n in files+list(guards):assert get(f,n)==read('before',n),n
                  (p/'attempted').touch()
                  for n in files:
                      with (p/'attempted').open('a') as log:log.write(n+'\n')
                      put(f,n,read('after',n))
                  for n in files:assert get(f,n)==read('after',n),n
                  for n in guards:assert get(f,n)==read('before',n),n
                  print('V82_FTPS_BYTES_OK')
              elif mode=='rollback':
                  for n in reversed((p/'attempted').read_text().splitlines()):put(f,n,read('before',n))
                  for n in files+list(guards):assert get(f,n)==read('before',n),n
                  print('V82_ROLLBACK_OK')
          PY
          python /tmp/v82/transport.py prepare
          node --check /tmp/v82/after/assets/js/compras-consultas-v66.js
          php -l /tmp/v82/after/app/Http/Controllers/ComprasConsultasControlador.php
      - name: Validar exportaciones reales con datos simulados
        run: |
          set -euo pipefail
          mkdir -p /tmp/v82/browser
          cd /tmp/v82/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const ui=await browser.newPage({acceptDownloads:true,viewport:{width:1440,height:900}});
            await ui.route('**/*',route=>route.abort());
            await ui.setContent('<main id="test-root"></main>');
            await ui.addStyleTag({path:'/tmp/front67/assets/css/tipos-documentos-v63.css'});
            await ui.evaluate(()=>{
              const records=Array.from({length:45},(_,i)=>({id:i+1,periodo_tributario:'2026-11',fecha_documento:'2026-11-20',documento:i===0?'Nota de crédito':'Factura electrónica',folio:String(i+1),rut_emisor:'RUT CI',razon_social_emisor:'Proveedor prueba',signo_contable:i===0?-1:1,monto_neto:'100.00000000',monto_exento:'0',monto_iva_recuperable:'19.00000000',monto_iva_no_recuperable:'0',monto_iva_uso_comun:'0',monto_impuestos_adicionales:'0',monto_retenciones:'0',monto_total:'119.00000000'}));
              window.RutaHDApiCatalogos=Object.freeze({purchaseConsultation:async(key,page,buscar,filters)=>{if(key!=='libro')throw Error('Módulo inesperado');if(filters.exportar==='1'){if(filters.proveedor!=='Proveedor prueba')throw Error('Filtro no conservado');return {data:records,total:records.length};}return {data:records.slice(0,25),total:45,last_page:2};}});
            });
            await ui.addScriptTag({path:'/tmp/v82/after/assets/js/compras-consultas-v66.js'});
            await ui.evaluate(()=>window.RutaHDComprasConsultas.mount(document.getElementById('test-root'),'libro'));
            await ui.getByLabel('Proveedor',{exact:true}).fill('Proveedor prueba');
            await ui.getByRole('button',{name:'Buscar',exact:true}).click();
            for(const kind of ['Excel','PDF']){
              const pending=ui.waitForEvent('download');
              await ui.getByRole('button',{name:'Exportar '+kind,exact:true}).click();
              const d=await pending;
              await d.saveAs('/tmp/v82/libro.'+(kind==='Excel'?'xlsx':'pdf'));
            }
            console.log('V82_DESCARGAS_OK');
          }finally{await browser.close();}
          JS
          python - <<'PY'
          import zipfile,xml.etree.ElementTree as E
          with zipfile.ZipFile('/tmp/v82/libro.xlsx') as z:
              assert z.testzip() is None
              ns={'s':'http://schemas.openxmlformats.org/spreadsheetml/2006/main'}
              sheet=E.fromstring(z.read('xl/worksheets/sheet1.xml'))
              rows=sheet.findall('s:sheetData/s:row',ns)
              assert len(rows)==47,len(rows)
              val=lambda ref:sheet.find(".//s:c[@r='"+ref+"']/s:v",ns).text
              assert val('G2')=='-100.00000000'
              assert val('N2')=='-119.00000000'
              assert val('G47')=='4300.00000000'
              assert val('N47')=='5117.00000000'
          print('V82_XLSX_TOTALES_OK')
          PY
          command -v pdfinfo >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          pdfinfo /tmp/v82/libro.pdf
          pdfinfo /tmp/v82/libro.pdf | grep -Eq 'Pages:[[:space:]]+2$'
          pdftotext -layout /tmp/v82/libro.pdf /tmp/v82/libro.txt
          grep -F '5117,00' /tmp/v82/libro.txt
          grep -F -- '-119,00' /tmp/v82/libro.txt
          echo V82_PDF_OK
      - uses: actions/upload-artifact@v4
        with:
          name: rutahd-v82-respaldo-previo
          path: /tmp/v82/before/
          retention-days: 30
          if-no-files-found: error
      - name: Publicar y cotejar bytes
        run: python /tmp/v82/transport.py publish
      - name: Verificar carga y protección JWT
        run: |
          set -euo pipefail
          cd /tmp/v82/browser
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();const errors=[];
            page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto('https://rutahyd2.free.nf/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>!!window.RutaHDComprasConsultas?.mount,null,{timeout:45000});
            const result=await page.evaluate(async()=>{
              const version=[...document.scripts].some(s=>s.src.includes('compras-consultas-v66.js?v=20261125-v82'));
              const status=(await fetch('/api/v1/inventario-consultas/kardex',{headers:{Accept:'application/json'},cache:'no-store'})).status;
              return {version,status};
            });
            if(response?.status()!==200||!result.version||result.status!==401||errors.length)throw Error(JSON.stringify({result,errors}));
            console.log('V82_PUBLIC_OK');
          }finally{await browser.close();}
          JS
      - name: Restaurar originales si falla la publicación
        if: failure()
        run: |
          if [ -f /tmp/v82/attempted ]; then python /tmp/v82/transport.py rollback; fi
