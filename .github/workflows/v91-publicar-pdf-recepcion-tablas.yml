name: V91 - PDF de recepcion con tablas
on:
  push:
    branches: [deploy/v91-pdf-recepcion-tablas-20261125]
    paths: [.github/workflows/v91-publicar-pdf-recepcion-tablas.yml]
permissions: {contents: read}
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: {{ secrets.INFINITYFREE_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, iconv
      - name: Validar exclusivamente nuevo PDF y paginacion
        run: |
          set -euo pipefail
          php -l app/Services/PdfRecepcionCompra.php
          php tests/pdf_recepcion_tablas_v91.php
          command -v pdftoppm >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          for f in /tmp/v91pdf/*.pdf; do
            pdfinfo "$f"
            pdftotext -layout "$f" "$f.txt"
            pdftotext -bbox "$f" "$f.xml"
            pdftoppm -r 100 -png "$f" "$f-page"
          done
          python - <<'PY'
          import pathlib, re, xml.etree.ElementTree as ET
          p=pathlib.Path('/tmp/v91pdf')
          a=(p/'recepcion-multipagina.pdf.txt').read_text()
          b=(p/'recepcion-borrador.pdf.txt').read_text()
          assert all(x in a for x in ['CI-5-2','DETALLE DE PRODUCTOS','DIFERENCIAS REGISTRADAS','FALTANTE','ABIERTA','TOTALES DE DOCUMENTOS','1.469.234','1.234,5678','99,5','OBSERVACIONES'])
          assert all(x in b for x in ['BORRADOR - NO CONFIRMADO','Sin diferencias registradas.'])
          assert re.findall(r'SKU-\d{3}',a)==[f'SKU-{i:03d}' for i in range(1,66)], 'SKU incompletos o repetidos'
          assert a.count('DETALLE DE PRODUCTOS')>=3, 'No se repite encabezado de tabla'
          for f in p.glob('*.xml'):
              root=ET.parse(f).getroot()
              pages=root.findall('.//{*}page')
              assert pages
              if 'multipagina' in f.name: assert len(pages)>=4
              for page in pages:
                  assert float(page.attrib['width'])==842 and float(page.attrib['height'])==595
                  words=page.findall('.//{*}word')
                  assert words
                  for word in words:
                      x0,y0,x1,y1=[float(word.attrib[k]) for k in ['xMin','yMin','xMax','yMax']]
                      assert x0>=26 and x1<=816 and y0>=10 and y1<=585, (f.name,word.text,x0,y0,x1,y1)
          print('V91_TABLES_PAGINATION_OK')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: rutahd-v91-muestras-pdf-sinteticas
          path: /tmp/v91pdf/
          retention-days: 14
          if-no-files-found: error
      - name: Preparar respaldo de servicio PDF
        run: |
          set -euo pipefail
          mkdir -p /tmp/v91
          cat >/tmp/v91/transport.py <<'PY'
          import os,ssl,ftplib,io,pathlib,subprocess,sys
          p=pathlib.Path('/tmp/v91')
          target='app/Services/PdfRecepcionCompra.php'
          paths={'pdf':'/htdocs/api-v2/'+target,'recepcion.guard':'/htdocs/api-v2/app/Http/Controllers/RecepcionesBorradorControlador.php','root.guard':'/htdocs/.htaccess','api.guard':'/htdocs/api/.htaccess','private.guard':'/htdocs/api-v2/.htaccess','gateway.guard':'/htdocs/api/index.php','index.guard':'/htdocs/index.html'}
          def get(f,n):
              b=io.BytesIO();f.retrbinary('RETR '+paths[n],b.write);return b.getvalue()
          def put(f,n,b):f.storbinary('STOR '+paths[n],io.BytesIO(b))
          def save(area,n,b):
              d=p/area/n;d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(b)
          def read(area,n):return (p/area/n).read_bytes()
          def verify(f,expected):
              for n in paths:assert get(f,n)==read(expected if n=='pdf' else 'before',n),n
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(os.environ['FTP_HOST']);f.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);f.prot_p()
          with f:
              mode=sys.argv[1]
              if mode=='prepare':
                  for n in paths:save('before',n,get(f,n))
                  old=subprocess.check_output(['git','show','00f609b835acccfd1a5970a4dc5ce4979650be07:'+target])
                  assert read('before','pdf')==old,'Servicio productivo diferente a la base auditada'
                  guard=subprocess.check_output(['git','show','00f609b835acccfd1a5970a4dc5ce4979650be07:app/Http/Controllers/RecepcionesBorradorControlador.php'])
                  assert read('before','recepcion.guard')==guard,'Controlador V87 diferente'
                  assert b'formularios-compactos-v90.css?v=20261125-v90' in read('before','index.guard'),'Falta referencia V90'
                  save('after','pdf',pathlib.Path(target).read_bytes())
                  print('V91_PRECHECK_OK')
              elif mode=='publish':
                  verify(f,'before');(p/'attempted').touch()
                  put(f,'pdf',read('after','pdf'));verify(f,'after')
                  print('V91_FTPS_BYTES_OK')
              elif mode=='rollback':
                  put(f,'pdf',read('before','pdf'));verify(f,'before')
                  print('V91_ROLLBACK_OK')
          PY
          python /tmp/v91/transport.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: rutahd-v91-respaldo-previo
          path: /tmp/v91/before/pdf
          retention-days: 30
          if-no-files-found: error
      - name: Preparar navegador de verificacion
        run: |
          mkdir -p /tmp/v91/browser
          cd /tmp/v91/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Publicar y cotejar solo el servicio PDF
        run: python /tmp/v91/transport.py publish
      - name: Verificar proteccion del PDF y preservacion V90
        run: |
          set -euo pipefail
          cd /tmp/v91/browser
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();
            const response=await page.goto('https://rutahyd2.free.nf/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>[...document.styleSheets].some(s=>s.href?.includes('formularios-compactos-v90.css?v=20261125-v90')),null,{timeout:45000});
            const result=await page.evaluate(async()=>({pdf:(await fetch('/api/v1/documentos-recepcion/recepcion/1/pdf',{headers:{Accept:'application/json'},cache:'no-store'})).status}));
            if(response?.status()!==200||result.pdf!==401)throw Error(JSON.stringify(result));
            console.log('V91_PUBLIC_OK');
          }finally{await browser.close();}
          JS
      - name: Restaurar servicio anterior si falla
        if: failure()
        run: |
          if [ -f /tmp/v91/attempted ]; then python /tmp/v91/transport.py rollback; fi
