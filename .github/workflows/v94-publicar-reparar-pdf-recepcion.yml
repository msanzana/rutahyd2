name: V94 - Reparacion PDF recepcion bajo Laravel
on:
  push:
    branches: [deploy/v94-reparar-pdf-recepcion-20261125]
    paths: [.github/workflows/v94-publicar-reparar-pdf-recepcion.yml]
permissions: {contents: read}
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, iconv, pdo_sqlite
      - name: Validar PDF bajo Laravel y ruta de controlador
        env:
          APP_ENV: testing
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: |
          set -euo pipefail
          php -l app/Services/PdfRecepcionCompra.php
          composer install --no-interaction --prefer-dist --no-progress
          php tests/pdf_recepcion_laravel_v94.php
          command -v pdftotext >/dev/null || (sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils)
          for f in /tmp/v94pdf/*.pdf; do
            pdfinfo "$f"
            pdftotext -layout "$f" "$f.txt"
            grep -F '000123' "$f.txt"
            grep -F 'DETALLE DE PRODUCTOS' "$f.txt"
            grep -F 'SKU-CI' "$f.txt"
          done
          grep -F 'Sin diferencias registradas.' /tmp/v94pdf/recepcion-1.pdf.txt
          grep -F 'FALTANTE' /tmp/v94pdf/recepcion-2.pdf.txt
          echo V94_PDF_OK
      - uses: actions/upload-artifact@v4
        with:
          name: rutahd-v94-muestras-pdf-sinteticas
          path: /tmp/v94pdf/
          retention-days: 14
          if-no-files-found: error
      - name: Preparar respaldo de servicio PDF
        run: |
          set -euo pipefail
          mkdir -p /tmp/v94
          cat >/tmp/v94/transport.py <<'PY'
          import os,ssl,ftplib,io,pathlib,subprocess,sys
          p=pathlib.Path('/tmp/v94')
          target='app/Services/PdfRecepcionCompra.php'
          paths={'pdf':'/htdocs/api-v2/'+target,'recepcion.guard':'/htdocs/api-v2/app/Http/Controllers/RecepcionesBorradorControlador.php','root.guard':'/htdocs/.htaccess','api.guard':'/htdocs/api/.htaccess','private.guard':'/htdocs/api-v2/.htaccess','gateway.guard':'/htdocs/api/index.php','index.guard':'/htdocs/index.html'}
          def get(f,n):
              b=io.BytesIO();f.retrbinary('RETR '+paths[n],b.write);return b.getvalue()
          def put(f,n,b):f.storbinary('STOR '+paths[n],io.BytesIO(b))
          def save(area,n,b):
              d=p/area/n;d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(b)
          def read(area,n):return (p/area/n).read_bytes()
          def verify(f,expected):
              for n in paths:assert get(f,n)==read(expected if n=='pdf' else 'before',n),n
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(os.environ['FTP_HOST']);f.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);f.prot_p()
          with f:
              mode=sys.argv[1]
              if mode=='prepare':
                  for n in paths:save('before',n,get(f,n))
                  old=subprocess.check_output(['git','show','4c44325272fb684f55cf0e7c651e19f4f09b1ee7:'+target])
                  assert read('before','pdf')==old,'Servicio productivo diferente a la base auditada'
                  guard=subprocess.check_output(['git','show','00f609b835acccfd1a5970a4dc5ce4979650be07:app/Http/Controllers/RecepcionesBorradorControlador.php'])
                  assert read('before','recepcion.guard')==guard,'Controlador V87 diferente'
                  assert b'validaciones-kardex-v93.css?v=20261125-v93' in read('before','index.guard'),'Falta referencia V93'
                  save('after','pdf',pathlib.Path(target).read_bytes())
                  print('V94_PRECHECK_OK')
              elif mode=='publish':
                  verify(f,'before');(p/'attempted').touch()
                  put(f,'pdf',read('after','pdf'));verify(f,'after')
                  print('V94_FTPS_BYTES_OK')
              elif mode=='rollback':
                  put(f,'pdf',read('before','pdf'));verify(f,'before')
                  print('V94_ROLLBACK_OK')
          PY
          python /tmp/v94/transport.py prepare
      - uses: actions/upload-artifact@v4
        with:
          name: rutahd-v94-respaldo-previo
          path: /tmp/v94/before/pdf
          retention-days: 30
          if-no-files-found: error
      - name: Preparar navegador de verificacion
        run: |
          mkdir -p /tmp/v94/browser
          cd /tmp/v94/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
      - name: Publicar y cotejar solo el servicio PDF
        run: python /tmp/v94/transport.py publish
      - name: Verificar proteccion del PDF y preservacion V93
        run: |
          set -euo pipefail
          cd /tmp/v94/browser
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();
            const response=await page.goto('https://rutahyd2.free.nf/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>[...document.styleSheets].some(s=>s.href?.includes('validaciones-kardex-v93.css?v=20261125-v93')),null,{timeout:45000});
            const result=await page.evaluate(async()=>({pdf:(await fetch('/api/v1/documentos-recepcion/recepcion/1/pdf',{headers:{Accept:'application/json'},cache:'no-store'})).status}));
            if(response?.status()!==200||result.pdf!==401)throw Error(JSON.stringify(result));
            console.log('V94_PUBLIC_OK');
          }finally{await browser.close();}
          JS
      - name: Restaurar servicio anterior si falla
        if: failure()
        run: |
          if [ -f /tmp/v94/attempted ]; then python /tmp/v94/transport.py rollback; fi
