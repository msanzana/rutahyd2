name: V95 - Recepción directa y cierre de OC
on:
  push:
    branches: [deploy/v95-recepcion-directa-20261125]
    paths: [.github/workflows/v95-publicar-recepcion-directa.yml]
permissions: {contents: read}
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: temporal_ci_solamente
          MARIADB_DATABASE: rutahd_v95_ci
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_mysql, iconv
      - name: Validar cierre directo aislado
        env:
          APP_ENV: testing
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: rutahd_v95_ci
          DB_USERNAME: root
          DB_PASSWORD: temporal_ci_solamente
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: log
        run: |
          set -euo pipefail
          php -l app/Http/Controllers/RecepcionesBorradorControlador.php
          composer install --no-interaction --prefer-dist --no-progress
          php tests/recepcion_directa_v95.php | tee /tmp/v95-test.log
          grep -Fx V95_DIRECTA_OK /tmp/v95-test.log
      - name: Preparar respaldo y delta exclusivo de interfaz
        run: |
          set -euo pipefail
          mkdir -p /tmp/v95/{before,after,browser,styles}
          git clone -q --depth=1 --branch feature/v95-recepcion-directa-20261125 https://github.com/msanzana/rutahyd2front.git /tmp/v95/front
          git -C /tmp/v95/front fetch -q --depth=1 origin b82375047ab38bd3a03adb1133e4a7b8678f72a6
          git -C /tmp/v95/front show b82375047ab38bd3a03adb1133e4a7b8678f72a6:assets/js/compras-consultas-v66.js > /tmp/v95/new.js
          git -C /tmp/v95/front fetch -q --depth=1 origin 4625093cc814695f8fcff3259462b024eb797db8
          git -C /tmp/v95/front show 4625093cc814695f8fcff3259462b024eb797db8:assets/js/compras-consultas-v66.js > /tmp/v95/old.js
          node --check /tmp/v95/new.js
          cat >/tmp/v95/transport.py <<'PY'
          import os,ssl,ftplib,io,pathlib,re,sys,html
          from html.parser import HTMLParser
          p=pathlib.Path('/tmp/v95')
          index='index.html'
          js='assets/js/compras-consultas-v66.js'
          back='app/Http/Controllers/RecepcionesBorradorControlador.php'
          guards={'pdf.guard':'/htdocs/api-v2/app/Services/PdfRecepcionCompra.php','consulta.guard':'/htdocs/api-v2/app/Http/Controllers/ComprasConsultasControlador.php','root.guard':'/htdocs/.htaccess','api.guard':'/htdocs/api/.htaccess','private.guard':'/htdocs/api-v2/.htaccess','gateway.guard':'/htdocs/api/index.php'}
          def remote(n):return guards.get(n,('/htdocs/api-v2/' if n==back else '/htdocs/')+n)
          def get(f,n):
              b=io.BytesIO();f.retrbinary('RETR '+remote(n),b.write);return b.getvalue()
          def absent(f,n):
              try:get(f,n);return False
              except ftplib.error_perm as e:
                  if str(e).startswith('550'):return True
                  raise
          def put(f,n,b):f.storbinary('STOR '+remote(n),io.BytesIO(b))
          def save(area,n,b):
              d=p/area/n;d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(b)
          def read(area,n):return (p/area/n).read_bytes()
          def verify_before(f):
              for n in [index,js,back,*guards]:assert get(f,n)==read('before',n),n
          class Links(HTMLParser):
              def __init__(self):super().__init__();self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='link' and a.get('rel')=='stylesheet':
                      href=a.get('href','').split('?')[0].lstrip('/')
                      if re.fullmatch(r'assets/css/[A-Za-z0-9_.-]+\.css',href):self.links.append(href)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(os.environ['FTP_HOST']);f.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);f.prot_p()
          with f:
              mode=sys.argv[1]
              if mode=='prepare':
                  for n in [index,js,back,*guards]:save('before',n,get(f,n))
                  src=read('before',index).decode()
                  assert src.count('</head>')==1 and 'validaciones-kardex-v93.css?v=20261125-v93' in src and 'compras-consultas-v66.js?v=20261125-v93' in src
                  assert read('before',js)==(p/'old.js').read_bytes(),'JS productivo diferente a la base auditada'
                  save('after',js,(p/'new.js').read_bytes())
                  import subprocess
                  assert read('before',back)==subprocess.check_output(['git','show','cf547761de869205b806564f3ced13650358af30:'+back]),'Backend productivo distinto de base auditada'
                  save('after',back,pathlib.Path(back).read_bytes())
                  src=src.replace('compras-consultas-v66.js?v=20261125-v93','compras-consultas-v66.js?v=20261125-v95',1)
                  save('after',index,src.encode())
                  parser=Links();parser.feed(src)
                  assert 'assets/css/app.css' in parser.links and 'assets/css/tipos-documentos-v63.css' in parser.links
                  for i,n in enumerate(parser.links):save('styles',f'{i:03d}.css',get(f,n))
                  print('V95_PRECHECK_OK',len(parser.links))
              elif mode=='publish':
                  verify_before(f)
                  (p/'attempted').touch()
                  for n in [back,js,index]:
                      with (p/'attempted').open('a') as log:log.write(n+'\n')
                      put(f,n,read('after',n))
                  for n in [back,js,index]:assert get(f,n)==read('after',n),n
                  for n in guards:assert get(f,n)==read('before',n),n
                  print('V95_FTPS_BYTES_OK')
              elif mode=='rollback':
                  for n in reversed((p/'attempted').read_text().splitlines()):
                      put(f,n,read('before',n))
                  verify_before(f)
                  print('V95_ROLLBACK_OK')
          PY
          python /tmp/v95/transport.py prepare
      - name: Validar delta visual de cierre y Kardex
        run: |
          set -euo pipefail
          cd /tmp/v95/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import {readdirSync} from 'node:fs';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:1440,height:900},reducedMotion:'reduce'});
            await page.route('**/*',r=>r.abort());
            await page.setContent('<main id="root"></main>');
            for(const f of readdirSync('/tmp/v95/styles').sort())await page.addStyleTag({path:'/tmp/v95/styles/'+f});
            await page.addScriptTag({path:'/tmp/v95/new.js'});
            await page.evaluate(()=>{
              window.completed=false;window.historical=false;
              window.RutaHDApiCatalogos={purchaseConsultation:async()=>({data:[{id:12,numero_interno:'REC-CI',estado:window.historical?'RECEPCIONADA':'PENDIENTE'}],total:1,last_page:1,bodegas:[]}),reviewReceiptDraft:async()=>({numero_interno:'REC-CI',resultado_previsto:'RECEPCIONADA',cierre_directo:true,cierre_habilitado:true,version_borrador:1,huella_revision:'a'.repeat(64),lineas:[],diferencias:[],saldos_oc:[]}),getReceiptDraft:async()=>({recepcion:{numero_interno:'REC-CI',estado:'RECEPCIONADA',version_borrador:2,folio:'CI',fecha_recepcion:'2026-11-25'},detalles:[],diferencias:[],completar_cierre_directo:true}),confirmReceiptDraft:async(id,p)=>{if(id!==12||!p.completar_cierre_directo||p.version_borrador!==2)throw Error('Payload incorrecto');window.completed=true;return {mensaje:'Cierre directo completado.'};}};
              window.mountCI=()=>window.RutaHDComprasConsultas.mount(document.getElementById('root'),'recepciones');window.mountCI();
            });
            await page.getByRole('button',{name:'Revisar diferencias 12'}).click();
            await page.getByText('Recepción única y completa:',{exact:false}).waitFor();
            await page.locator('dialog[open]').getByRole('button',{name:'Cerrar',exact:true}).last().click();
            await page.evaluate(()=>{window.historical=true;window.mountCI();});
            await page.getByRole('button',{name:'Ver recepción 12',exact:true}).click();
            await page.getByRole('button',{name:'Completar cierre directo'}).click();
            await page.waitForFunction(()=>window.completed);
            await page.getByText('Cierre directo completado.',{exact:true}).waitFor();
            console.log('V95_UI_OK');
          }finally{await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: rutahd-v95-respaldo-previo
          path: /tmp/v95/before/
          retention-days: 30
          if-no-files-found: error
      - name: Publicar y cotejar bytes
        run: python /tmp/v95/transport.py publish
      - name: Verificar carga de V95 y protección de confirmación
        run: |
          set -euo pipefail
          cd /tmp/v95/browser
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto('https://rutahyd2.free.nf/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>[...document.styleSheets].some(s=>s.href?.includes('validaciones-kardex-v93.css?v=20261125-v93')&&s.cssRules.length>=10),null,{timeout:45000});
            const result=await page.evaluate(async()=>({auth:(await fetch('/api/v1/recepciones-borrador/1/confirmar',{method:'POST',headers:{Accept:'application/json','Content-Type':'application/json'},body:JSON.stringify({completar_cierre_directo:true,version_borrador:1})})).status,density:getComputedStyle(document.documentElement).getPropertyValue('--hd-form-control').trim(),v86:[...document.scripts].some(s=>s.src.includes('compras-consultas-v66.js?v=20261125-v95'))}));
            if(response?.status()!==200||result.density!=='30px'||!result.v86||result.auth!==401||errors.length)throw Error(JSON.stringify({result,errors}));
            console.log('V95_PUBLIC_OK');
          }finally{await browser.close();}
          JS
      - name: Restaurar originales si falla la publicación
        if: failure()
        run: |
          if [ -f /tmp/v95/attempted ]; then python /tmp/v95/transport.py rollback; fi
