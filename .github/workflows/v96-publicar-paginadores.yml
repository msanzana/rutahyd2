name: V96 - Paginadores proporcionados
on:
  push:
    branches: [deploy/v96-paginadores-20261125]
    paths: [.github/workflows/v96-publicar-paginadores.yml]
permissions: {contents: read}
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Preparar respaldo y delta exclusivo de interfaz
        run: |
          set -euo pipefail
          mkdir -p /tmp/v96/{before,after,browser,styles}
          git clone -q --depth=1 --branch feature/v96-paginadores-20261125 https://github.com/msanzana/rutahyd2front.git /tmp/v96/front
          git -C /tmp/v96/front fetch -q --depth=1 origin dedf36663a49873639efe7e51096251d3695d2e7
          git -C /tmp/v96/front show dedf36663a49873639efe7e51096251d3695d2e7:assets/css/paginadores-v96.css > /tmp/v96/density.css
          cat >/tmp/v96/transport.py <<'PY'
          import os,ssl,ftplib,io,pathlib,re,sys,html
          from html.parser import HTMLParser
          p=pathlib.Path('/tmp/v96')
          css='assets/css/paginadores-v96.css'
          index='index.html'
          guards={'root.guard':'/htdocs/.htaccess','api.guard':'/htdocs/api/.htaccess','private.guard':'/htdocs/api-v2/.htaccess','gateway.guard':'/htdocs/api/index.php'}
          def remote(n):return guards.get(n,'/htdocs/'+n)
          def get(f,n):
              b=io.BytesIO();f.retrbinary('RETR '+remote(n),b.write);return b.getvalue()
          def absent(f,n):
              try:get(f,n);return False
              except ftplib.error_perm as e:
                  if str(e).startswith('550'):return True
                  raise
          def put(f,n,b):f.storbinary('STOR '+remote(n),io.BytesIO(b))
          def save(area,n,b):
              d=p/area/n;d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(b)
          def read(area,n):return (p/area/n).read_bytes()
          def verify_before(f):
              assert absent(f,css),'El CSS nuevo ya existe; detener'
              for n in [index,*guards]:assert get(f,n)==read('before',n),n
          class Links(HTMLParser):
              def __init__(self):super().__init__();self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='link' and a.get('rel')=='stylesheet':
                      href=a.get('href','').split('?')[0].lstrip('/')
                      if re.fullmatch(r'assets/css/[A-Za-z0-9_.-]+\.css',href):self.links.append(href)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(os.environ['FTP_HOST']);f.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);f.prot_p()
          with f:
              mode=sys.argv[1]
              if mode=='prepare':
                  assert absent(f,css),'Archivo nuevo ya existe'
                  save('before','absent-density.txt',css.encode())
                  for n in [index,*guards]:save('before',n,get(f,n))
                  src=read('before',index).decode()
                  assert src.count('</head>')==1 and css not in src and 'validaciones-kardex-v93.css?v=20261125-v93' in src
                  tag='  <link rel="stylesheet" href="'+css+'?v=20261125-v96">\n'
                  save('after',index,src.replace('</head>',tag+'</head>',1).encode())
                  save('after',css,(p/'density.css').read_bytes())
                  parser=Links();parser.feed(src)
                  assert 'assets/css/app.css' in parser.links and 'assets/css/tipos-documentos-v63.css' in parser.links
                  for i,n in enumerate(parser.links):save('styles',f'{i:03d}.css',get(f,n))
                  print('V96_PRECHECK_OK',len(parser.links))
              elif mode=='publish':
                  verify_before(f)
                  (p/'attempted').touch()
                  for n in [css,index]:
                      with (p/'attempted').open('a') as log:log.write(n+'\n')
                      put(f,n,read('after',n))
                  for n in [css,index]:assert get(f,n)==read('after',n),n
                  for n in guards:assert get(f,n)==read('before',n),n
                  print('V96_FTPS_BYTES_OK')
              elif mode=='rollback':
                  for n in reversed((p/'attempted').read_text().splitlines()):
                      if n==css:
                          if not absent(f,n):f.delete(remote(n))
                      else:put(f,n,read('before',n))
                  verify_before(f)
                  print('V96_ROLLBACK_OK')
          PY
          python /tmp/v96/transport.py prepare
      - name: Validar proporciones de paginadores y responsive
        run: |
          set -euo pipefail
          cd /tmp/v96/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import {readdirSync} from 'node:fs';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:1440,height:900},reducedMotion:'reduce'});
            await page.route('**/*',r=>r.abort());
            await page.setContent('<div id="workspaceContent"><nav class="list-pagination hd-numbered-pagination"><button class="hd-page-button hd-page-arrow" disabled>Anterior</button><span class="hd-page-numbers"><button class="hd-page-button hd-page-number is-current" aria-current="page">1</button><button class="hd-page-button hd-page-number">2</button><button class="hd-page-button hd-page-number">25</button></span><button class="hd-page-button hd-page-arrow">Siguiente</button><span class="list-pagination-info">25 registros</span></nav><section class="hd-v67"><div class="hd-doc-pager"><span>25 registros</span><button class="button ghost" disabled>‹</button><button class="button ghost is-current">1</button><button class="button ghost">25</button><button class="button ghost">›</button></div></section></div><dialog open class="hd-doc-modal hd-v67"><div class="hd-doc-pager"><span>25 registros</span><button class="button ghost">‹</button><button class="button ghost is-current">1</button><button class="button ghost">25</button><button class="button ghost">›</button></div></dialog>');
            for(const f of readdirSync('/tmp/v96/styles').sort())await page.addStyleTag({path:'/tmp/v96/styles/'+f});
            await page.addStyleTag({path:'/tmp/v96/density.css'});
            await page.addStyleTag({content:'*,*::before,*::after{animation:none!important;transition:none!important}'});
            for(const width of [1440,390]){
              await page.setViewportSize({width,height:844});
              for(const theme of ['claro','oscuro']){
                await page.evaluate(t=>document.documentElement.dataset.theme=t,theme);
                const result=await page.evaluate(()=>{
                  const metric=e=>{const b=e.getBoundingClientRect(),s=getComputedStyle(e);return {w:b.width,h:b.height,minW:parseFloat(s.minWidth),minH:parseFloat(s.minHeight),box:s.boxSizing,radius:s.borderTopLeftRadius,font:parseFloat(s.fontSize)}};
                  return {circles:[...document.querySelectorAll('.hd-page-number,.hd-doc-pager button')].map(metric),arrows:[...document.querySelectorAll('.hd-page-arrow')].map(metric),scroll:document.documentElement.scrollWidth,viewport:innerWidth};
                });
                const size=width===390?40:30;
                for(const c of result.circles)if(Math.abs(c.w-c.h)>0.3||Math.abs(c.w-size)>0.5||c.minW!==size||c.minH!==size||c.box!=='border-box'||c.radius!=='50%'||c.font<12)throw Error(JSON.stringify({width,theme,c}));
                for(const c of result.arrows)if(Math.abs(c.h-size)>0.5||c.w<75||c.box!=='border-box')throw Error(JSON.stringify({width,theme,c}));
                console.log('V96_PAGER_OK',width,theme,JSON.stringify(result));
              }
            }
          }finally{await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: rutahd-v96-respaldo-previo
          path: /tmp/v96/before/
          retention-days: 30
          if-no-files-found: error
      - name: Publicar y cotejar bytes
        run: python /tmp/v96/transport.py publish
      - name: Verificar carga del CSS nuevo en el sitio
        run: |
          set -euo pipefail
          cd /tmp/v96/browser
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto('https://rutahyd2.free.nf/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>[...document.styleSheets].some(s=>s.href?.includes('paginadores-v96.css?v=20261125-v96')&&s.cssRules.length>=7),null,{timeout:45000});
            const result=await page.evaluate(()=>({density:getComputedStyle(document.documentElement).getPropertyValue('--hd-page-size').trim(),v86:[...document.scripts].some(s=>/compras-consultas-v66\.js\?v=20261125-v(93|95)/.test(s.src))}));
            if(response?.status()!==200||result.density!=='30px'||!result.v86||errors.length)throw Error(JSON.stringify({result,errors}));
            console.log('V96_PUBLIC_OK');
          }finally{await browser.close();}
          JS
      - name: Restaurar originales si falla la publicación
        if: failure()
        run: |
          if [ -f /tmp/v96/attempted ]; then python /tmp/v96/transport.py rollback; fi
