name: V97 - Solicitudes de diferencias desde recepciones
on:
  push:
    branches: [deploy/v97-solicitudes-recepcion-20261125]
    paths: [.github/workflows/v97-publicar-solicitudes-recepcion.yml]
permissions: {contents: read}
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          tools: composer:v2
          extensions: mbstring, pdo_sqlite, iconv
      - name: Validar consulta documental aislada
        env:
          APP_ENV: testing
          APP_KEY: 'base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA='
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: log
        run: |
          set -euo pipefail
          php -l app/Http/Controllers/RecepcionesBorradorControlador.php
          php -l app/Http/Controllers/ComprasConsultasControlador.php
          composer install --no-interaction --prefer-dist --no-progress
          php tests/solicitudes_recepcion_v97.php | tee /tmp/v97-test.log
          grep -Fx V97_SOLICITUDES_OK /tmp/v97-test.log
      - name: Preparar respaldo y delta exclusivo de interfaz
        run: |
          set -euo pipefail
          mkdir -p /tmp/v97/{before,after,browser,styles}
          git clone -q --depth=1 --branch feature/v97-solicitudes-recepcion-20261125 https://github.com/msanzana/rutahyd2front.git /tmp/v97/front
          git -C /tmp/v97/front fetch -q --depth=1 origin 03ef772810bf5eb5f4c6e52163ee2c2e9fcc1a7c
          git -C /tmp/v97/front show 03ef772810bf5eb5f4c6e52163ee2c2e9fcc1a7c:assets/js/compras-consultas-v66.js > /tmp/v97/new.js
          git -C /tmp/v97/front fetch -q --depth=1 origin b82375047ab38bd3a03adb1133e4a7b8678f72a6
          git -C /tmp/v97/front show b82375047ab38bd3a03adb1133e4a7b8678f72a6:assets/js/compras-consultas-v66.js > /tmp/v97/old.js
          node --check /tmp/v97/new.js
          cat >/tmp/v97/transport.py <<'PY'
          import os,ssl,ftplib,io,pathlib,re,sys,html
          from html.parser import HTMLParser
          p=pathlib.Path('/tmp/v97')
          index='index.html'
          js='assets/js/compras-consultas-v66.js'
          back='app/Http/Controllers/RecepcionesBorradorControlador.php'
          back2='app/Http/Controllers/ComprasConsultasControlador.php'
          guards={'pdf.guard':'/htdocs/api-v2/app/Services/PdfRecepcionCompra.php','root.guard':'/htdocs/.htaccess','api.guard':'/htdocs/api/.htaccess','private.guard':'/htdocs/api-v2/.htaccess','gateway.guard':'/htdocs/api/index.php'}
          def remote(n):return guards.get(n,('/htdocs/api-v2/' if n in (back,back2) else '/htdocs/')+n)
          def get(f,n):
              b=io.BytesIO();f.retrbinary('RETR '+remote(n),b.write);return b.getvalue()
          def absent(f,n):
              try:get(f,n);return False
              except ftplib.error_perm as e:
                  if str(e).startswith('550'):return True
                  raise
          def put(f,n,b):f.storbinary('STOR '+remote(n),io.BytesIO(b))
          def save(area,n,b):
              d=p/area/n;d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(b)
          def read(area,n):return (p/area/n).read_bytes()
          def verify_before(f):
              for n in [index,js,back,back2,*guards]:assert get(f,n)==read('before',n),n
          class Links(HTMLParser):
              def __init__(self):super().__init__();self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='link' and a.get('rel')=='stylesheet':
                      href=a.get('href','').split('?')[0].lstrip('/')
                      if re.fullmatch(r'assets/css/[A-Za-z0-9_.-]+\.css',href):self.links.append(href)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(os.environ['FTP_HOST']);f.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);f.prot_p()
          with f:
              mode=sys.argv[1]
              if mode=='prepare':
                  for n in [index,js,back,back2,*guards]:save('before',n,get(f,n))
                  src=read('before',index).decode()
                  assert src.count('</head>')==1 and 'paginadores-v96.css?v=20261125-v96' in src and 'compras-consultas-v66.js?v=20261125-v95' in src
                  assert read('before',js)==(p/'old.js').read_bytes(),'JS productivo diferente a la base auditada'
                  save('after',js,(p/'new.js').read_bytes())
                  import subprocess
                  assert read('before',back)==subprocess.check_output(['git','show','7fe399a320e370ad43dc6c6c5a73b318be0bc6b8:'+back]),'Backend productivo distinto de base auditada'
                  save('after',back,pathlib.Path(back).read_bytes())
                  assert read('before',back2)==subprocess.check_output(['git','show','7fe399a320e370ad43dc6c6c5a73b318be0bc6b8:'+back2]),'Consulta productiva diferente'
                  save('after',back2,pathlib.Path(back2).read_bytes())
                  src=src.replace('compras-consultas-v66.js?v=20261125-v95','compras-consultas-v66.js?v=20261125-v97',1)
                  save('after',index,src.encode())
                  parser=Links();parser.feed(src)
                  assert 'assets/css/app.css' in parser.links and 'assets/css/tipos-documentos-v63.css' in parser.links
                  for i,n in enumerate(parser.links):save('styles',f'{i:03d}.css',get(f,n))
                  print('V97_PRECHECK_OK',len(parser.links))
              elif mode=='publish':
                  verify_before(f)
                  (p/'attempted').touch()
                  for n in [back,back2,js,index]:
                      with (p/'attempted').open('a') as log:log.write(n+'\n')
                      put(f,n,read('after',n))
                  for n in [back,back2,js,index]:assert get(f,n)==read('after',n),n
                  for n in guards:assert get(f,n)==read('before',n),n
                  print('V97_FTPS_BYTES_OK')
              elif mode=='rollback':
                  for n in reversed((p/'attempted').read_text().splitlines()):
                      put(f,n,read('before',n))
                  verify_before(f)
                  print('V97_ROLLBACK_OK')
          PY
          python /tmp/v97/transport.py prepare
      - name: Validar acceso a solicitudes y reintento explícito
        run: |
          set -euo pipefail
          cd /tmp/v97/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import {readdirSync} from 'node:fs';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:1440,height:900},reducedMotion:'reduce'});
            await page.route('**/*',r=>r.abort());
            await page.setContent('<main id="root"></main>');
            for(const f of readdirSync('/tmp/v97/styles').sort())await page.addStyleTag({path:'/tmp/v97/styles/'+f});
            await page.addScriptTag({path:'/tmp/v97/new.js'});
            await page.evaluate(()=>{
              window.generated=false;window.sent=false;window.opened=[];
              window.RutaHDApiCatalogos={purchaseConsultation:async()=>({data:[{id:12,numero_interno:'REC-CI',estado:'DESCUADRADA'}],total:1,last_page:1,bodegas:[]}),getReceiptDraft:async(id)=>{window.opened.push(id);return {estado_consolidacion:window.generated?'CONSOLIDADA':null,diferencias:[{tipo_diferencia:'DOCUMENTAL',cantidad_diferencia:'0',motivo:'Diferencia CI',estado_resolucion:'ABIERTA'}],solicitudes:window.generated?[{id:7,numero_interno:'SOL-CI-7',tipo_solicitud:'AVISO_COMERCIAL',estado:window.sent?'ENVIADA':'PENDIENTE',monto_total:'0',notificacion_id:9,estado_correo:window.sent?'ENVIADA':'ERROR',intentos:1,maximo_intentos:5}]:[]};},regularizationPdf:async(id)=>{if(id!==7)throw Error('PDF incorrecto');return new Blob(['%PDF-1.4'],{type:'application/pdf'});},retryRegularizationMail:async(id,p)=>{if(id!==9||!p.verificar_envio)throw Error('Reintento incorrecto');window.sent=true;return {estado:'ENVIADA'};}};
              window.RutaHDComprasConsultas.mount(document.getElementById('root'),'recepciones');
            });
            const action=page.getByRole('button',{name:'Solicitudes de diferencias 12',exact:true});
            await action.click();
            await page.getByText('Aún no existen solicitudes ni correos.',{exact:false}).waitFor();
            await page.getByText('Diferencia CI',{exact:true}).waitFor();
            await page.locator('dialog[open]').getByRole('button',{name:'Cerrar',exact:true}).last().click();
            await page.evaluate(()=>window.generated=true);
            await action.click();
            const dialog=page.locator('dialog[open]');
            await dialog.getByText('SOL-CI-7 · Aviso comercial',{exact:true}).waitFor();
            await dialog.getByRole('button',{name:'Ver PDF 7'}).click();
            await dialog.getByRole('link',{name:'Descargar PDF'}).waitFor();
            await dialog.getByRole('checkbox').check();
            await dialog.getByRole('button',{name:'Enviar correo'}).click();
            await dialog.getByText('Correo aceptado por el transporte.',{exact:false}).waitFor();
            if(!await page.evaluate(()=>window.sent&&window.opened.every(x=>x===12)))throw Error('Consulta o envío incorrecto');
            console.log('V97_UI_OK');
          }finally{await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: rutahd-v97-respaldo-previo
          path: /tmp/v97/before/
          retention-days: 30
          if-no-files-found: error
      - name: Publicar y cotejar bytes
        run: python /tmp/v97/transport.py publish
      - name: Verificar carga V97 y protección de consulta
        run: |
          set -euo pipefail
          cd /tmp/v97/browser
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto('https://rutahyd2.free.nf/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>[...document.styleSheets].some(s=>s.href?.includes('validaciones-kardex-v93.css?v=20261125-v93')&&s.cssRules.length>=10),null,{timeout:45000});
            const result=await page.evaluate(async()=>({auth:(await fetch('/api/v1/recepciones-borrador/1',{headers:{Accept:'application/json'}})).status,density:getComputedStyle(document.documentElement).getPropertyValue('--hd-form-control').trim(),v86:[...document.scripts].some(s=>s.src.includes('compras-consultas-v66.js?v=20261125-v97'))}));
            if(response?.status()!==200||result.density!=='30px'||!result.v86||result.auth!==401||errors.length)throw Error(JSON.stringify({result,errors}));
            console.log('V97_PUBLIC_OK');
          }finally{await browser.close();}
          JS
      - name: Restaurar originales si falla la publicación
        if: failure()
        run: |
          if [ -f /tmp/v97/attempted ]; then python /tmp/v97/transport.py rollback; fi
