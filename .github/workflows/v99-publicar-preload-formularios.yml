name: V99 - Preload circular en formularios
on:
  push:
    branches: [deploy/v99-preload-formularios-20261125]
    paths: [.github/workflows/v99-publicar-preload-formularios.yml]
permissions: {contents: read}
concurrency:
  group: rutahd2-ftps-staging
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      FTP_HOST: ftpupload.net
      FTP_USER: if0_43460400
      FTP_PASSWORD: ${{ secrets.INFINITYFREE_FTP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar respaldo y delta exclusivo de interfaz
        run: |
          set -euo pipefail
          mkdir -p /tmp/v99/{before,after,browser,styles}
          git clone -q --depth=1 --branch feature/v99-preload-formularios-20261125 https://github.com/msanzana/rutahyd2front.git /tmp/v99/front
          git -C /tmp/v99/front fetch -q --depth=1 origin 4820181a3301a912ba633a1b4737e8c2ab6596f6
          git -C /tmp/v99/front show 4820181a3301a912ba633a1b4737e8c2ab6596f6:assets/js/carga-global-v42.js > /tmp/v99/new.js
          git -C /tmp/v99/front fetch -q --depth=1 origin 03ef772810bf5eb5f4c6e52163ee2c2e9fcc1a7c
          git -C /tmp/v99/front show 03ef772810bf5eb5f4c6e52163ee2c2e9fcc1a7c:assets/js/carga-global-v42.js > /tmp/v99/old.js
          git -C /tmp/v99/front show 4820181a3301a912ba633a1b4737e8c2ab6596f6:assets/css/carga-global-v42.css > /tmp/v99/new.css
          git -C /tmp/v99/front show 03ef772810bf5eb5f4c6e52163ee2c2e9fcc1a7c:assets/css/carga-global-v42.css > /tmp/v99/old.css
          node --check /tmp/v99/new.js
          cat >/tmp/v99/transport.py <<'PY'
          import os,ssl,ftplib,io,pathlib,re,sys,html
          from html.parser import HTMLParser
          p=pathlib.Path('/tmp/v99')
          index='index.html'
          js='assets/js/carga-global-v42.js'
          css='assets/css/carga-global-v42.css'
          guards={'compras.guard':'/htdocs/assets/js/compras-consultas-v66.js','productos.guard':'/htdocs/assets/js/productos-remotos.js','recepcion.guard':'/htdocs/api-v2/app/Http/Controllers/RecepcionesBorradorControlador.php','stock.guard':'/htdocs/api-v2/app/Http/Controllers/ProductoComercialControlador.php','pdf.guard':'/htdocs/api-v2/app/Services/PdfRecepcionCompra.php','root.guard':'/htdocs/.htaccess','api.guard':'/htdocs/api/.htaccess','private.guard':'/htdocs/api-v2/.htaccess','gateway.guard':'/htdocs/api/index.php'}
          def remote(n):return guards.get(n,'/htdocs/'+n)
          def get(f,n):
              b=io.BytesIO();f.retrbinary('RETR '+remote(n),b.write);return b.getvalue()
          def absent(f,n):
              try:get(f,n);return False
              except ftplib.error_perm as e:
                  if str(e).startswith('550'):return True
                  raise
          def put(f,n,b):f.storbinary('STOR '+remote(n),io.BytesIO(b))
          def save(area,n,b):
              d=p/area/n;d.parent.mkdir(parents=True,exist_ok=True);d.write_bytes(b)
          def read(area,n):return (p/area/n).read_bytes()
          def verify_before(f):
              for n in [index,js,css,*guards]:assert get(f,n)==read('before',n),n
          class Links(HTMLParser):
              def __init__(self):super().__init__();self.links=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='link' and a.get('rel')=='stylesheet':
                      href=a.get('href','').split('?')[0].lstrip('/')
                      if re.fullmatch(r'assets/css/[A-Za-z0-9_.-]+\.css',href):self.links.append(href)
          f=ftplib.FTP_TLS(context=ssl.create_default_context(),timeout=45)
          f.connect(os.environ['FTP_HOST']);f.login(os.environ['FTP_USER'],os.environ['FTP_PASSWORD']);f.prot_p()
          with f:
              mode=sys.argv[1]
              if mode=='prepare':
                  for n in [index,js,css,*guards]:save('before',n,get(f,n))
                  src=read('before',index).decode()
                  assert src.count('</head>')==1 and 'paginadores-v96.css?v=20261125-v96' in src and 'compras-consultas-v66.js?v=20261125-v97' in src
                  assert read('before',js)==(p/'old.js').read_bytes(),'JS productivo diferente a la base auditada'
                  save('after',js,(p/'new.js').read_bytes())
                  assert read('before',css)==(p/'old.css').read_bytes(),'CSS de carga productivo diferente'
                  save('after',css,(p/'new.css').read_bytes())
                  src=src.replace('carga-global-v42.js?v=20261122-v42','carga-global-v42.js?v=20261125-v99',1)
                  src=src.replace('carga-global-v42.css?v=20261122-v42','carga-global-v42.css?v=20261125-v99',1)
                  save('after',index,src.encode())
                  parser=Links();parser.feed(src)
                  assert 'assets/css/app.css' in parser.links and 'assets/css/tipos-documentos-v63.css' in parser.links
                  for i,n in enumerate(parser.links):save('styles',f'{i:03d}.css',(p/'new.css').read_bytes() if n==css else get(f,n))
                  print('V99_PRECHECK_OK',len(parser.links))
              elif mode=='publish':
                  verify_before(f)
                  (p/'attempted').touch()
                  for n in [css,js,index]:
                      with (p/'attempted').open('a') as log:log.write(n+'\n')
                      put(f,n,read('after',n))
                  for n in [css,js,index]:assert get(f,n)==read('after',n),n
                  for n in guards:assert get(f,n)==read('before',n),n
                  print('V99_FTPS_BYTES_OK')
              elif mode=='rollback':
                  for n in reversed((p/'attempted').read_text().splitlines()):
                      put(f,n,read('before',n))
                  verify_before(f)
                  print('V99_ROLLBACK_OK')
          PY
          python /tmp/v99/transport.py prepare
      - name: Validar carga parcial, concurrencia y cierre de formularios
        run: |
          set -euo pipefail
          cd /tmp/v99/browser
          npm init -y >/dev/null
          npm install -q --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium >/dev/null
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import {readdirSync} from 'node:fs';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage({viewport:{width:1440,height:900},reducedMotion:'reduce'});
            await page.route('**/*',r=>r.abort());
            await page.setContent('<main id="root"></main>');
            for(const f of readdirSync('/tmp/v99/styles').sort())await page.addStyleTag({path:'/tmp/v99/styles/'+f});
            await page.addScriptTag({path:'/tmp/v99/new.js'});
            await page.evaluate(()=>{
              document.body.insertAdjacentHTML('beforeend','<dialog id="receipt"><div class="hd-doc-modal-scroll"><button id="exit">Cerrar</button></div></dialog><dialog id="crud"><div class="modal-body"><input aria-label="Campo"></div></dialog>');
              document.getElementById('receipt').showModal();
              window.a=RutaHDCarga.start({path:'/recursos/bodegas'});
              window.b=RutaHDCarga.start({path:'/ordenes-compra/7'});
            });
            const receipt=page.locator('#receipt'), loader=receipt.locator('.hd-form-loading');
            await loader.waitFor({state:'visible'});
            await loader.getByText('2 consultas en curso',{exact:false}).waitFor();
            if(await page.locator('dialog.hd-loading-overlay[open]').count())throw Error('Lectura local bloqueante');
            await page.evaluate(()=>window.a());
            await loader.waitFor({state:'visible'});
            await page.evaluate(()=>window.b());
            await loader.waitFor({state:'detached'});
            await page.evaluate(()=>{document.getElementById('crud').showModal();window.c=RutaHDCarga.start({path:'/catalogos'});});
            const crud=page.locator('#crud'), local=crud.locator('.hd-form-loading');
            await local.waitFor({state:'visible'});
            await page.setViewportSize({width:390,height:844});
            const metric=await local.locator('.hd-form-loading-ring').evaluate(e=>({w:e.getBoundingClientRect().width,h:e.getBoundingClientRect().height}));
            if(Math.abs(metric.w-metric.h)>0.5)throw Error('Anillo deformado');
            await page.evaluate(()=>document.getElementById('crud').close());
            await local.waitFor({state:'detached'});
            await page.evaluate(()=>{window.c();document.getElementById('receipt').close();});
            if(await page.evaluate(()=>RutaHDCarga.isLoading()))throw Error('Ticket huérfano');
            await page.evaluate(()=>{window.write=RutaHDCarga.start({path:'/productos/7',method:'PUT'});});
            await page.locator('dialog.hd-loading-overlay[open]').waitFor();
            await page.evaluate(()=>window.write());
            await page.locator('dialog.hd-loading-overlay[open]').waitFor({state:'hidden'});
            await page.evaluate(()=>{document.getElementById('receipt').showModal();window.d=RutaHDCarga.start({path:'/productos'});});
            await loader.waitFor({state:'visible'});
            await page.evaluate(()=>RutaHDCarga.reset());
            await loader.waitFor({state:'detached'});
            console.log('V99_UI_OK');
          }finally{await browser.close();}
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: rutahd-v99-respaldo-previo
          path: /tmp/v99/before/
          retention-days: 30
          if-no-files-found: error
      - name: Publicar y cotejar bytes
        run: python /tmp/v99/transport.py publish
      - name: Verificar carga del indicador V99
        run: |
          set -euo pipefail
          cd /tmp/v99/browser
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true});
          try{
            const page=await browser.newPage();
            const errors=[];page.on('pageerror',e=>errors.push(e.message));
            const response=await page.goto('https://rutahyd2.free.nf/',{waitUntil:'domcontentloaded',timeout:60000});
            await page.waitForFunction(()=>[...document.styleSheets].some(s=>s.href?.includes('carga-global-v42.css?v=20261125-v99')&&s.cssRules.length>=10),null,{timeout:45000});
            const result=await page.evaluate(async()=>({auth:(await fetch('/api/v1/recepciones-borrador/1',{headers:{Accept:'application/json'}})).status,density:getComputedStyle(document.documentElement).getPropertyValue('--hd-form-control').trim(),v86:[...document.scripts].some(s=>s.src.includes('carga-global-v42.js?v=20261125-v99'))}));
            if(response?.status()!==200||result.density!=='30px'||!result.v86||result.auth!==401||errors.length)throw Error(JSON.stringify({result,errors}));
            console.log('V99_PUBLIC_OK');
          }finally{await browser.close();}
          JS
      - name: Restaurar originales si falla la publicación
        if: failure()
        run: |
          if [ -f /tmp/v99/attempted ]; then python /tmp/v99/transport.py rollback; fi
